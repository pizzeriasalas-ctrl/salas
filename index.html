<style>
/* ============================================================
   DESIGN SYSTEM — Pizzería Salas / Salteñería Salas
   El color de acento es un solo "hue" (0-360, el círculo cromático
   completo) y el modo claro/oscuro es independiente. Cambiar --hue
   o [data-theme] cambia TODA la app sin tocar nada más.
   ============================================================ */
:root{
  --hue: 328; /* rosa por defecto */
  --accent: hsl(var(--hue) 68% 42%);
  --accent-hover: hsl(var(--hue) 68% 35%);
  --accent-light: hsl(var(--hue) 60% 93%);
  --bg: #faf8f8;
  --surface: #ffffff;
  --surface-2: hsl(var(--hue) 20% 96%);
  --text-primary: #211d20;
  --text-secondary: #7c7579;
  --border: hsl(var(--hue) 16% 89%);
  --success: #1f7a4d;
  --warning: #a16a12;
  --danger: #b23a2e;
  --info: #336a9e;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --shadow-sm: 0 1px 3px rgba(20,10,15,0.06);
  --shadow-md: 0 4px 16px rgba(20,10,15,0.08);
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px;
}
[data-theme="dark"]{
  --bg: hsl(var(--hue) 14% 9%);
  --surface: hsl(var(--hue) 13% 13%);
  --surface-2: hsl(var(--hue) 11% 17%);
  --text-primary: #f1edef;
  --text-secondary: #a79fa5;
  --border: hsl(var(--hue) 10% 23%);
  --accent: hsl(var(--hue) 48% 54%);
  --accent-hover: hsl(var(--hue) 48% 60%);
  --accent-light: hsl(var(--hue) 35% 22%);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.35);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text-primary);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.screen{max-width:480px;margin:0 auto;min-height:100vh;padding:0 0 32px;display:flex;flex-direction:column;}

.t-title{font-size:1.5rem;font-weight:700;margin:0 0 2px;letter-spacing:-0.01em;}
.t-subtitle{font-size:1.05rem;font-weight:600;margin:0 0 2px;}
.t-body{font-size:0.95rem;line-height:1.4;}
.t-secondary{font-size:0.85rem;color:var(--text-secondary);}
.t-price{font-size:1.6rem;font-weight:800;color:var(--accent);}
.t-eyebrow{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-secondary);font-weight:700;}

.px{padding-left:var(--space-4);padding-right:var(--space-4);}
.stack > * + *{margin-top:var(--space-3);}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;}
.grow{flex:1;}

.header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-4);}
.header-btn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;color:var(--text-primary);cursor:pointer;
}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:15px;border:none;border-radius:var(--radius-md);
  font-size:1rem;font-weight:700;cursor:pointer;transition:transform .08s ease;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:disabled{opacity:0.45;}
.btn-secondary{background:var(--accent-light);color:var(--accent);}
.btn-tertiary{background:transparent;color:var(--text-secondary);}
.btn-danger{background:#fde8e5;color:var(--danger);}
.mo-ov{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,10,15,.55);animation:fade .15s}
.mo-c{width:100%;max-width:480px;background:var(--surface);border-radius:20px 20px 0 0;padding:20px;}
.link-anular{background:none;border:0;color:var(--danger);font-weight:600;font-size:.8rem;padding:6px 0 6px 12px;cursor:pointer}
.anulada{opacity:.55}.anulada .t-body,.anulada strong{text-decoration:line-through}.anulada .badge,.anulada .t-secondary{text-decoration:none;display:inline-block}

.field{width:100%;}
.field label{display:block;font-size:0.82rem;color:var(--text-secondary);margin-bottom:6px;font-weight:600;}
.field input, .field select{
  width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-size:0.98rem;background:var(--surface);color:var(--text-primary);
}
.field input:focus, .field select:focus{outline:none;border-color:var(--accent);}
.search{position:relative;}
.search input{padding-left:38px;}
.search .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-secondary);}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:var(--space-4);box-shadow:var(--shadow-sm);
}
.card-flat{background:var(--surface-2);border-radius:var(--radius-md);padding:var(--space-4);}

.sucursal-item{
  display:flex;align-items:center;gap:var(--space-3);
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-md);
  padding:14px;margin-bottom:10px;cursor:pointer;
}
.sucursal-item .avatar{
  width:42px;height:42px;border-radius:12px;background:var(--accent-light);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;
}
.sucursal-item .info{flex:1;min-width:0;}
.sucursal-item .info .nombre{font-weight:700;font-size:0.98rem;}
.sucursal-item .info .zona{font-size:0.8rem;color:var(--text-secondary);}
.sucursal-item .arrow{color:var(--text-secondary);}

.compartimento-card{
  display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);
  padding:18px;cursor:pointer;
}
.compartimento-card .emoji{font-size:1.8rem;}
.compartimento-card .info .nombre{font-weight:700;font-size:1.05rem;}
.compartimento-card .info .turno{font-size:0.82rem;color:var(--text-secondary);}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:0.72rem;font-weight:700;}
.badge-neutral{background:var(--surface-2);color:var(--text-secondary);}
.badge-success{background:#e2f6ec;color:var(--success);}
.badge-warning{background:#fdf1de;color:var(--warning);}
.badge-danger{background:#fde8e5;color:var(--danger);}
.badge-accent{background:var(--accent-light);color:var(--accent);}

.alert{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;border-radius:var(--radius-md);font-size:0.88rem;}
.alert-info{background:var(--accent-light);color:var(--accent);}
.alert-warning{background:#fdf1de;color:var(--warning);}
.alert-danger{background:#fde8e5;color:var(--danger);}

.pin-dots{display:flex;gap:14px;justify-content:center;margin:var(--space-6) 0;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);}
.pin-dot.filled{background:var(--accent);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 var(--space-4);}
.keypad button{
  aspect-ratio:1;border-radius:var(--radius-lg);border:1px solid var(--border);
  background:var(--surface);font-size:1.4rem;font-weight:600;color:var(--text-primary);
}
.keypad button:active{background:var(--surface-2);}
.keypad button.ok{background:var(--accent);color:#fff;border-color:var(--accent);}

.stat-row{display:flex;gap:10px;}
.stat-box{flex:1;background:var(--surface-2);border-radius:var(--radius-md);padding:14px;text-align:center;}
.stat-box .valor{font-size:1.3rem;font-weight:800;}
.stat-box .lbl{font-size:0.75rem;color:var(--text-secondary);margin-top:2px;}

.toggle{display:flex;gap:8px;}
.toggle button{
  flex:1;padding:11px;border-radius:var(--radius-sm);border:1.5px solid var(--border);
  background:var(--surface);color:var(--text-primary);font-weight:700;font-size:0.9rem;
}
.toggle button.active{background:var(--accent);color:#fff;border-color:var(--accent);}

.hue-strip{
  height:44px;border-radius:22px;margin:var(--space-3) 0;position:relative;
  background:linear-gradient(to right,
    hsl(0 50% 45%), hsl(30 50% 45%), hsl(60 50% 42%), hsl(90 50% 40%),
    hsl(120 45% 38%), hsl(150 45% 38%), hsl(180 42% 40%), hsl(210 48% 45%),
    hsl(240 45% 48%), hsl(270 45% 45%), hsl(300 45% 42%), hsl(330 50% 42%), hsl(360 50% 45%));
}
.hue-strip input[type=range]{-webkit-appearance:none;width:100%;height:44px;background:transparent;margin:0;}
.hue-strip input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;
  border:3px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,0.3);
}
.swatch-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:var(--space-3);}
.swatch{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;}
.swatch.selected{border-color:var(--text-primary);}

.empty-state{text-align:center;padding:var(--space-8) var(--space-4);color:var(--text-secondary);}
.empty-state .icon{font-size:2.2rem;margin-bottom:8px;}
.error-text{color:var(--text-secondary);font-size:0.85rem;text-align:center;min-height:1.2em;}
.error-text.es-error{color:var(--danger);font-weight:600;}

.logo-mark{
  width:84px;height:84px;border-radius:24px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:2.2rem;
  box-shadow:var(--shadow-md);margin-bottom:var(--space-4);
}

/* --- Header enriquecido --- */
.avatar-circle{
  width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;flex-shrink:0;
}
.header-rich{display:flex;align-items:center;gap:12px;padding:var(--space-4);}
.bell-btn{position:relative;}
.bell-dot{
  position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;
  background:var(--danger);border:2px solid var(--surface);
}

/* --- Botón de acceso rápido con icono --- */
.quick-btn{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:var(--surface-2);border:none;border-radius:var(--radius-md);
  padding:14px 6px;font-size:0.78rem;font-weight:700;color:var(--text-primary);flex:1;
}
.quick-btn .ic{font-size:1.35rem;}

/* --- Gráfico de ventas por hora --- */
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:var(--space-3);}
.chart-bars .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.chart-bars .bar{width:100%;max-width:22px;border-radius:6px 6px 2px 2px;background:var(--accent-light);transition:height .3s ease;}
.chart-bars .bar.filled{background:var(--accent);}
.chart-bars .bar-lbl{font-size:0.62rem;color:var(--text-secondary);margin-top:4px;}

/* --- Navegación inferior fija (reutilizable) --- */
.bottom-nav{
  position:sticky;bottom:0;display:flex;background:var(--surface);
  border-top:1px solid var(--border);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));
  margin-top:auto;
}
.bottom-nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:none;border:none;color:var(--text-secondary);font-size:0.66rem;font-weight:700;padding:4px;
}
.bottom-nav button .ic{font-size:1.3rem;}
.bottom-nav button.active{color:var(--accent);}
.sync-pill{position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top,0px));z-index:50;
  padding:6px 14px;border-radius:20px;font-size:.74rem;font-weight:700;box-shadow:var(--shadow-md);max-width:92%;text-align:center}
.sync-pill.off{background:#fdf1de;color:#7a4e0a;border:1px solid #e8c88a}
.sync-pill.sync{background:var(--accent-light);color:var(--accent);border:1px solid var(--accent)}
.sync-pill.ok{background:#e2f6ec;color:#1f7a4d;border:1px solid #9fd8b9}
.sync-pill[hidden]{display:none}
.nota-hist{font-size:.78rem;color:var(--text-secondary);text-align:center}
/* --- Etapa 3 (v2): más color y vida, pedido con varios productos --- */
.logo-svg{display:block;flex-shrink:0}
.sk{border-radius:var(--radius-md);background:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:sk 1.2s infinite linear}
@keyframes sk{to{background-position:-200% 0}}
.btn-primary{background:linear-gradient(135deg,var(--accent),hsl(calc(var(--hue) + 22) 66% 46%))}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{display:flex;align-items:center;gap:10px;padding:14px 12px;border-radius:var(--radius-lg);background:hsl(var(--kh) 75% 93%);color:hsl(var(--kh) 55% 22%)}
.kpi .kic{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:hsl(var(--kh) 65% 40%);color:#fff}
.kpi .kv{font-size:1.3rem;font-weight:800;line-height:1.1}
.kpi .kl{font-size:.78rem;font-weight:600;opacity:.85;margin-top:2px}
.kpi.main{background:linear-gradient(135deg,var(--accent),hsl(calc(var(--hue) + 28) 68% 44%));color:#fff;box-shadow:var(--shadow-md)}
.kpi.main .kic{background:rgba(255,255,255,.22)}
.k-caja{--kh:calc(var(--hue) - 30)}.k-gasto{--kh:calc(var(--hue) + 30)}.k-gan{--kh:calc(var(--hue) - 60)}
[data-theme="dark"] .kpi:not(.main){background:hsl(var(--kh) 28% 18%);color:hsl(var(--kh) 60% 86%)}
.c-pizza{--ch:var(--hue)}.c-saltena{--ch:calc(var(--hue) + 20)}.c-refresco{--ch:calc(var(--hue) - 20)}.c-cafe{--ch:calc(var(--hue) + 40)}.c-caja{--ch:calc(var(--hue) - 40)}.c-otro{--ch:calc(var(--hue) + 60)}
#tabs-producto{flex-wrap:wrap;gap:6px}
#tabs-producto button{flex:1 1 auto;border-color:hsl(var(--ch) 55% 72%);color:hsl(var(--ch) 55% 30%);background:hsl(var(--ch) 80% 95%)}
#tabs-producto button.active{background:hsl(var(--ch) 65% 40%);border-color:hsl(var(--ch) 65% 40%);color:#fff}
[data-theme="dark"] #tabs-producto button{background:hsl(var(--ch) 26% 16%);color:hsl(var(--ch) 60% 85%);border-color:hsl(var(--ch) 30% 30%)}
[data-theme="dark"] #tabs-producto button.active{background:hsl(var(--ch) 55% 42%);color:#fff}
.btn.opt{background:hsl(var(--ch) 80% 92%);color:hsl(var(--ch) 55% 26%);flex-direction:column;gap:2px;padding:16px 8px;font-size:1.05rem;border-radius:16px}
.btn.opt small{font-size:.82rem;font-weight:700;opacity:.8}
[data-theme="dark"] .btn.opt{background:hsl(var(--ch) 26% 20%);color:hsl(var(--ch) 60% 88%)}
.lin{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:44px;height:44px;border-radius:50%;border:none;background:var(--accent-light);color:var(--accent);font-size:1.4rem;font-weight:800}
.qty span{min-width:22px;text-align:center;font-weight:800;font-size:1.15rem}
.pedido{margin-top:14px;padding-top:6px;border-top:2px dashed var(--border);animation:fade .2s}
.toggle.pago button{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;font-size:1.05rem}
.btn-cobrar{padding:20px;font-size:1.2rem;margin-top:10px}
.ok-ov{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(20,10,15,.55);animation:fade .15s;pointer-events:none}
.ok-c{width:96px;height:96px;border-radius:50%;background:var(--success);color:#fff;display:flex;align-items:center;justify-content:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.ok-t{color:#fff;font-size:1.4rem;font-weight:800;margin-top:8px}.ok-s{color:#fff;font-size:1.1rem;opacity:.9}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div id="sync-pill" class="sync-pill" hidden></div>
<div id="app" class="screen"><div class="px" style="padding-top:20px;display:flex;flex-direction:column;gap:12px;"><div class="sk" style="height:44px;width:65%"></div><div class="sk" style="height:96px"></div><div class="sk" style="height:96px"></div><div class="sk" style="height:56px"></div></div></div>

<script>
// ============================================================
// 1) TEMA — hue (0-360) + modo claro/oscuro, guardado por dispositivo
// ============================================================
function cargarTema() {
  const hue = localStorage.getItem('salas_hue');
  const modo = localStorage.getItem('salas_modo');
  if (hue) document.documentElement.style.setProperty('--hue', hue);
  if (modo === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
}
function aplicarHue(hue) {
  document.documentElement.style.setProperty('--hue', hue);
  localStorage.setItem('salas_hue', hue);
}
function aplicarModo(modo) {
  if (modo === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  localStorage.setItem('salas_modo', modo);
}
cargarTema();

// ============================================================
// 2) Conexión a Firebase (proyecto real: salas-94cef) — SIN CAMBIOS
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyDBH5au_DZDSUItcZtMuFXHIW_2mEJEG3o",
  authDomain: "salas-94cef.firebaseapp.com",
  projectId: "salas-94cef",
  storageBucket: "salas-94cef.firebasestorage.app",
  messagingSenderId: "537826891275",
  appId: "1:537826891275:web:f8ad974c16f973fbf3d90e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
db.enablePersistence({ synchronizeTabs: true }).catch(err => {
  console.warn('No se pudo activar persistencia offline:', err.code);
});

// Lecturas rápidas sin internet: si no hay conexión (o el servidor tarda >4 s) se usa la copia local.
(function () {
  const F = firebase.firestore;
  function parchar(C, esDoc) {
    const orig = C.prototype.get;
    C.prototype.get = function (opts) {
      if (opts && opts.source) return orig.call(this, opts);
      const self = this;
      const cache = () => orig.call(self, { source: 'cache' }).catch(e => {
        if (esDoc) return { exists: false, id: self.id, ref: self, data: () => undefined };
        throw e;
      });
      if (!navigator.onLine) return cache();
      return Promise.race([orig.call(self), new Promise((_, rej) => setTimeout(() => rej(new Error('lento')), 4000))]).catch(cache);
    };
  }
  parchar(F.DocumentReference, true);
  parchar(F.Query, false);
})();

// Instalable + funciona sin internet
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

// Indicador discreto de conexión / sincronización
(function () {
  const pill = () => document.getElementById('sync-pill');
  let t;
  function mostrar(txt, cls, ms) {
    const p = pill(); if (!p) return;
    clearTimeout(t); p.hidden = false; p.className = 'sync-pill ' + cls; p.textContent = txt;
    if (ms) t = setTimeout(() => { p.hidden = true; }, ms);
  }
  function estado() {
    if (!navigator.onLine) return mostrar('Sin internet · todo se guarda en este equipo', 'off');
    mostrar('Sincronizando…', 'sync');
    db.waitForPendingWrites().then(() => mostrar('Todo sincronizado', 'ok', 2500)).catch(() => {});
  }
  window.addEventListener('offline', estado);
  window.addEventListener('online', estado);
  window.addEventListener('load', () => { if (!navigator.onLine) estado(); });
})();


async function cargarSucursales() {

function conTiempoLimite(promesa, ms, etiqueta) {
  return Promise.race([
    promesa,
    new Promise((_, reject) => setTimeout(() => reject(new Error('TIMEOUT:' + etiqueta)), ms))

}

function guardarSinBloquear(promesa) {
  // Firestore ya guarda el cambio en el dispositivo apenas se llama esta función
  // (y lo sincroniza solo cuando vuelva a haber internet). No esperamos a que el
  // servidor lo confirme, porque sin conexión esa confirmación nunca llega y la
  // interfaz se quedaría pegada en "Guardando…" para siempre.
  Promise.resolve(promesa).catch(() => {});
  return Promise.resolve();
}

    return Object.assign(
      db.collection('sucursales').doc(sucursalActual.id).collection('compartimentos').doc('pizzeria')
        .collection('stock').doc(slug(nombreCorto)),

        .collection('stock').doc('saltena-mixta'),

      db.collection('sucursales').doc(sucursalActual.id).collection('stockRefrescos').doc(slug(nombreCorto)),

// Anula una venta o un gasto: no se borra, queda marcado con su motivo, y se revierte caja (y stock en ventas).
async function anularMovimiento(tipo, m) {
  const esVenta = tipo === 'venta';
  const detalle = esVenta ? `${m.cantidad > 1 ? m.cantidad + 'x ' : ''}${m.producto} · ${m.monto.toFixed(2)} Bs` : `${m.motivo} · ${m.monto.toFixed(2)} Bs`;
  const motivo = await pedirMotivoAnulacion(esVenta ? 'Anular venta' : 'Anular gasto', detalle);
  if (!motivo) return false;
  const compRef = db.collection('sucursales').doc(sucursalActual.id).collection('compartimentos').doc(compartimentoActual);
  const docRef = compRef.collection(esVenta ? 'ventas' : 'gastos').doc(m.id);
  const inc = n => firebase.firestore.FieldValue.increment(n);
  try {
    const [sd, sc] = await conTiempoLimite(Promise.all([docRef.get(), compRef.get()]), 10000, 'anular');
    if (!sd.exists) throw new Error('NO_EXISTE');
    if (sd.data().anulado) throw new Error('YA_ANULADO');
    const c = sc.exists ? sc.data() : {};
    const esEf = m.formaPago === 'efectivo';
    if (esVenta && ((c.cajaTotal || 0) + 0.01 < m.monto || (esEf && (c.cajaEfectivo || 0) + 0.01 < m.monto))) throw new Error('CAJA_RETIRADA');
    await guardarSinBloquear(docRef.update({ anulado: true, anuladoMotivo: motivo, anuladoEn: firebase.firestore.Timestamp.now() }));
    if (esVenta) {
      const r = referenciaStock(m.producto);
      if (r) await guardarSinBloquear(r.set({ producto: r.nombreCorto, cantidad: inc(m.cantidad) }, { merge: true }));
      await guardarSinBloquear(compRef.set({ cajaEfectivo: inc(esEf ? -m.monto : 0), cajaTotal: inc(-m.monto) }, { merge: true }));
    } else {
      await guardarSinBloquear(compRef.set({ cajaEfectivo: inc(m.monto), cajaTotal: inc(m.monto) }, { merge: true }));
    }
    m.anulado = true; m.anuladoMotivo = motivo;
    return true;
  } catch (e) {
    const k = (e && e.message) || '';
    alert(k === 'CAJA_RETIRADA' ? 'No se puede anular: la caja ya no tiene ese dinero (puede que ya se haya retirado). Avisa a la dueña.'
      : k === 'YA_ANULADO' ? 'Este movimiento ya estaba anulado.'
      : 'No se pudo anular. Intenta de nuevo.');
    return false;
  }
}

          </div>
  `;
  document.getElementById('btn-atras').onclick = pantallaSeleccionSucursal;
  document.getElementById('btn-tema').onclick = () => abrirSelectorTema(pantallaElegirCompartimento);
  if (tienePizza) document.getElementById('btn-pizzeria').onclick = () => pantallaPin('pizzeria');
  if (tiene) document.getElementById('btn-salteneria').onclick = () => pantallaPin('salteneria');
}

// ============================================================
// 8) PANTALLA: Ingreso por PIN
// ============================================================
function pantallaPin(compartimento) {
  let pin = '';
  const nombreComp = compartimento === 'pizzeria' ? 'Pizzería' : 'Salteñería';

  function render() {
    app.innerHTML = `
      <div class="header">
        <button class="header-btn" id="btn-atras">${ic('back')}</button>
        <div class="t-subtitle">Ingresa tu PIN</div>
        <div style="width:38px;"></div>
      </div>
      <div class="px center">
        <div class="badge badge-accent">${nombreComp}</div>
        <div class="t-secondary" style="margin-top:6px;">${sucursalActual.nombre}</div>
      </div>
      <div class="pin-dots">
        ${[0,1,2,3].map(i => `<div class="pin-dot ${i < pin.length ? 'filled' : ''}"></div>`).join('')}
      </div>
      <div class="keypad">
        ${[1,2,3,4,5,6,7,8,9].map(n => `<button data-n="${n}">${n}</button>`).join('')}
        <button data-n="borrar">${ic('backspace',20)}</button>
        <button data-n="0">0</button>
        <button data-n="ok" class="ok">${ic('check',20)}</button>
      </div>
      <div class="error-text" id="pin-error" style="margin-top:var(--space-4);"></div>
    `;
    document.getElementById('btn-atras').onclick = pantallaElegirCompartimento;
    document.querySelectorAll('.keypad button').forEach(b => {
      b.onclick = () => {
        const n = b.dataset.n;
        if (n === 'borrar') pin = pin.slice(0, -1);
        else if (n === 'ok') validar();
        else if (pin.length < 4) pin += n;
        render();
      };
    });
  }

  async function validar() {
    const comp = sucursalActual.compartimentos[compartimento];
    if (pin === comp.pin) {
      compartimentoActual = compartimento;
      app.innerHTML = `<div class="empty-state">Entrando…</div>`;
      try {
        await pantallaPrincipal();
      } catch (e) {
        mostrarError('cargar la pantalla principal', e);
      }
    } else {
      document.getElementById('pin-error').textContent = 'PIN incorrecto, intenta de nuevo';
      pin = '';
      render();
    }
  }

  render();
}

// 9) PANTALLA: Inicio del empleado (lógica de ventas sin cambios)
// ============================================================
async function pantallaPrincipal() {
  const comp = sucursalActual.compartimentos[compartimentoActual];
  const nombreComp = compartimentoActual === 'pizzeria' ? 'Pizzería' : 'Salteñería';
  const compRef = db.collection('sucursales').doc(sucursalActual.id)
    .collection('compartimentos').doc(compartimentoActual);
  const ventasRef = compRef.collection('ventas');
  app.innerHTML = esqueleto();

  await Promise.race([cargarCatalogo().catch(() => {}), new Promise(r => setTimeout(r, 2500))]);
  const tabsDisponibles = compartimentoActual === 'pizzeria'
    ? [
        { id: 'pizza', lbl: ic('pizza',16)+' Pizza' },
        { id: 'refresco', lbl: ic('drink',16)+' Refresco' },
        { id: 'cafe', lbl: ic('coffee',16)+' Café/Té' },
        ...(sucursalActual.tieneCajasPizza ? [{ id: 'caja', lbl: ic('box',16)+' Cajas' }] : [])
      ]
    : [{ id: 'saltena', lbl: ic('empanada',16)+' Salteña' }, { id: 'refresco', lbl: ic('drink',16)+' Refresco' }, { id: 'cafe', lbl: ic('coffee',16)+' Café/Té' }];
  const tabsBase = tabsDisponibles.slice();
  let extrasArea = [], ocultos = new Set();
  const tabDe = p => tabsBase.some(t => t.id === p.categoria) ? p.categoria : 'otro';
  function recalcularCatalogo() {
    extrasArea = CATALOGO.filter(p => !p.base && p.activo !== false && p.area === compartimentoActual);
    ocultos = new Set(CATALOGO.filter(p => p.base && p.oculto).map(p => p.nombre));
    tabsDisponibles.length = 0; tabsBase.forEach(t => tabsDisponibles.push(t));
    if (extrasArea.some(p => tabDe(p) === 'otro')) tabsDisponibles.push({ id: 'otro', lbl: ic('box',16)+' Otros' });
  }
  const extrasDeTab = id => extrasArea.filter(p => tabDe(p) === id);
  const ver = n => !ocultos.has(n);
  recalcularCatalogo();

  let tabActiva = tabsDisponibles[0].id;
  let pizzaTamano = null;
  let productoElegido = null; // texto final que se guarda como venta

  function armarSelectorProducto() {
    return `
      <div class="toggle" id="tabs-producto">
        ${tabsDisponibles.map(t => `<button class="c-${t.id} ${t.id===tabActiva?'active':''}" data-tab="${t.id}">${t.lbl}</button>`).join('')}

      <div id="extras-producto"></div>

    `;
  }

  function renderOpcionesBase() {
    const cont = document.getElementById('opciones-producto');
    if (!cont) return;
    if (tabActiva === 'pizza') {
      if (!pizzaTamano) {
        cont.innerHTML = `
          <div class="t-eyebrow" style="margin-bottom:6px;">Tamaño</div>
          <div class="stat-row" style="flex-wrap:wrap;">
            ${TAMANOS_PIZZA.filter(t => SABORES_PIZZA[t].length ? SABORES_PIZZA[t].some(sb => ver('Pizza ' + t + ' ' + sb)) : ver('Pizza ' + t)).map(t => `<button class="btn opt c-${tabActiva}" data-tamano="${t}" style="flex:1 1 45%;">${t}</button>`).join('')}
          </div>
        `;
        cont.querySelectorAll('[data-tamano]').forEach(b => {
          b.onclick = () => { pizzaTamano = b.dataset.tamano; renderOpciones(); };
        });
      } else if (SABORES_PIZZA[pizzaTamano].length === 0) {
        seleccionarProducto(`Pizza ${pizzaTamano}`);
        pizzaTamano = null;
      } else {
        cont.innerHTML = `
          <div class="row"><div class="t-eyebrow">Sabor — ${pizzaTamano}</div><button class="t-secondary" id="btn-cambiar-tamano" style="background:none;border:none;">‹ cambiar tamaño</button></div>
          <div class="stat-row" style="flex-wrap:wrap;margin-top:6px;">
            ${SABORES_PIZZA[pizzaTamano].filter(sb => ver('Pizza ' + pizzaTamano + ' ' + sb)).map(s => `<button class="btn opt c-${tabActiva}" data-sabor="${s}" style="flex:1 1 45%;">${s}${ph('Pizza '+pizzaTamano+' '+s)}</button>`).join('')}
          </div>
        `;
        document.getElementById('btn-cambiar-tamano').onclick = () => { pizzaTamano = null; renderOpciones(); };
        const tamanoCongelado = pizzaTamano;
        cont.querySelectorAll('[data-sabor]').forEach(b => {
          b.onclick = () => { seleccionarProducto(`Pizza ${tamanoCongelado} ${b.dataset.sabor}`); pizzaTamano = null; };
        });
      }
    } else if (tabActiva === 'saltena') {
      cont.innerHTML = ver('Salteña mixta') ? `<button class="btn opt c-${tabActiva}" id="btn-saltena">Salteña mixta${ph('Salteña mixta')}</button>` : '';
      const bsal = document.getElementById('btn-saltena'); if (bsal) bsal.onclick = () => seleccionarProducto('Salteña mixta');
    } else if (tabActiva === 'refresco') {
      cont.innerHTML = `
        <div class="stat-row" style="flex-wrap:wrap;">
          ${TAMANOS_REFRESCO.filter(t => ver('Refresco ' + t)).map(t => `<button class="btn opt c-${tabActiva}" data-refresco="${t}" style="flex:1 1 30%;">${t}${ph('Refresco '+t)}</button>`).join('')}
        </div>
      `;
      cont.querySelectorAll('[data-refresco]').forEach(b => {
        b.onclick = () => seleccionarProducto(`Refresco ${b.dataset.refresco}`);
      });
    } else if (tabActiva === 'cafe') {
      cont.innerHTML = `
        <div class="stat-row">
          ${ver('Café') ? `<button class="btn opt c-${tabActiva}" data-cafe="Café">Café${ph('Café')}</button>` : ''}
          ${ver('Té') ? `<button class="btn opt c-${tabActiva}" data-cafe="Té">Té${ph('Té')}</button>` : ''}
        </div>
      `;
      cont.querySelectorAll('[data-cafe]').forEach(b => {
        b.onclick = () => seleccionarProducto(b.dataset.cafe);
      });
    } else if (tabActiva === 'caja') {
      cont.innerHTML = `
        <div class="stat-row">
          ${TAMANOS_CAJA.filter(t => ver('Caja ' + t)).map(t => `<button class="btn opt c-${tabActiva}" data-caja="${t}">${t}${ph('Caja '+t)}</button>`).join('')}
        </div>
      `;
      cont.querySelectorAll('[data-caja]').forEach(b => {
        b.onclick = () => seleccionarProducto(`Caja ${b.dataset.caja}`);
      });
    }
  }

  let preciosActuales = {}, preciosSucursal = {};
  // Precio de la sucursal manda; si no tiene, se usa el del producto en el catálogo
  function armarPrecios() {
    preciosActuales = Object.assign({}, preciosSucursal);
    extrasArea.forEach(p => { if (preciosActuales[p.nombre] == null && p.precio > 0) preciosActuales[p.nombre] = p.precio; });
  }
  let cantidadVenta = 1;
  function actualizarTotalVenta() {
    const campo = document.getElementById('in-monto');
    const lblCant = document.getElementById('lbl-cantidad');
    const lblTotal = document.getElementById('lbl-total-venta');
    if (!campo || !lblCant || !lblTotal) return;
    const unitario = parseFloat(campo.value) || 0;
    lblCant.textContent = cantidadVenta;
    lblTotal.textContent = unitario > 0 ? `Total: ${(unitario * cantidadVenta).toFixed(2)} Bs` : '';
  }
  function seleccionarProducto(nombre) {
    productoElegido = nombre;
    const lbl = document.getElementById('producto-elegido-lbl');
    const btnAgregar = document.getElementById('btn-agregar');
    const inMonto = document.getElementById('in-monto');
    if (lbl) lbl.innerHTML = `<span class="badge badge-accent">Elegido: ${nombre}</span>`;
    if (btnAgregar) btnAgregar.disabled = false;
    if (inMonto) {
      const precioFijo = preciosActuales[nombre];
      if (precioFijo != null) {
        inMonto.value = precioFijo;
        inMonto.readOnly = true;
      } else {
        inMonto.value = '';
        inMonto.readOnly = false;
      }
      actualizarTotalVenta();
    }
  }

  function wireSelectorProducto() {
    document.querySelectorAll('#tabs-producto button').forEach(b => {
      b.onclick = () => {
        tabActiva = b.dataset.tab; pizzaTamano = null; productoElegido = null;
        document.querySelectorAll('#tabs-producto button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        const lbl = document.getElementById('producto-elegido-lbl'); if (lbl) lbl.innerHTML = '';
        const btnAgregar = document.getElementById('btn-agregar'); if (btnAgregar) btnAgregar.disabled = true;
        renderOpciones();
      };
    });
    renderOpciones();
  }

  let formaPago = 'efectivo';
  let ultimaVenta = null; // para "Deshacer última venta"
  const carrito = new Map(); // clave -> { producto, cantidad, unitario }
  const bs = n => (Math.round(n * 100) / 100).toFixed(2).replace(/\.00$/, '') + ' Bs';
  const inc = n => firebase.firestore.FieldValue.increment(n);
  const ph = n => (preciosActuales[n] != null ? `<small>${bs(preciosActuales[n])}</small>` : '');

  function confirmacion(t) {
    const d = document.createElement('div'); d.className = 'ok-ov';
    d.innerHTML = `<div class="ok-c">${ic('check', 52)}</div><div class="ok-t">¡Venta lista!</div><div class="ok-s">${bs(t)}</div>`;
    document.body.appendChild(d); setTimeout(() => d.remove(), 1100);
  }
  function pintarPedido(err) {
    const el = document.getElementById('pedido'); if (!el) return;
    if (!carrito.size) { el.innerHTML = ''; return; }
    let t = 0; carrito.forEach(l => { t += l.cantidad * l.unitario; });
    el.innerHTML = `<div class="pedido"><div class="t-eyebrow">Pedido (${carrito.size})</div>
      ${[...carrito].map(([k, l]) => `<div class="lin"><div class="grow"><div class="t-body"><b>${l.producto}</b></div><div class="t-secondary">${bs(l.unitario)} c/u · ${bs(l.unitario * l.cantidad)}</div></div><div class="qty"><button data-m="${k}">−</button><span>${l.cantidad}</span><button data-s="${k}">+</button></div></div>`).join('')}
      <div class="toggle pago" style="margin-top:12px;"><button data-pago="efectivo" class="${formaPago === 'efectivo' ? 'active' : ''}">${ic('cash', 20)} Efectivo</button><button data-pago="qr" class="${formaPago === 'qr' ? 'active' : ''}">${ic('phone', 20)} QR</button></div>
      <div class="error-text es-error">${err || ''}</div>
      <button class="btn btn-primary btn-cobrar" id="cobrar">Cobrar ${bs(t)}</button></div>`;
    el.querySelectorAll('[data-m]').forEach(b => { b.onclick = () => { const l = carrito.get(b.dataset.m); if (--l.cantidad <= 0) carrito.delete(b.dataset.m); pintarPedido(); }; });
    el.querySelectorAll('[data-s]').forEach(b => { b.onclick = () => { carrito.get(b.dataset.s).cantidad++; pintarPedido(); }; });
    el.querySelectorAll('[data-pago]').forEach(b => { b.onclick = () => { formaPago = b.dataset.pago; pintarPedido(); }; });
    el.querySelector('#cobrar').onclick = async () => {
      el.querySelector('#cobrar').disabled = true;
      try {
        const lineas = [...carrito.values()].map(l => ({ producto: l.producto, cantidad: l.cantidad, unitario: l.unitario, monto: l.unitario * l.cantidad }));
        const necesita = {};
        lineas.forEach(l => { necesita[l.producto] = (necesita[l.producto] || 0) + l.cantidad; });
        for (const p in necesita) {
          const r = referenciaStock(p);
          if (r) {
            const snap = await conTiempoLimite(r.get(), 8000, 'leer stock');
            if ((snap.exists ? (snap.data().cantidad || 0) : 0) < necesita[p]) throw new Error('SIN_STOCK:' + p);
          }
        }
        const fp = formaPago; let total = 0;
        for (const l of lineas) {
          l.refStock = referenciaStock(l.producto);
          if (l.refStock) await guardarSinBloquear(l.refStock.set({ producto: l.refStock.nombreCorto, cantidad: inc(-l.cantidad) }, { merge: true }));
          l.ref = ventasRef.doc();
          await guardarSinBloquear(l.ref.set({ producto: l.producto, cantidad: l.cantidad, precioUnitario: l.unitario, monto: l.monto, formaPago: fp, fecha: hoyISO(), creadoEn: firebase.firestore.Timestamp.now(), schemaVersion: 1 }));
          total += l.monto;
        }
        // La caja se acumula hasta que la dueña la retira (no se reinicia cada día)
        await guardarSinBloquear(compRef.set({ cajaEfectivo: inc(fp === 'efectivo' ? total : 0), cajaTotal: inc(total) }, { merge: true }));
        ultimaVenta = { lineas, total, formaPago: fp };
        carrito.clear(); confirmacion(total);
        await render();
      } catch (e) {
        const m = (e && e.message) || '';
        pintarPedido(m.startsWith('SIN_STOCK:') ? `No hay suficiente stock de "${m.slice(10)}".` : 'No se pudo guardar. Intenta de nuevo.');
      }
    };
  }
  async function deshacer() {
    const u = ultimaVenta; if (!u) return;
    if (!confirm(`¿Deshacer la última venta de ${bs(u.total)}?`)) return;
    ultimaVenta = null;
    for (const l of u.lineas) {
      if (l.refStock) await guardarSinBloquear(l.refStock.set({ producto: l.refStock.nombreCorto, cantidad: inc(l.cantidad) }, { merge: true }));
      await guardarSinBloquear(l.ref.delete());
    }
    await guardarSinBloquear(compRef.set({ cajaEfectivo: inc(u.formaPago === 'efectivo' ? -u.total : 0), cajaTotal: inc(-u.total) }, { merge: true }));
    await render();
  }

  function renderExtras() {
    const el = document.getElementById('extras-producto'); if (!el) return;
    const ex = extrasDeTab(tabActiva);
    if (!ex.length) { el.innerHTML = ''; return; }
    el.innerHTML = `<div class="t-eyebrow" style="margin:10px 0 6px;">${tabActiva === 'otro' ? 'Productos' : 'Otros productos'}</div><div class="stat-row" style="flex-wrap:wrap;">${ex.map(p => `<button class="btn opt c-${tabActiva}" data-extra="${p.nombre}" style="flex:1 1 45%;">${p.nombre}${ph(p.nombre)}</button>`).join('')}</div>`;
    el.querySelectorAll('[data-extra]').forEach(b => { b.onclick = () => seleccionarProducto(b.dataset.extra); });
  }
  function renderOpciones() { renderOpcionesBase(); renderExtras(); }

  async function cargarVentasHoy() {
    const hoy = hoyISO();
    const snap = await conTiempoLimite(ventasRef.where('fecha', '==', hoy).get(), 15000, 'cargar ventas de hoy');
    const lista = snap.docs.map(d => ({ ...d.data(), id: d.id }));
    lista.sort((a, b) => {
      const ta = a.creadoEn && a.creadoEn.toMillis ? a.creadoEn.toMillis() : 0;
      const tb = b.creadoEn && b.creadoEn.toMillis ? b.creadoEn.toMillis() : 0;
      return tb - ta;
    });
    return lista;
  }

  async function render() {
    const [ventasTodas, snapComp, snapGastosHoy] = await Promise.all([
      cargarVentasHoy(), compRef.get(),
      compRef.collection('gastos').where('fecha', '==', hoyISO()).get().catch(() => ({ docs: [] }))
    ]);
    const ventas = ventasTodas.filter(v => !v.anulado);
    const gastosHoyTotal = snapGastosHoy.docs.filter(d => !d.data().anulado).reduce((a, d) => a + (d.data().monto || 0), 0);
    const totalEfectivo = ventas.filter(v => v.formaPago === 'efectivo').reduce((a, v) => a + v.monto, 0);
    const totalQr = ventas.filter(v => v.formaPago === 'qr').reduce((a, v) => a + v.monto, 0);
    const totalHoy = totalEfectivo + totalQr;
    const cajaEfectivoActual = snapComp.exists ? (snapComp.data().cajaEfectivo || 0) : 0;
    const gananciaHoy = totalHoy - gastosHoyTotal;
    const fechaHoyTexto = new Date().toLocaleDateString('es-BO', { weekday: 'long', day: 'numeric', month: 'long' });

    // Ventas por hora (real, a partir de los timestamps de hoy)
    const horaInicio = 8, horaFin = 21; // franja horaria típica de atención
    const porHora = {};
    for (let h = horaInicio; h <= horaFin; h++) porHora[h] = 0;
    ventas.forEach(v => {
      if (v.creadoEn && v.creadoEn.toDate) {
        const h = v.creadoEn.toDate().getHours();
        if (porHora[h] !== undefined) porHora[h] += v.monto;
      }
    });
    const maxHora = Math.max(1, ...Object.values(porHora));
    const horasAMostrar = [8,10,12,14,16,18,20];
    const iniciales = (comp.empleadoNombre.replace(' (prueba)','').match(/\b\w/g) || ['E']).slice(0,2).join('').toUpperCase();

    preciosSucursal = snapComp.exists ? (snapComp.data().precios || {}) : {};
    armarPrecios();

    app.innerHTML = `
      <div class="header-rich">
        ${logo(44)}
        <div class="grow">
          <div class="t-subtitle">Hola, ${comp.empleadoNombre.replace(' (prueba)','')}</div>
          <div class="t-secondary">${sucursalActual.nombre.replace(' (PRUEBA)','')} · ${nombreComp}</div>
        </div>
        <button class="header-btn bell-btn" id="btn-tema">${ic('palette')}</button>
        <button class="header-btn" id="btn-salir">${ic('logout')}</button>
      </div>
      <div class="px stack">
        <div class="t-secondary" style="text-transform:capitalize;margin-top:-6px;">${fechaHoyTexto}</div>
        <div class="kpis">
          <div class="kpi main"><span class="kic">${ic('cart',22)}</span><div><div class="kv">${bs(totalHoy)}</div><div class="kl">Ventas hoy</div></div></div>
          <div class="kpi k-caja"><span class="kic">${ic('cash',22)}</span><div><div class="kv">${bs(cajaEfectivoActual)}</div><div class="kl">Caja efectivo</div></div></div>
          <div class="kpi k-gasto"><span class="kic">${ic('wallet',22)}</span><div><div class="kv">${bs(gastosHoyTotal)}</div><div class="kl">Gastos hoy · ${nombreComp}</div></div></div>
          <div class="kpi ${gananciaHoy >= 0 ? 'k-gan' : 'k-gasto'}"><span class="kic">${ic('check',22)}</span><div><div class="kv">${bs(gananciaHoy)}</div><div class="kl">Ganancia hoy · ${nombreComp}</div></div></div>
        </div>

        <button class="btn btn-primary" id="btn-mostrar-form">+ Registrar venta</button>

        <div class="card" id="form-venta" style="display:none;">
          ${armarSelectorProducto()}
          <div class="field" style="margin-top:12px;"><label>Precio unitario en Bs</label><input type="number" id="in-monto" inputmode="decimal" placeholder="0.00"></div>
          <div class="field" style="margin-top:10px;">
            <label>Cantidad</label>
            <div class="row" style="gap:10px;">
              <button class="header-btn" id="btn-menos-cant">−</button>
              <span id="lbl-cantidad" style="min-width:30px;text-align:center;font-weight:700;font-size:1.1rem;">1</span>
              <button class="header-btn" id="btn-mas-cant">+</button>
              <span class="t-secondary" id="lbl-total-venta" style="margin-left:auto;"></span>
            </div>
          </div>
          <button class="btn btn-secondary" id="btn-agregar" style="margin-top:12px;" disabled>+ Agregar al pedido</button>
          <div class="error-text" id="venta-error"></div>
          <div id="pedido"></div>
        </div>
        ${ultimaVenta ? `<button class="btn btn-danger" id="btn-deshacer">↩ Deshacer última venta (${bs(ultimaVenta.total)})</button>` : ''}

        <div class="t-eyebrow" style="margin-top:var(--space-2);">Ventas de hoy (${ventas.length})</div>
        <div class="card-flat">
          ${ventasTodas.length === 0 ? `<div class="t-secondary">Aún no hay ventas registradas hoy.</div>` : ventasTodas.map(v => `
            <div class="row ${v.anulado ? 'anulada' : ''}" style="padding:6px 0;border-bottom:1px solid var(--border);">
              <span class="t-body">${v.cantidad > 1 ? v.cantidad + 'x ' : ''}${v.producto} <span class="t-secondary">${v.formaPago === 'qr' ? 'QR' : 'Efectivo'}</span>${v.anulado ? ` <span class="badge badge-danger">Anulada</span> <span class="t-secondary">${escHtml(v.anuladoMotivo || '')}</span>` : ''}</span>
              <span style="display:flex;align-items:center;"><strong>${v.monto.toFixed(2)} Bs</strong>${v.anulado ? '' : `<button class="link-anular" data-anular-venta="${v.id}">Anular</button>`}</span>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="bottom-nav">
        <button class="active"><span class="ic">${ic('home')}</span>Inicio</button>
        <button id="btn-ir-stock-nav"><span class="ic">${ic('box')}</span>Stock</button>
        <button data-nav="historial"><span class="ic">${ic('clock')}</span>Historial</button>
        <button data-nav="caja"><span class="ic">${ic('wallet')}</span>Caja</button>
      </div>
    `;

    document.getElementById('btn-tema').onclick = () => abrirSelectorTema(render);
    document.getElementById('btn-salir').onclick = () => { compartimentoActual = null; pantallaElegirCompartimento(); };
    document.getElementById('btn-ir-stock-nav').onclick = () => pantallaStock().catch(e => mostrarError('abrir stock', e));
    document.querySelectorAll('[data-nav="historial"]').forEach(b => {
      b.onclick = () => pantallaHistorial().catch(e => mostrarError('abrir historial', e));
    });
    document.querySelectorAll('[data-nav="caja"]').forEach(b => {
      b.onclick = () => pantallaCaja().catch(e => mostrarError('abrir caja', e));
    });
    const abrirForm = () => {
      document.getElementById('form-venta').style.display = 'block';
      document.getElementById('btn-mostrar-form').style.display = 'none';
      cantidadVenta = 1;
      wireSelectorProducto();
      pintarPedido();
    };
    document.getElementById('btn-mostrar-form').onclick = abrirForm;
    if (carrito.size) abrirForm();
    const bd = document.getElementById('btn-deshacer');
    if (bd) bd.onclick = () => deshacer().catch(e => mostrarError('deshacer venta', e));
    document.querySelectorAll('[data-anular-venta]').forEach(b => { b.onclick = async () => {
      const v = ventasTodas.find(x => x.id === b.dataset.anularVenta);
      if (v && await anularMovimiento('venta', v)) { ultimaVenta = null; await render(); }
    }; });

    document.getElementById('btn-mas-cant').onclick = () => { cantidadVenta++; actualizarTotalVenta(); };
    document.getElementById('btn-menos-cant').onclick = () => { if (cantidadVenta > 1) cantidadVenta--; actualizarTotalVenta(); };
    document.getElementById('in-monto').oninput = actualizarTotalVenta;

    document.getElementById('btn-agregar').onclick = () => {
      const producto = productoElegido;
      const unitario = parseFloat(document.getElementById('in-monto').value);
      const errorEl = document.getElementById('venta-error');
      if (!producto || isNaN(unitario) || unitario <= 0) {
        errorEl.textContent = 'Elige un producto y un precio válido';
        return;
      }
      errorEl.textContent = '';
      const k = producto + '|' + unitario;
      if (carrito.has(k)) carrito.get(k).cantidad += cantidadVenta;
      else carrito.set(k, { producto, cantidad: cantidadVenta, unitario });
      productoElegido = null; cantidadVenta = 1; pizzaTamano = null;
      const inM = document.getElementById('in-monto'); inM.value = ''; inM.readOnly = false;
      document.getElementById('producto-elegido-lbl').innerHTML = '';
      document.getElementById('btn-agregar').disabled = true;
      actualizarTotalVenta(); renderOpciones(); pintarPedido();
    };
  }


  // Si la dueña cambia el catálogo mientras la app está abierta, se actualiza sola (sin perder el pedido en curso)
  escucharCatalogo(() => {
    recalcularCatalogo(); armarPrecios();
    const tabs = document.getElementById('tabs-producto');
    if (!tabs) return;
    if (!tabsDisponibles.some(x => x.id === tabActiva)) { tabActiva = tabsDisponibles[0].id; pizzaTamano = null; productoElegido = null; }
    tabs.innerHTML = tabsDisponibles.map(x => `<button class="c-${x.id} ${x.id===tabActiva?'active':''}" data-tab="${x.id}">${x.lbl}</button>`).join('');
    wireSelectorProducto();
  });
  await render();
}
