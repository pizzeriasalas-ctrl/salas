<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Salas · Prueba Firebase</title>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --pink:#e91e8c; --pink-dark:#b3126a; --pink-soft:#fde3f1;
    --bg:#fff7fb; --text:#2c1a24; --muted:#8a7480; --card:#fff; --border:#f3d7e8;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);}
  .screen{max-width:480px;margin:0 auto;padding:20px 16px 40px;min-height:100vh;}
  h1{font-size:1.3rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:0.85rem;margin-bottom:20px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;}
  .btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:var(--pink);color:#fff;font-size:1rem;font-weight:600;margin-top:10px;cursor:pointer;}
  .btn.secondary{background:var(--pink-soft);color:var(--pink-dark);}
  .btn:disabled{opacity:0.5;}
  select,input{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:1rem;margin-top:6px;background:#fff;color:var(--text);}
  label{font-size:0.85rem;color:var(--muted);}
  .pin-display{display:flex;gap:10px;justify-content:center;margin:16px 0;}
  .pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--pink);}
  .pin-dot.filled{background:var(--pink);}
  .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .pin-pad button{padding:18px 0;font-size:1.3rem;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--text);}
  .estado{font-size:0.78rem;text-align:center;color:var(--muted);margin-bottom:10px;}
  .estado.ok{color:#1a9e5c;}
  .estado.off{color:#c0392b;}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .chip{background:var(--pink-soft);color:var(--pink-dark);padding:4px 10px;border-radius:20px;font-size:0.75rem;font-weight:600;}
  .venta-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:0.9rem;}
  .monto{font-size:2rem;font-weight:800;color:var(--pink-dark);text-align:center;}
  .lbl{text-align:center;color:var(--muted);font-size:0.8rem;margin-bottom:10px;}
  .error{color:#c0392b;font-size:0.85rem;text-align:center;margin-top:8px;min-height:1.2em;}
  .hidden{display:none !important;}
  .toggle{display:flex;gap:8px;margin-top:6px;}
  .toggle button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:#fff;color:var(--text);font-weight:600;}
  .toggle button.active{background:var(--pink);color:#fff;border-color:var(--pink);}
</style>
</head>
<body>

<div id="app" class="screen">Cargando…</div>

<script>
// ---------- 1) Conexión a Firebase (proyecto real de doña Vivi: salas-94cef) ----------
const firebaseConfig = {
  apiKey: "AIzaSyDBH5au_DZDSUItcZtMuFXHIW_2mEJEG3o",
  authDomain: "salas-94cef.firebaseapp.com",
  projectId: "salas-94cef",
  storageBucket: "salas-94cef.firebasestorage.app",
  messagingSenderId: "537826891275",
  appId: "1:537826891275:web:f8ad974c16f973fbf3d90e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// Deja que seguros funcione offline (guarda localmente y sincroniza cuando haya internet)
db.enablePersistence({ synchronizeTabs: true }).catch(err => {
  console.warn('No se pudo activar persistencia offline:', err.code);
});

// ---------- 2) Datos de la sucursal de PRUEBA ----------
// Esto es solo para probar la conexión. Cuando funcione, la dueña
// podrá crear sucursales reales desde su panel en vez de estar fijo en el código.
const SUCURSAL_PRUEBA_ID = 'periferica_prueba';
const SUCURSAL_PRUEBA_NOMBRE = 'Periférica (PRUEBA)';
const PIN_PIZZERIA_PRUEBA = '1111';
const PIN_SALTENERIA_PRUEBA = '2222';

async function asegurarSucursalPrueba() {
  const ref = db.collection('sucursales').doc(SUCURSAL_PRUEBA_ID);
  const snap = await ref.get();
  if (!snap.exists) {
    await ref.set({
      nombre: SUCURSAL_PRUEBA_NOMBRE,
      activo: true,
      tieneSalteneria: true,
      tieneCajasPizza: true,
      compartimentos: {
        pizzeria: { empleadoNombre: 'Empleado Pizzería (prueba)', pin: PIN_PIZZERIA_PRUEBA },
        salteneria: { empleadoNombre: 'Empleado Salteñería (prueba)', pin: PIN_SALTENERIA_PRUEBA }
      },
      schemaVersion: 1
    });
  }
}

// ---------- 3) Estado de la app ----------
let sucursalActual = null;   // datos de la sucursal cargados de Firestore
let compartimentoActual = null; // 'pizzeria' | 'salteneria'

const app = document.getElementById('app');

function hoyISO() {
  const d = new Date();
  return d.toISOString().slice(0, 10); // YYYY-MM-DD
}

// ---------- 4) Pantallas ----------

function pantallaCargando(msg) {
  app.innerHTML = `<div class="lbl" style="margin-top:60px;">${msg}</div>`;
}

function pantallaElegirCompartimento() {
  const tiene = sucursalActual.tieneSalteneria;
  app.innerHTML = `
    <h1>🍕 Salas</h1>
    <div class="sub">${sucursalActual.nombre}</div>
    <div class="estado ok">🟢 Conectado a Firebase</div>
    <div class="card">
      <label>Elige tu turno</label>
      <button class="btn" id="btn-pizzeria">🍕 Pizzería (tarde)</button>
      ${tiene ? `<button class="btn secondary" id="btn-salteneria">🥟 Salteñería (mañana)</button>` : ''}
    </div>
  `;
  document.getElementById('btn-pizzeria').onclick = () => pantallaPin('pizzeria');
  if (tiene) document.getElementById('btn-salteneria').onclick = () => pantallaPin('salteneria');
}

function pantallaPin(compartimento) {
  let pin = '';
  const nombreComp = compartimento === 'pizzeria' ? '🍕 Pizzería' : '🥟 Salteñería';

  function render() {
    app.innerHTML = `
      <div class="top">
        <button class="chip" id="btn-atras" style="border:none;">‹ Atrás</button>
        <span class="chip">${nombreComp}</span>
      </div>
      <h1>Ingresa tu PIN</h1>
      <div class="sub">Sucursal: ${sucursalActual.nombre}</div>
      <div class="pin-display">
        ${[0,1,2,3].map(i => `<div class="pin-dot ${i < pin.length ? 'filled' : ''}"></div>`).join('')}
      </div>
      <div class="pin-pad">
        ${[1,2,3,4,5,6,7,8,9].map(n => `<button data-n="${n}">${n}</button>`).join('')}
        <button data-n="borrar">⌫</button>
        <button data-n="0">0</button>
        <button data-n="ok">✓</button>
      </div>
      <div class="error" id="pin-error"></div>
      <div class="sub" style="margin-top:16px;">PIN de prueba: ${compartimento === 'pizzeria' ? PIN_PIZZERIA_PRUEBA : PIN_SALTENERIA_PRUEBA}</div>
    `;
    document.getElementById('btn-atras').onclick = pantallaElegirCompartimento;
    document.querySelectorAll('.pin-pad button').forEach(b => {
      b.onclick = () => {
        const n = b.dataset.n;
        if (n === 'borrar') pin = pin.slice(0, -1);
        else if (n === 'ok') validar();
        else if (pin.length < 4) pin += n;
        render();
      };
    });
  }

  async function validar() {
    const comp = sucursalActual.compartimentos[compartimento];
    if (pin === comp.pin) {
      compartimentoActual = compartimento;
      pantallaCargando('Entrando…');
      await pantallaPrincipal();
    } else {
      document.getElementById('pin-error').textContent = 'PIN incorrecto, intenta de nuevo';
      pin = '';
      render();
    }
  }

  render();
}

async function pantallaPrincipal() {
  const comp = sucursalActual.compartimentos[compartimentoActual];
  const nombreComp = compartimentoActual === 'pizzeria' ? '🍕 Pizzería' : '🥟 Salteñería';
  const ventasRef = db.collection('sucursales').doc(sucursalActual.id)
    .collection('compartimentos').doc(compartimentoActual)
    .collection('ventas');

  async function cargarVentasHoy() {
    const hoy = hoyISO();
    const snap = await ventasRef.where('fecha', '==', hoy).orderBy('creadoEn', 'desc').get();
    return snap.docs.map(d => d.data());
  }

  async function render() {
    const ventas = await cargarVentasHoy();
    const totalEfectivo = ventas.filter(v => v.formaPago === 'efectivo').reduce((a, v) => a + v.monto, 0);
    const totalQr = ventas.filter(v => v.formaPago === 'qr').reduce((a, v) => a + v.monto, 0);

    app.innerHTML = `
      <div class="top">
        <span class="chip">${nombreComp}</span>
        <button class="chip" id="btn-salir" style="border:none;">Salir</button>
      </div>
      <div class="sub">${sucursalActual.nombre} · ${comp.empleadoNombre}</div>
      <div class="estado ok">🟢 Sincronizado con Firebase (funciona sin internet y se actualiza solo al reconectar)</div>

      <div class="card">
        <div class="monto">${(totalEfectivo + totalQr).toFixed(2)} Bs</div>
        <div class="lbl">Caja de hoy (${nombreComp})</div>
        <div class="toggle" style="pointer-events:none;">
          <button class="active">💵 Efectivo: ${totalEfectivo.toFixed(2)} Bs</button>
          <button>📱 QR: ${totalQr.toFixed(2)} Bs</button>
        </div>
      </div>

      <div class="card">
        <label>Registrar venta rápida</label>
        <input type="text" id="in-producto" placeholder="Producto (ej: salteña, café)">
        <input type="number" id="in-monto" placeholder="Precio en Bs" inputmode="decimal">
        <div class="toggle" id="toggle-pago">
          <button class="active" data-pago="efectivo">💵 Efectivo</button>
          <button data-pago="qr">📱 QR</button>
        </div>
        <button class="btn" id="btn-agregar">Agregar venta</button>
        <div class="error" id="venta-error"></div>
      </div>

      <div class="card">
        <label>Ventas de hoy (${ventas.length})</label>
        ${ventas.length === 0 ? '<div class="lbl">Aún no hay ventas registradas hoy.</div>' : ventas.map(v => `
          <div class="venta-row"><span>${v.producto}</span><strong>${v.monto.toFixed(2)} Bs</strong></div>
        `).join('')}
      </div>
    `;

    let formaPago = 'efectivo';
    document.querySelectorAll('#toggle-pago button').forEach(b => {
      b.onclick = () => {
        formaPago = b.dataset.pago;
        document.querySelectorAll('#toggle-pago button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
      };
    });

    document.getElementById('btn-salir').onclick = () => {
      compartimentoActual = null;
      pantallaElegirCompartimento();
    };

    document.getElementById('btn-agregar').onclick = async () => {
      const producto = document.getElementById('in-producto').value.trim();
      const monto = parseFloat(document.getElementById('in-monto').value);
      const errorEl = document.getElementById('venta-error');
      if (!producto || isNaN(monto) || monto <= 0) {
        errorEl.textContent = 'Completa el producto y un precio válido';
        return;
      }
      errorEl.textContent = 'Guardando…';
      try {
        await ventasRef.add({
          producto, monto, formaPago,
          fecha: hoyISO(),
          creadoEn: firebase.firestore.FieldValue.serverTimestamp(),
          schemaVersion: 1
        });
        await render();
      } catch (e) {
        errorEl.textContent = 'No se pudo guardar (sin internet: se guardará solo cuando vuelva la conexión)';
      }
    };
  }

  await render();
}

// ---------- 5) Arranque (con pasos visibles y tiempo límite, para diagnosticar) ----------
function conTiempoLimite(promesa, ms, etiqueta) {
  return Promise.race([
    promesa,
    new Promise((_, reject) => setTimeout(() => reject(new Error('TIMEOUT:' + etiqueta)), ms))
  ]);
}

function mostrarError(paso, e) {
  const detalle = (e && (e.code || e.message)) ? (e.code || '') + ' ' + (e.message || e) : String(e);
  app.innerHTML = `
    <h1>No se pudo conectar</h1>
    <div class="sub">Se quedó atascado en: <b>${paso}</b></div>
    <div class="card">
      <div class="error" style="text-align:left;">${detalle}</div>
    </div>
    <div class="sub">Prueba: 1) abrir el archivo con Chrome desde tu carpeta de Descargas (no desde el visor interno), 2) revisar que tengas datos/wifi funcionando, 3) volver a intentar.</div>
    <button class="btn" id="btn-reintentar">Reintentar</button>
  `;
  document.getElementById('btn-reintentar').onclick = iniciar;
}

async function iniciar() {
  try {
    pantallaCargando('Paso 1 de 3: iniciando sesión…');
    try {
      await conTiempoLimite(auth.setPersistence(firebase.auth.Auth.Persistence.NONE), 5000, 'preparar sesión');
    } catch (e) { /* si esto se cuelga o falla, seguimos igual sin bloquear */ }
    await conTiempoLimite(auth.signInAnonymously(), 15000, 'iniciar sesión');

    pantallaCargando('Paso 2 de 3: preparando la sucursal de prueba…');
    await conTiempoLimite(asegurarSucursalPrueba(), 15000, 'crear sucursal de prueba');

    pantallaCargando('Paso 3 de 3: cargando datos…');
    const snap = await conTiempoLimite(
      db.collection('sucursales').doc(SUCURSAL_PRUEBA_ID).get(),
      15000, 'leer sucursal'
    );
    sucursalActual = { id: SUCURSAL_PRUEBA_ID, ...snap.data() };
    pantallaElegirCompartimento();
  } catch (e) {
    const paso = (e && e.message && e.message.startsWith('TIMEOUT:'))
      ? 'tardó demasiado en: ' + e.message.replace('TIMEOUT:', '')
      : 'error inesperado';
    mostrarError(paso, e);
  }
}

iniciar();
</script>
</body>
</html>
