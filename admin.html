<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#211d30">
<link rel="manifest" href="manifest-admin.webmanifest">
<link rel="icon" href="icon-admin-192.png">
<link rel="apple-touch-icon" href="icon-admin-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panel Salas">
<title>Pizzería Salas · Panel de la dueña</title>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<style>
/* ============================================================
   DESIGN SYSTEM — Pizzería Salas / Salteñería Salas
   El color de acento es un solo "hue" (0-360, el círculo cromático
   completo) y el modo claro/oscuro es independiente. Cambiar --hue
   o [data-theme] cambia TODA la app sin tocar nada más.
   ============================================================ */
:root{
  --hue: 328; /* rosa por defecto */
  --accent: hsl(var(--hue) 68% 42%);
  --accent-hover: hsl(var(--hue) 68% 35%);
  --accent-light: hsl(var(--hue) 60% 93%);
  --bg: #faf8f8;
  --surface: #ffffff;
  --surface-2: hsl(var(--hue) 20% 96%);
  --text-primary: #211d20;
  --text-secondary: #7c7579;
  --border: hsl(var(--hue) 16% 89%);
  --success: #1f7a4d;
  --warning: #a16a12;
  --danger: #b23a2e;
  --info: #336a9e;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --shadow-sm: 0 1px 3px rgba(20,10,15,0.06);
  --shadow-md: 0 4px 16px rgba(20,10,15,0.08);
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px;
}
[data-theme="dark"]{
  --bg: hsl(var(--hue) 14% 9%);
  --surface: hsl(var(--hue) 13% 13%);
  --surface-2: hsl(var(--hue) 11% 17%);
  --text-primary: #f1edef;
  --text-secondary: #a79fa5;
  --border: hsl(var(--hue) 10% 23%);
  --accent: hsl(var(--hue) 48% 54%);
  --accent-hover: hsl(var(--hue) 48% 60%);
  --accent-light: hsl(var(--hue) 35% 22%);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.35);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text-primary);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.screen{max-width:480px;margin:0 auto;min-height:100vh;padding:0 0 32px;display:flex;flex-direction:column;}

.t-title{font-size:1.5rem;font-weight:700;margin:0 0 2px;letter-spacing:-0.01em;}
.t-subtitle{font-size:1.05rem;font-weight:600;margin:0 0 2px;}
.t-body{font-size:0.95rem;line-height:1.4;}
.t-secondary{font-size:0.85rem;color:var(--text-secondary);}
.t-price{font-size:1.6rem;font-weight:800;color:var(--accent);}
.t-eyebrow{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-secondary);font-weight:700;}

.px{padding-left:var(--space-4);padding-right:var(--space-4);}
.stack > * + *{margin-top:var(--space-3);}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;}
.grow{flex:1;}

.header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-4);}
.header-btn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;color:var(--text-primary);cursor:pointer;
}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:15px;border:none;border-radius:var(--radius-md);
  font-size:1rem;font-weight:700;cursor:pointer;transition:transform .08s ease;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:disabled{opacity:0.45;}
.btn-secondary{background:var(--accent-light);color:var(--accent);}
.btn-tertiary{background:transparent;color:var(--text-secondary);}
.btn-danger{background:#fde8e5;color:var(--danger);}

.field{width:100%;}
.field label{display:block;font-size:0.82rem;color:var(--text-secondary);margin-bottom:6px;font-weight:600;}
.field input, .field select{
  width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-size:0.98rem;background:var(--surface);color:var(--text-primary);
}
.field input:focus, .field select:focus{outline:none;border-color:var(--accent);}
.search{position:relative;}
.search input{padding-left:38px;}
.search .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-secondary);}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:var(--space-4);box-shadow:var(--shadow-sm);
}
.card-flat{background:var(--surface-2);border-radius:var(--radius-md);padding:var(--space-4);}

.sucursal-item{
  display:flex;align-items:center;gap:var(--space-3);
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-md);
  padding:14px;margin-bottom:10px;cursor:pointer;
}
.sucursal-item .avatar{
  width:42px;height:42px;border-radius:12px;background:var(--accent-light);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;
}
.sucursal-item .info{flex:1;min-width:0;}
.sucursal-item .info .nombre{font-weight:700;font-size:0.98rem;}
.sucursal-item .info .zona{font-size:0.8rem;color:var(--text-secondary);}
.sucursal-item .arrow{color:var(--text-secondary);}

.compartimento-card{
  display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);
  padding:18px;cursor:pointer;
}
.compartimento-card .emoji{font-size:1.8rem;}
.compartimento-card .info .nombre{font-weight:700;font-size:1.05rem;}
.compartimento-card .info .turno{font-size:0.82rem;color:var(--text-secondary);}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:0.72rem;font-weight:700;}
.badge-neutral{background:var(--surface-2);color:var(--text-secondary);}
.badge-success{background:#e2f6ec;color:var(--success);}
.badge-warning{background:#fdf1de;color:var(--warning);}
.badge-danger{background:#fde8e5;color:var(--danger);}
.badge-accent{background:var(--accent-light);color:var(--accent);}

.alert{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;border-radius:var(--radius-md);font-size:0.88rem;}
.alert-info{background:var(--accent-light);color:var(--accent);}
.alert-warning{background:#fdf1de;color:var(--warning);}
.alert-danger{background:#fde8e5;color:var(--danger);}

.pin-dots{display:flex;gap:14px;justify-content:center;margin:var(--space-6) 0;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);}
.pin-dot.filled{background:var(--accent);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 var(--space-4);}
.keypad button{
  aspect-ratio:1;border-radius:var(--radius-lg);border:1px solid var(--border);
  background:var(--surface);font-size:1.4rem;font-weight:600;color:var(--text-primary);
}
.keypad button:active{background:var(--surface-2);}
.keypad button.ok{background:var(--accent);color:#fff;border-color:var(--accent);}

.stat-row{display:flex;gap:10px;}
.stat-box{flex:1;background:var(--surface-2);border-radius:var(--radius-md);padding:14px;text-align:center;}
.stat-box .valor{font-size:1.3rem;font-weight:800;}
.stat-box .lbl{font-size:0.75rem;color:var(--text-secondary);margin-top:2px;}

.toggle{display:flex;gap:8px;}
.toggle button{
  flex:1;padding:11px;border-radius:var(--radius-sm);border:1.5px solid var(--border);
  background:var(--surface);color:var(--text-primary);font-weight:700;font-size:0.9rem;
}
.toggle button.active{background:var(--accent);color:#fff;border-color:var(--accent);}

.hue-strip{
  height:44px;border-radius:22px;margin:var(--space-3) 0;position:relative;
  background:linear-gradient(to right,
    hsl(0 50% 45%), hsl(30 50% 45%), hsl(60 50% 42%), hsl(90 50% 40%),
    hsl(120 45% 38%), hsl(150 45% 38%), hsl(180 42% 40%), hsl(210 48% 45%),
    hsl(240 45% 48%), hsl(270 45% 45%), hsl(300 45% 42%), hsl(330 50% 42%), hsl(360 50% 45%));
}
.hue-strip input[type=range]{-webkit-appearance:none;width:100%;height:44px;background:transparent;margin:0;}
.hue-strip input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;
  border:3px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,0.3);
}
.swatch-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:var(--space-3);}
.swatch{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;}
.swatch.selected{border-color:var(--text-primary);}

.empty-state{text-align:center;padding:var(--space-8) var(--space-4);color:var(--text-secondary);}
.empty-state .icon{font-size:2.2rem;margin-bottom:8px;}
.error-text{color:var(--danger);font-size:0.85rem;text-align:center;min-height:1.2em;}

.logo-mark{
  width:84px;height:84px;border-radius:24px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:2.2rem;
  box-shadow:var(--shadow-md);margin-bottom:var(--space-4);
}

/* --- Header enriquecido --- */
.avatar-circle{
  width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;flex-shrink:0;
}
.header-rich{display:flex;align-items:center;gap:12px;padding:var(--space-4);}
.bell-btn{position:relative;}
.bell-dot{
  position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;
  background:var(--danger);border:2px solid var(--surface);
}

/* --- Botón de acceso rápido con icono --- */
.quick-btn{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:var(--surface-2);border:none;border-radius:var(--radius-md);
  padding:14px 6px;font-size:0.78rem;font-weight:700;color:var(--text-primary);flex:1;
}
.quick-btn .ic{font-size:1.35rem;}

/* --- Gráfico de ventas por hora --- */
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:var(--space-3);}
.chart-bars .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.chart-bars .bar{width:100%;max-width:22px;border-radius:6px 6px 2px 2px;background:var(--accent-light);transition:height .3s ease;}
.chart-bars .bar.filled{background:var(--accent);}
.chart-bars .bar-lbl{font-size:0.62rem;color:var(--text-secondary);margin-top:4px;}

/* --- Navegación inferior fija (reutilizable) --- */
.bottom-nav{
  position:sticky;bottom:0;display:flex;background:var(--surface);
  border-top:1px solid var(--border);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));
  margin-top:auto;
}
.bottom-nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:none;border:none;color:var(--text-secondary);font-size:0.66rem;font-weight:700;padding:4px;
}
.bottom-nav button .ic{font-size:1.3rem;}
.bottom-nav button.active{color:var(--accent);}

.screen{padding-bottom:0;animation:ent .25s ease}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sync-pill{position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top,0px));z-index:50;padding:6px 14px;border-radius:20px;font-size:.74rem;font-weight:700;box-shadow:var(--shadow-md);max-width:92%;text-align:center}
.sync-pill.off{background:#fdf1de;color:#7a4e0a;border:1px solid #e8c88a}
.sync-pill.sync{background:var(--accent-light);color:var(--accent);border:1px solid var(--accent)}
.sync-pill.ok{background:#e2f6ec;color:#1f7a4d;border:1px solid #9fd8b9}
.sync-pill[hidden]{display:none}
.content{padding:0 var(--space-4) var(--space-6);flex:1}
.content > * + *{margin-top:var(--space-3)}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:transparent;padding:9px 6px;border-radius:11px;font-weight:700;font-size:.85rem;color:var(--text-secondary)}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-sm)}
.hero{border-radius:24px;padding:22px 20px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,hsl(var(--hue) 62% 34%),hsl(calc(var(--hue) + 28) 60% 46%));box-shadow:var(--shadow-md)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .big{font-size:2.3rem;font-weight:800;letter-spacing:-.02em;margin:4px 0 8px}
.hero .lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;opacity:.85;font-weight:700}
.hero .chip{display:inline-flex;gap:6px;background:rgba(255,255,255,.2);padding:4px 11px;border-radius:20px;font-size:.78rem;font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px;box-shadow:var(--shadow-sm)}
.kpi .v{font-size:1.25rem;font-weight:800;margin-top:4px}
.kpi .l{font-size:.74rem;color:var(--text-secondary);display:flex;align-items:center;gap:5px;font-weight:600}
.sec{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-secondary);font-weight:800;margin-top:var(--space-5)!important}
.prog{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:7px}
.prog > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),hsl(calc(var(--hue) + 28) 60% 52%))}
.rank{display:flex;gap:11px;align-items:center}
.rank .n{width:26px;height:26px;border-radius:8px;background:var(--accent-light);color:var(--accent);font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chart-bars.gr{height:110px;gap:3px}
.chart-bars.gr .bar{max-width:none}
.bottom-nav{position:sticky;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px)}
.bottom-nav button.active .ic{background:var(--accent-light);border-radius:14px;padding:3px 16px}
.bottom-nav button .ic{display:flex;transition:all .15s;padding:3px 16px}
.pin-v{font-family:ui-monospace,monospace;letter-spacing:.2em;font-weight:700}
.link{background:none;border:none;color:var(--accent);font-weight:700;font-size:.82rem;padding:6px}
/* --- Reportes claros (Etapa 1) --- */
:root{--up:#1f7a4d;--down:#b23a2e;--amber:#e0991a}
[data-theme="dark"]{--up:#4cc38a;--down:#f07a6c;--amber:#f0b64a}
.ttl{font-size:1.15rem;font-weight:800;margin-top:var(--space-6)!important;color:var(--text-primary)}
.hero .chip.up{background:#1f7a4d}.hero .chip.down{background:#b23a2e}.hero .chip.eq{background:rgba(255,255,255,.25)}
.hero .chip{font-size:.9rem;padding:6px 13px;position:relative;z-index:1}
.hero .big{font-size:2.7rem}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.num{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px 14px;box-shadow:var(--shadow-sm)}
.num.alerta{border-color:var(--down)}
.num .l{font-size:.85rem;color:var(--text-secondary);font-weight:700}
.num .v{font-size:1.9rem;font-weight:800;margin:4px 0 2px;letter-spacing:-.02em}
.num .s{font-size:.78rem;color:var(--text-secondary)}
.resumen .grande{font-size:2.1rem;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.frase{font-weight:700;font-size:.98rem}
.frase.up{color:var(--up)}.frase.down{color:var(--down)}.frase.eq{color:var(--text-secondary)}
.duo2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.duo2 b{font-size:1.25rem}
.leyenda{margin-bottom:10px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.pt{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:middle}
.pt.up{background:var(--up)}.pt.down{background:var(--down)}
.fila{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:10px;padding:8px 8px;border-radius:12px;border:2px solid transparent}
.fila + .fila{margin-top:2px}
.fila.hoy{background:var(--accent-light)}
.fila.mejor{border-color:var(--amber)}
.fila .nom{font-weight:800;font-size:.95rem}
.fila .pista{height:22px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.fila.hoy .pista{background:var(--surface)}
.fila .pista i{display:block;height:100%;border-radius:8px;transition:width .4s ease}
.fila .pista i.up{background:var(--up)}.fila .pista i.down{background:var(--down)}
.fila .pista i.eq{background:var(--text-secondary);opacity:.55}.fila .pista i.ac{background:var(--accent)}
.fila .mon{font-weight:800;font-size:1rem;text-align:right;white-space:nowrap}
.dona-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.dona{width:150px;height:150px;flex-shrink:0}
.dona-t1{font-size:11px;fill:var(--text-secondary);font-weight:700}
.dona-t2{font-size:15px;fill:var(--text-primary);font-weight:800}
.dona-leg{flex:1;min-width:140px;display:flex;flex-direction:column;gap:14px}
.leg{display:flex;gap:10px;align-items:flex-start}
.leg > i{width:16px;height:16px;border-radius:5px;margin-top:4px;flex-shrink:0}
.leg .ln{font-weight:700;font-size:.95rem}
.leg .lv{font-weight:800;font-size:1.35rem;letter-spacing:-.01em}
.leg .lp{font-size:.82rem;color:var(--text-secondary)}
.dona-frase{text-align:center;margin-top:12px;font-size:.92rem}
.alerta-fila{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--border)}
.alerta-fila:first-child{border-top:none}
.alerta-fila .pt{margin-top:5px;flex-shrink:0}
.pt.eq{background:var(--text-secondary);opacity:.6}
.navdia{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:8px;box-shadow:var(--shadow-sm)}
.navdia button{width:48px;height:48px;border-radius:14px;border:none;background:var(--accent-light);color:var(--accent);font-size:1.7rem;font-weight:800;line-height:1}
.navdia button:disabled{opacity:.3}
.navdia .grow{text-align:center}
.navdia .nd1{font-size:1.3rem;font-weight:800}
.navdia .nd2{font-size:.95rem;color:var(--text-secondary);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;position:relative;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip-dia{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 14px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--text-primary);font-size:.8rem;font-weight:700;min-width:84px}
.chip-dia b{font-size:.95rem}
.chip-dia.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mov{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--border)}
.mov .mh{font-size:.85rem;color:var(--text-secondary);font-weight:700}
.mov .mt{font-weight:700;font-size:1rem}
.mov .mm{font-weight:800;font-size:1.05rem;white-space:nowrap}

.btn-fecha{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;font-size:1rem;cursor:pointer}
.btn-fecha input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.stk-g{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);font-weight:800;margin:12px 0 2px}

(function () {
  const F = firebase.firestore;
  function parchar(C, esDoc) {
    const orig = C.prototype.get;
    C.prototype.get = function (opts) {
      if (opts && opts.source) return orig.call(this, opts);
      const self = this;
      const cache = () => orig.call(self, { source: 'cache' }).catch(e => {
        if (esDoc) return { exists: false, id: self.id, ref: self, data: () => undefined };
        throw e;
      });
      if (!navigator.onLine) return cache();
      return Promise.race([orig.call(self), new Promise((_, rej) => setTimeout(() => rej(new Error('lento')), 5000))]).catch(cache);
    };
  }
  parchar(F.DocumentReference, true);
  parchar(F.Query, false);
})();

function isoLocal(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

function conTiempoLimite(promesa, ms, etiqueta) {

function productosDe(compartimento, s, sinExtras) {
  const lista = [];
  if (compartimento === 'pizzeria') {
    TAMANOS_PIZZA.forEach(t => {
      if (SABORES_PIZZA[t].length === 0) lista.push(`Pizza ${t}`);
      else SABORES_PIZZA[t].forEach(sb => lista.push(`Pizza ${t} ${sb}`));
    });
    lista.push('Café', 'Té');
    if (s.tieneCajasPizza) TAMANOS_CAJA.forEach(t => lista.push(`Caja ${t}`));
  } else {
    lista.push('Salteña mixta', 'Café', 'Té');
  }
  TAMANOS_REFRESCO.forEach(t => lista.push(`Refresco ${t}`));
  if (!sinExtras) CATALOGO.filter(p => !p.base && p.activo !== false && p.area === compartimento && (!p.soloSucursales || !p.soloSucursales.length || p.soloSucursales.includes(s.id))).forEach(p => lista.push(p.nombre));
  return lista;
}


// ---- Alertas de stock bajo (configurables por la dueña) ----
let ALERTAS = { general: 0, por: {} }; // general: avisar con N o menos; por[id]: N, o -1 = sin alerta
async function cargarAlertas() {
  try {
    const d = await conTiempoLimite(db.collection('config').doc('alertas').get(), 10000, 'cargar alertas');
    const x = d.exists ? d.data() : {};
    ALERTAS = { general: Number.isFinite(x.umbralGeneral) ? x.umbralGeneral : 0, por: x.umbrales || {} };
  } catch (e) { /* sin permiso o sin internet: se usa el valor por defecto (avisar solo al agotarse) */ }
}
function umbralDe(id) {
  const v = ALERTAS.por[id];
  if (v === -1) return null;
  return Number.isFinite(v) ? v : ALERTAS.general;
}
function esBajo(id, cantidad) { const u = umbralDe(id); return u !== null && cantidad <= u; }

async function cargarSucursalesConCaja() {
  const snap = await conTiempoLimite(db.collection('sucursales').where('activo', '==', true).get(), 15000, 'cargar sucursales');
  const sucursales = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  sucursales.sort((a, b) => (a.orden || 99) - (b.orden || 99));
  await cargarAlertas();
  // Para cada sucursal, traemos la caja acumulada de sus compartimentos
  await Promise.all(sucursales.map(async (s) => {
    const comps = compsDe(s);
    const [docs, stockSnaps, refrescosSnap] = await Promise.all([
      Promise.all(comps.map(c => db.collection('sucursales').doc(s.id).collection('compartimentos').doc(c).get())),
      Promise.all(comps.map(c => db.collection('sucursales').doc(s.id).collection('compartimentos').doc(c).collection('stock').get())),
      db.collection('sucursales').doc(s.id).collection('stockRefrescos').get()
    ]);
    s._cajaTotal = docs.reduce((a, d) => a + (d.exists ? (d.data().cajaTotal || 0) : 0), 0);
    const items = [];
    stockSnaps.forEach((snapStock, i) => snapStock.forEach(doc => items.push({ id: doc.id, nombre: doc.data().producto || doc.id, cantidad: doc.data().cantidad || 0, grupo: comps[i] })));
    refrescosSnap.forEach(doc => items.push({ id: doc.id, nombre: doc.data().producto || doc.id, cantidad: doc.data().cantidad || 0, grupo: 'refrescos' }));
    s._stockItems = items;
    s._stockBajo = items.filter(x => esBajo(x.id, x.cantidad)).length;
  }));
  return sucursales;
}

}
function idSeguro(t) { return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function guardarProducto(id, datos) {
  const i = CATALOGO.findIndex(p => p.id === id);
  if (i >= 0) CATALOGO[i] = Object.assign({}, CATALOGO[i], datos); else CATALOGO.push(Object.assign({ id }, datos));
  return noEsperar(db.collection('productos').doc(id).set(datos, { merge: true }));
}

            <button class="active" data-v="si">Sí</button>
            <button data-v="no">No</button>
          </div>
        </div>
      </div>

      <div class="field"><label>PIN del empleado de Pizzería (4 dígitos)</label><input type="text" id="in-pin-pizzeria" inputmode="numeric" maxlength="4" placeholder="Ej: 1234"></div>
      <div class="field" id="campo-pin-saltena"><label>PIN del empleado de Salteñería (4 dígitos)</label><input type="text" id="in-pin-saltena" inputmode="numeric" maxlength="4" placeholder="Ej: 5678"></div>

      <button class="btn btn-primary" id="btn-guardar-sucursal">Crear sucursal</button>
      <div class="error-text" id="sucursal-error"></div>
    </div>
  `;
  document.getElementById('btn-atras').onclick = volver;

  let tieneSaltena = true;
  document.querySelectorAll('#toggle-saltena button').forEach(b => {
    b.onclick = () => {
      tieneSaltena = b.dataset.v === 'si';
      document.querySelectorAll('#toggle-saltena button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      document.getElementById('campo-pin-saltena').style.display = tieneSaltena ? 'block' : 'none';
    };
  });
  let tieneCajas = true;
  document.querySelectorAll('#toggle-cajas button').forEach(b => {
    b.onclick = () => {
      tieneCajas = b.dataset.v === 'si';
      document.querySelectorAll('#toggle-cajas button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    };
  });

  document.getElementById('btn-guardar-sucursal').onclick = async () => {
    const nombre = document.getElementById('in-nombre').value.trim();
    const zona = document.getElementById('in-zona').value.trim();
    const orden = parseInt(document.getElementById('in-orden').value) || 99;
    const pinPizzeria = document.getElementById('in-pin-pizzeria').value.trim();
    const pinSaltena = document.getElementById('in-pin-saltena').value.trim();
    const errorEl = document.getElementById('sucursal-error');

    if (!nombre) { errorEl.textContent = 'Ponle un nombre a la sucursal.'; return; }
    if (!/^\d{4}$/.test(pinPizzeria)) { errorEl.textContent = 'El PIN de Pizzería debe tener 4 dígitos.'; return; }
    if (tieneSaltena && !/^\d{4}$/.test(pinSaltena)) { errorEl.textContent = 'El PIN de Salteñería debe tener 4 dígitos.'; return; }

    errorEl.textContent = '';
    try {
      const compartimentos = {
        pizzeria: { empleadoNombre: 'Empleado Pizzería', pin: pinPizzeria }
      };
      if (tieneSaltena) compartimentos.salteneria = { empleadoNombre: 'Empleado Salteñería', pin: pinSaltena };

      await noEsperar(db.collection('sucursales').doc().set({
        nombre, zona, orden,

        tieneCajasPizza: tieneCajas,

        schemaVersion: 1
      }));
      volver();
    } catch (e) {
      errorEl.textContent = 'No se pudo guardar la sucursal.';
    }
  };
}

      return noEsperar(db.collection('sucursales').doc(s.id).update(cambios)).then(() => {
        s[campo(c)] = !!extra.abierta;
        if (extra.comp) s.compartimentos = Object.assign({}, s.compartimentos || {}, { [c]: extra.comp });
        pantallaDetalleSucursal(s);
      });
    };
    document.querySelectorAll('[data-clausurar]').forEach(b => {
      b.onclick = () => {

        if (!confirm('¿Clausurar ' + nomArea(c) + ' en "' + s.nombre + '"? Dejará de aparecer en las apps y reportes. Sus ventas y su stock se conservan, y puedes reabrirla cuando quieras.')) return;
        cambiarArea(c, { abierta: false });
      };
    });
    document.querySelectorAll('[data-reabrir]').forEach(b => {
      b.onclick = () => {
        const c = b.dataset.reabrir;
        if ((s.compartimentos || {})[c]) return cambiarArea(c, { abierta: true });
        const pin = prompt('Elige un PIN de 4 dígitos para el empleado de ' + nomArea(c));
        if (!/^\d{4}$/.test(pin || '')) { if (pin !== null) alert('El PIN debe tener 4 dígitos.'); return; }
        const comp = { empleadoNombre: 'Empleado ' + nomArea(c), pin };
        cambiarArea(c, { abierta: true, comp, datos: { ['compartimentos.' + c]: comp } });
      };
    });
  }
  render();
}

// ============================================================
// 8d) PANTALLA: Reportes (hoy / 7 días / 30 días)
// ============================================================
let periodoRep = 'hoy';
const DIAS_CORTO = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
function nombreDia(iso, hoy) {
  if (iso === hoy) return 'Hoy';
  if (iso === sumarDias(hoy, -1)) return 'Ayer';
  const [a, m, d] = iso.split('-').map(Number);
  return DIAS_CORTO[new Date(a, m - 1, d).getDay()] + ' ' + d;
}
const bsN = x => Math.round(x).toLocaleString('es-BO') + ' Bs';
// Frase simple de comparación: "Vendiste 120 Bs más que ayer"
function comparar(actual, previo, ref, enCurso) {
  const dif = actual - previo;
  if (actual === 0 && previo === 0) return { txt: 'Todavía no hay ventas para comparar', cls: 'eq', ic: '＝' };
  const ini = enCurso ? 'Hoy llevas ' : 'Vendiste ';
  const pct = previo > 0 ? Math.round(Math.abs(dif) / previo * 100) : null;
  if (Math.abs(dif) < 0.5) return { txt: (enCurso ? 'Hoy llevas lo mismo que ' : 'Vendiste lo mismo que ') + ref, cls: 'eq', ic: '＝' };
  return dif > 0
    ? { txt: ini + bsN(dif) + ' más que ' + ref + (pct !== null ? ' (' + pct + '% más)' : ''), cls: 'up', ic: '▲' }
    : { txt: ini + bsN(-dif) + ' menos que ' + ref + (pct !== null ? ' (' + pct + '% menos)' : ''), cls: 'down', ic: '▼' };
}
// Dona simple (SVG, funciona sin internet). partes: [{n, v, color}]
function dona(partes) {
  const tot = partes.reduce((a, p) => a + p.v, 0);
  const R = 52, C = 2 * Math.PI * R;
  let off = 0;
  const arcos = tot > 0 ? partes.filter(p => p.v > 0).map(p => {
    const L = p.v / tot * C;
    const s = `<circle cx="70" cy="70" r="${R}" fill="none" style="stroke:${p.color}" stroke-width="22" stroke-dasharray="${L.toFixed(2)} ${(C - L).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"/>`;
    off += L; return s;
  }).join('') : '';
  const p0 = tot > 0 ? Math.round(partes[0].v / tot * 100) : 0;
  const pct = [p0, 100 - p0];
  const mayor = tot > 0 ? (partes[0].v >= partes[1].v ? 0 : 1) : -1;
  return `<div class="dona-wrap">
    <svg class="dona" viewBox="0 0 140 140" role="img" aria-label="Gráfico circular">
      <circle cx="70" cy="70" r="${R}" fill="none" style="stroke:var(--surface-2)" stroke-width="22"/>${arcos}
      <text x="70" y="66" text-anchor="middle" class="dona-t1">${tot > 0 ? 'Total' : 'Sin'}</text>
      <text x="70" y="86" text-anchor="middle" class="dona-t2">${tot > 0 ? bsN(tot) : 'ventas'}</text>
    </svg>
    <div class="dona-leg">${partes.map((p, i) => `<div class="leg"><i style="background:${p.color}"></i><div><div class="ln">${p.n}</div><div class="lv">${bsN(p.v)}</div><div class="lp">${tot > 0 ? pct[i] + '% del total' : '—'}</div></div></div>`).join('')}</div>
  </div>${mayor >= 0 ? `<div class="t-secondary dona-frase">${pct[mayor] === 50 ? 'Quedaron parejos.' : 'Se vendió más en <b>' + partes[mayor].n + '</b> (' + pct[mayor] + '%).'}</div>` : ''}`;
}

            <div class="t-secondary" style="margin-top:3px;">Caja: ${bs(x.s._cajaTotal)}${x.s._stockBajo ? ' · ' + x.s._stockBajo + ' con stock bajo' : ''}</div>

    document.querySelectorAll('[data-suc]').forEach(el => { el.onclick = () => pantallaHistorialSucursal(sucursales.find(x => x.id === el.dataset.suc), hoy, pantallaReportes); });

// ============================================================
// 8d-bis) PANTALLA: Ventas y gastos de una sucursal, por día
// ============================================================
async function pantallaHistorialSucursal(s, fecha, volver) {
  const hoy = hoyISO();
  fecha = fecha || hoy;
  const comps = compsDe(s);
  const cache = {}, cargado = {};
  let area = 'todo';
  const base = c => db.collection('sucursales').doc(s.id).collection('compartimentos').doc(c);
  const bs = bsN;
  const NOMBRE_AREA = { pizzeria: 'Pizzería', salteneria: 'Salteñería' };
  app.innerHTML = `<div class="empty-state">Cargando ${esc(s.nombre)}…</div>`;

  async function traer(desde, hasta) {
    const T = [];
    comps.forEach(c => [['ventas', 'V'], ['gastos', 'G']].forEach(([col, k]) => {
      T.push(base(c).collection(col).where('fecha', '>=', desde).where('fecha', '<=', hasta).get().then(snap => snap.docs.forEach(d => {
        const o = { ...d.data(), comp: c };
        (cache[o.fecha] = cache[o.fecha] || { V: [], G: [], C: [] })[k].push(o);
      })));
    }));
    comps.forEach(c => T.push(base(c).collection('cierres').where('fecha', '>=', desde).where('fecha', '<=', hasta).get().then(snap => snap.docs.forEach(d => {
      const o = { ...d.data(), comp: c };
      (cache[o.fecha] = cache[o.fecha] || { V: [], G: [], C: [] }).C.push(o);
    })).catch(() => {})));
    await conTiempoLimite(Promise.all(T), 20000, 'cargar ventas y gastos');
    for (let f = desde; f <= hasta; f = sumarDias(f, 1)) { cargado[f] = true; cache[f] = cache[f] || { V: [], G: [], C: [] }; }
  }
  let stock = [];
  async function traerStock() {
    await cargarAlertas();
    const out = [], T = [];
    comps.forEach(c => T.push(base(c).collection('stock').get().then(sn => sn.docs.forEach(d => out.push({ id: d.id, nombre: d.data().producto || d.id, cantidad: d.data().cantidad || 0, grupo: c })))));
    T.push(db.collection('sucursales').doc(s.id).collection('stockRefrescos').get().then(sn => sn.docs.forEach(d => out.push({ id: d.id, nombre: d.data().producto || d.id, cantidad: d.data().cantidad || 0, grupo: 'refrescos' }))));
    await conTiempoLimite(Promise.all(T), 20000, 'cargar stock');
    stock = out;
  }
  try { await Promise.all([traer(sumarDias(hoy, -13), hoy), traerStock()]); if (fecha < sumarDias(hoy, -13)) await traer(fecha, fecha); }
  catch (e) { return mostrarError('cargar ventas y gastos', e); }

  async function ir(f) {
    if (f > hoy) f = hoy;
    fecha = f;
    if (!cargado[f]) { try { await traer(f, f); } catch (e) { return mostrarError('cargar ventas y gastos', e); } }
    render();
  }
  const hora = x => x.creadoEn && x.creadoEn.toDate ? x.creadoEn.toDate() : null;
  const hhmm = d => d ? String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') : '—';
  const tiempo = x => { const d = hora(x); return d ? d.getTime() : 0; };

  function stockHtml() {
    const NG = { pizzeria: 'Pizzería', salteneria: 'Salteñería', refrescos: 'Refrescos (compartidos)' };
    const vis = stock.filter(x => area === 'todo' || x.grupo === area || x.grupo === 'refrescos');
    if (vis.length === 0) return `<div class="empty-state" style="padding:14px 0;">Todavía no hay stock registrado.</div>`;
    const ago = vis.filter(x => esBajo(x.id, x.cantidad)).length;
    const orden = ['pizzeria', 'salteneria', 'refrescos'].filter(g => vis.some(x => x.grupo === g));
    return (ago ? `<div class="frase down" style="margin-bottom:6px;">▼ ${ago} producto(s) con stock bajo</div>` : `<div class="frase up" style="margin-bottom:6px;">✔ No hay stock bajo</div>`) +
      orden.map(g => `<div class="stk-g">${NG[g]}</div>` + vis.filter(x => x.grupo === g).sort((a, b) => a.cantidad - b.cantidad || a.nombre.localeCompare(b.nombre)).map(x => {
        const bajo = esBajo(x.id, x.cantidad), cls = bajo ? (x.cantidad <= 0 ? 'cero' : 'poco') : '';
        return `<div class="stk"><div class="mt">${esc(x.nombre)}</div><div class="q ${cls}">${x.cantidad <= 0 ? 'Agotado' : x.cantidad + (bajo ? ' · stock bajo' : '')}</div></div>`;
      }).join('')).join('');
  }

  function render() {
    const filtra = x => area === 'todo' || x.comp === area;
    const dia = cache[fecha] || { V: [], G: [], C: [] };
    const V = dia.V.filter(filtra).sort((a, b) => tiempo(b) - tiempo(a));
    const G = dia.G.filter(filtra).sort((a, b) => tiempo(b) - tiempo(a));
    const tV = V.filter(x => !x.anulado).reduce((a, x) => a + (x.monto || 0), 0), tG = G.filter(x => !x.anulado).reduce((a, x) => a + (x.monto || 0), 0);
    const ef = V.filter(x => x.formaPago === 'efectivo' && !x.anulado).reduce((a, x) => a + (x.monto || 0), 0);
    const [a, m, d] = fecha.split('-').map(Number);
    const largo = new Date(a, m - 1, d).toLocaleDateString('es-BO', { weekday: 'long', day: 'numeric', month: 'long' });
    const dias = []; for (let i = 0; i < 14; i++) dias.push(sumarDias(hoy, -i));
    if (!dias.includes(fecha)) dias.unshift(fecha);
    const totDia = f => ((cache[f] || { V: [] }).V.filter(x => filtra(x) && !x.anulado)).reduce((acc, x) => acc + (x.monto || 0), 0);
    app.innerHTML = `
      <div class="header">
        <button class="header-btn" id="btn-atras">${ic('back')}</button>
        <div class="t-subtitle">${esc(s.nombre)}</div>
        <button class="header-btn" id="btn-tema">${ic('palette')}</button>
      </div>
      <div class="content">
        <div class="navdia">
          <button id="dia-ant" aria-label="Día anterior">‹</button>
          <div class="grow"><div class="nd1">${nombreDia(fecha, hoy) === 'Hoy' ? 'Hoy' : nombreDia(fecha, hoy) === 'Ayer' ? 'Ayer' : ''}</div><div class="nd2" style="text-transform:capitalize;">${largo}</div></div>
          <button id="dia-sig" aria-label="Día siguiente" ${fecha >= hoy ? 'disabled' : ''}>›</button>
        </div>
        <div class="chips" id="chips">${dias.map(f => `<button data-f="${f}" class="chip-dia ${f === fecha ? 'on' : ''}"><span>${nombreDia(f, hoy)}</span><b>${cargado[f] ? bs(totDia(f)) : '…'}</b></button>`).join('')}</div>
        <label class="btn btn-secondary btn-fecha">${ic('calendar', 20)} Elegir otro día del calendario<input type="date" id="in-fecha" value="${fecha}" max="${hoy}"></label>
        ${comps.length > 1 ? `<div class="seg" id="seg-area">${[['todo', 'Todo'], ['pizzeria', 'Pizzería'], ['salteneria', 'Salteñería']].map(p => `<button data-a="${p[0]}" class="${area === p[0] ? 'on' : ''}">${p[1]}</button>`).join('')}</div>` : ''}

        <div class="duo">
          <div class="num"><div class="l">Vendido</div><div class="v">${bs(tV)}</div><div class="s">${V.length} venta(s)</div></div>
          <div class="num"><div class="l">Gastos</div><div class="v" style="color:${tG ? 'var(--down)' : 'inherit'}">${bs(tG)}</div><div class="s">${G.length} gasto(s)</div></div>
        </div>
        <div class="card resumen">
          <div class="duo2" style="margin-top:0;padding-top:0;border-top:none;">
            <div><div class="t-secondary">Ganancia del día</div><b style="color:${tV - tG >= 0 ? 'var(--up)' : 'var(--down)'}">${bs(tV - tG)}</b></div>
            <div><div class="t-secondary">Efectivo · QR</div><b>${bs(ef)} · ${bs(tV - ef)}</b></div>
          </div>
        </div>

        ${comps.length > 1 && area === 'todo' ? `<div class="card">${comps.map((c, i) => { const v = dia.V.filter(x => x.comp === c && !x.anulado).reduce((a, x) => a + (x.monto || 0), 0), g = dia.G.filter(x => x.comp === c && !x.anulado).reduce((a, x) => a + (x.monto || 0), 0); return `<div class="sa" style="${i ? '' : 'border-top:none;padding-top:0;'}"><span><i style="background:${c === 'pizzeria' ? 'var(--accent)' : 'var(--amber)'}"></i>${NOMBRE_AREA[c]}</span><span class="t-secondary">${bs(v)} − ${bs(g)}</span><b style="color:${v - g >= 0 ? 'var(--up)' : 'var(--down)'}">${bs(v - g)}</b></div>`; }).join('')}<div class="t-secondary" style="margin-top:6px;">Ventas − gastos = ganancia de cada área</div></div>` : ''}

        <div class="ttl">Stock: lo que queda ahora</div>
        <div class="card">${stockHtml()}</div>

        ${(dia.C || []).length ? `<div class="ttl">Cierres de caja</div>
        <div class="card">${[...dia.C].sort((x, y) => tiempo(x) - tiempo(y)).map((x, i) => { const dif = x.diferencia || 0, ok = Math.abs(dif) < 0.01;
          return `<div class="mov" ${i === 0 ? 'style="border-top:none"' : ''}>
            <div class="mh">${hhmm(hora(x))}</div>
            <div><div class="mt">${comps.length > 1 ? NOMBRE_AREA[x.comp] + ' · ' : ''}Contado ${(x.contado || 0).toFixed(2)} Bs</div><div class="t-secondary">Esperado ${(x.esperado || 0).toFixed(2)} Bs${x.nota ? ' · ' + esc(x.nota) : ''}${x.empleado ? ' · ' + esc(x.empleado) : ''}</div></div>
            <div class="mm" style="color:${ok ? 'var(--up)' : 'var(--down)'}">${ok ? 'Cuadra' : (dif > 0 ? '+' : '−') + Math.abs(dif).toFixed(2)}</div>
          </div>`; }).join('')}</div>` : ''}

        <div class="ttl">Ventas</div>
        <div class="card">${V.length === 0 ? `<div class="empty-state" style="padding:14px 0;">No hubo ventas este día.</div>` : V.map((x, i) => `
          <div class=\"mov ${x.anulado ? 'anulada' : ''}\" ${i === 0 ? 'style="border-top:none"' : ''}>
            <div class="mh">${hhmm(hora(x))}</div>
            <div><div class="mt">${esc(x.producto)}${(x.cantidad || 1) > 1 ? ' × ' + x.cantidad : ''}${x.anulado ? ' <span class="badge badge-danger">Anulada</span>' : ''}</div><div class="t-secondary">${comps.length > 1 ? NOMBRE_AREA[x.comp] + ' · ' : ''}${x.formaPago === 'efectivo' ? 'Efectivo' : 'QR'}${x.empleado ? ' · ' + esc(x.empleado) : ''}${x.anulado ? ' · ' + esc(x.anuladoMotivo || '') + (x.anuladoPor ? ' (anuló ' + esc(x.anuladoPor) + ')' : '') : ''}</div></div>
            <div class="mm">${bs(x.monto || 0)}</div>
          </div>`).join('')}</div>

        <div class="ttl">Gastos</div>
        <div class="card">${G.length === 0 ? `<div class="empty-state" style="padding:14px 0;">No hubo gastos este día.</div>` : G.map((x, i) => `
          <div class=\"mov ${x.anulado ? 'anulada' : ''}\" ${i === 0 ? 'style="border-top:none"' : ''}>
            <div class="mh">${hhmm(hora(x))}</div>
            <div><div class="mt">${esc(x.motivo || 'Gasto')}${x.anulado ? ' <span class="badge badge-danger">Anulado</span>' : ''}</div><div class="t-secondary">${comps.length > 1 ? NOMBRE_AREA[x.comp] : ''}${x.empleado ? (comps.length > 1 ? ' · ' : '') + esc(x.empleado) : ''}${x.anulado ? ' · ' + esc(x.anuladoMotivo || '') + (x.anuladoPor ? ' (anuló ' + esc(x.anuladoPor) + ')' : '') : ''}</div></div>
            <div class="mm" style="color:var(--down);">− ${bs(x.monto || 0)}</div>
          </div>`).join('')}</div>

// Genera un .xlsx real con varias hojas y formato (zip sin compresión, sin librerías)
function crearXlsx(hojas) {
  const enc = new TextEncoder();
  const col = i => String.fromCharCode(65 + i);
  const x = t => String(t == null ? '' : t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const H = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const NS = 'xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"';
  const hojaXml = h => {
    const rows = h.f.map((fila, r) => '<row r="' + (r + 1) + '"' + (r === 0 && h.cab ? ' ht="24" customHeight="1"' : '') + '>' + fila.map((cel, i) => {
      const o = (cel !== null && typeof cel === 'object') ? cel : { v: cel };
      const est = o.s != null ? o.s : (r === 0 && h.cab ? 1 : (h.est ? h.est[i] : null));
      const sa = est ? ' s="' + est + '"' : '', ref = col(i) + (r + 1);
      if (typeof o.v === 'number' && isFinite(o.v)) return '<c r="' + ref + '"' + sa + '><v>' + o.v + '</v></c>';
      return '<c r="' + ref + '"' + sa + ' t="inlineStr"><is><t>' + x(o.v) + '</t></is></c>';
    }).join('') + '</row>').join('');
    const nc = Math.max(...h.f.map(f => f.length));
    return H + '<worksheet ' + NS + '><sheetViews><sheetView workbookViewId="0"' + (h.lineas === false ? ' showGridLines="0"' : '') + '>' +
      (h.cab ? '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>' : '') + '</sheetView></sheetViews>' +
      '<cols>' + h.anchos.map((w, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>').join('') + '</cols>' +
      '<sheetData>' + rows + '</sheetData>' + (h.filtro && h.f.length > 1 ? '<autoFilter ref="A1:' + col(nc - 1) + h.f.length + '"/>' : '') + '</worksheet>';
  };
  const B = '<border><left/><right/><top/><bottom/><diagonal/></border>';
  const bb = '<border><left/><right/><top/><bottom style="thin"><color rgb="FFD9D4D8"/></bottom><diagonal/></border>';
  const xf = (nf, fo, fi, bo, al) => '<xf numFmtId="' + nf + '" fontId="' + fo + '" fillId="' + fi + '" borderId="' + bo + '" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1"' + (al ? ' applyAlignment="1"><alignment ' + al + '/></xf>' : '/>');
  const estilos = H + '<styleSheet ' + NS + '>' +
    '<fonts count="5"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font><font><b/><sz val="16"/><color rgb="FF211D30"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><i/><sz val="10"/><color rgb="FF7C7579"/><name val="Calibri"/></font></fonts>' +
    '<fills count="5"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF211D30"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFFBE3EF"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEFEDF0"/></patternFill></fill></fills>' +
    '<borders count="2">' + B + bb + '</borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="11">' + xf(0, 0, 0, 0) + xf(0, 1, 2, 0, 'horizontal="center" vertical="center" wrapText="1"') + xf(0, 2, 0, 0) + xf(4, 0, 0, 1) + xf(0, 0, 0, 1) + xf(3, 0, 0, 1) +
    xf(0, 3, 3, 0) + xf(4, 3, 3, 0) + xf(3, 3, 3, 0) + xf(0, 3, 4, 0) + xf(0, 4, 0, 0) + '</cellXfs></styleSheet>';
  const n = hojas.length;
  const arch = [
    ['[Content_Types].xml', H + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' + hojas.map((_, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('') + '</Types>'],
    ['_rels/.rels', H + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml', H + '<workbook ' + NS + ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' + hojas.map((h, i) => '<sheet name="' + x(h.n) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join('') + '</sheets></workbook>'],
    ['xl/_rels/workbook.xml.rels', H + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + hojas.map((_, i) => '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join('') + '<Relationship Id="rId' + (n + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
    ['xl/styles.xml', estilos]
  ].concat(hojas.map((h, i) => ['xl/worksheets/sheet' + (i + 1) + '.xml', hojaXml(h)]));
  const T = []; for (let k = 0; k < 256; k++) { let c = k; for (let j = 0; j < 8; j++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; T[k] = c >>> 0; }
  const crc = d => { let c = 0xFFFFFFFF; for (let i = 0; i < d.length; i++) c = T[(c ^ d[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const partes = [], central = []; let pos = 0;
  arch.forEach(([nom, txt]) => {
    const nb = enc.encode(nom), d = enc.encode(txt), cr = crc(d);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint32(14, cr, true); lh.setUint32(18, d.length, true); lh.setUint32(22, d.length, true); lh.setUint16(26, nb.length, true);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint32(16, cr, true); ch.setUint32(20, d.length, true); ch.setUint32(24, d.length, true); ch.setUint16(28, nb.length, true); ch.setUint32(42, pos, true);
    partes.push(new Uint8Array(lh.buffer), nb, d); central.push(new Uint8Array(ch.buffer), nb);
    pos += 30 + nb.length + d.length;
  });
  const tamC = central.reduce((a, p) => a + p.length, 0);
  const fin = new DataView(new ArrayBuffer(22));
  fin.setUint32(0, 0x06054b50, true); fin.setUint16(8, arch.length, true); fin.setUint16(10, arch.length, true); fin.setUint32(12, tamC, true); fin.setUint32(16, pos, true);
  const out = new Uint8Array(pos + tamC + 22); let o = 0;
  partes.concat(central, [new Uint8Array(fin.buffer)]).forEach(p => { out.set(p, o); o += p.length; });
  return out;
}

// Arma las hojas: Resumen (por área y total), Ventas, Gastos, Bajas y Retiros
function armarHojas(filas, lista, rango, hoy) {
  const suma = (l, i) => l.reduce((a, f) => a + (+f[i] || 0), 0);
  const r2 = n => Math.round(n * 100) / 100;
  const V = filas.filter(f => f[4] === 'Venta'), G = filas.filter(f => f[4] === 'Gasto');
  const Ba = filas.filter(f => f[4] === 'Baja'), R = filas.filter(f => f[4] === 'Retiro de caja');
  const c = (v, s) => ({ v, s });
  const cab = l => l.map(t => c(t, 1));
  const fila = (nom, area, vs, gs, est) => {
    const tot = suma(vs, 8), ef = suma(vs.filter(f => f[9] === 'Efectivo'), 8), g = suma(gs, 8), tx = est === 'tot';
    return [c(nom, tx ? 6 : 4), c(area, tx ? 6 : 4), c(r2(tot), tx ? 7 : 3), c(r2(ef), tx ? 7 : 3), c(r2(tot - ef), tx ? 7 : 3), c(r2(g), tx ? 7 : 3), c(r2(tot - g), tx ? 7 : 3), c(vs.length, tx ? 8 : 5)];
  };
  const res = [[c('Pizzería Salas · Salteñería Salas', 2)], [c('Resumen · ' + rango + ' · generado el ' + hoy, 10)], [],
    cab(['Sucursal', 'Área', 'Ventas (Bs)', 'Efectivo (Bs)', 'QR (Bs)', 'Gastos (Bs)', 'Ganancia (Bs)', 'N.º de ventas'])];
  lista.forEach(s => ['Pizzería', 'Salteñería'].forEach(area => {
    if (area === 'Salteñería' && !s.tieneSalteneria) return;
    if (area === 'Pizzería' && s.tienePizzeria === false) return;
    res.push(fila(s.nombre, area, V.filter(f => f[2] === s.nombre && f[3] === area), G.filter(f => f[2] === s.nombre && f[3] === area)));
  }));
  res.push([]);
  ['Pizzería', 'Salteñería'].forEach(area => res.push(fila('TOTAL ' + area.toUpperCase(), '', V.filter(f => f[3] === area), G.filter(f => f[3] === area), 'tot')));
  res.push(fila('TOTAL GENERAL', 'Ambas áreas', V, G, 'tot'));
  const prod = {};
  V.forEach(f => { const p = prod[f[5]] = prod[f[5]] || { q: 0, m: 0 }; p.q += +f[6] || 0; p.m += +f[8] || 0; });
  res.push([], [c('Lo más vendido', 9), c('', 9), c('', 9)], cab(['Producto', 'Unidades', 'Monto (Bs)']));
  Object.entries(prod).sort((a, b) => b[1].m - a[1].m).slice(0, 10).forEach(p => res.push([c(p[0], 4), c(p[1].q, 5), c(r2(p[1].m), 3)]));
  const hojas = [{ n: 'Resumen', f: res, anchos: [26, 14, 16, 16, 14, 16, 16, 14], lineas: false }];
  const CI = filas.filter(f => f[4] === 'Cierre de caja'), AN = filas.filter(f => /anulad[ao]$/.test(f[4]));
  const E = f => f[10] || '';
  hojas.push({ n: 'Ventas', cab: true, filtro: true, anchos: [12, 8, 22, 13, 34, 10, 16, 14, 11, 20], est: [4, 4, 4, 4, 4, 5, 3, 3, 4, 4],
    f: [['Fecha', 'Hora', 'Sucursal', 'Área', 'Producto', 'Cantidad', 'Precio unit. (Bs)', 'Monto (Bs)', 'Pago', 'Empleado']].concat(V.map(f => [f[0], f[1], f[2], f[3], f[5], f[6], f[7], f[8], f[9], E(f)])) });
  hojas.push({ n: 'Gastos', cab: true, filtro: true, anchos: [12, 8, 22, 13, 40, 14, 20], est: [4, 4, 4, 4, 4, 3, 4],
    f: [['Fecha', 'Hora', 'Sucursal', 'Área', 'Motivo', 'Monto (Bs)', 'Empleado']].concat(G.map(f => [f[0], f[1], f[2], f[3], f[5], f[8], E(f)])) });
  hojas.push({ n: 'Bajas', cab: true, filtro: true, anchos: [12, 8, 22, 13, 44, 10, 20], est: [4, 4, 4, 4, 4, 5, 4],
    f: [['Fecha', 'Hora', 'Sucursal', 'Área', 'Producto (motivo)', 'Cantidad', 'Empleado']].concat(Ba.map(f => [f[0], f[1], f[2], f[3], f[5], f[6], E(f)])) });
  hojas.push({ n: 'Retiros de caja', cab: true, filtro: true, anchos: [12, 8, 22, 13, 40, 14, 20], est: [4, 4, 4, 4, 4, 3, 4],
    f: [['Fecha', 'Hora', 'Sucursal', 'Área', 'Detalle', 'Total (Bs)', 'Empleado']].concat(R.map(f => [f[0], f[1], f[2], f[3], f[5], f[8], E(f)])) });
  hojas.push({ n: 'Cierres de caja', cab: true, filtro: true, anchos: [12, 8, 22, 13, 16, 16, 16, 36, 20], est: [4, 4, 4, 4, 3, 3, 3, 4, 4],
    f: [['Fecha', 'Hora', 'Sucursal', 'Área', 'Esperado (Bs)', 'Contado (Bs)', 'Diferencia (Bs)', 'Motivo de la diferencia', 'Empleado']].concat(CI.map(f => [f[0], f[1], f[2], f[3], f[6], f[7], f[8], f[5], E(f)])) });
  hojas.push({ n: 'Anuladas', cab: true, filtro: true, anchos: [12, 8, 22, 13, 16, 52, 30], est: [4, 4, 4, 4, 4, 4, 4],
    f: [['Fecha', 'Hora', 'Sucursal', 'Área', 'Tipo', 'Detalle (motivo)', 'Empleado']].concat(AN.map(f => [f[0], f[1], f[2], f[3], f[4], f[5], E(f)])) });
  return hojas;
}

let rangoDatos = 'mes', sucDatos = 'todas';
// ============================================================
// Importar sucursales desde un archivo (carga masiva)
// ============================================================
async function pantallaImportar(existentes) {
  app.innerHTML = `
    <div class="header"><button class="header-btn" id="btn-atras">${ic('back')}</button><div class="t-subtitle">Importar sucursales</div><div style="width:38px;"></div></div>
    <div class="px stack">
      <div class="t-secondary">Elige el archivo <b>sucursales-carga.json</b> (o pega su contenido). Primero se revisa y solo después se importa. Si una sucursal ya existe, se actualizan sus empleados, precios y productos (los PIN no cambian).</div>
      <input type="file" id="in-archivo" accept=".json,application/json">
      <div class="field"><label>Contenido del archivo</label><textarea id="in-json" rows="7" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text-primary);font-size:.8rem;"></textarea></div>
      <button class="btn btn-secondary" id="btn-revisar">Revisar</button>
      <div id="import-res" class="stack"></div>
    </div>
    ${navInferiorAdmin('datos')}`;
  document.getElementById('btn-atras').onclick = () => pantallaDatos();
  wireNavInferiorAdmin();
  const norm = t => String(t || '').trim().toLowerCase();
  document.getElementById('in-archivo').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    document.getElementById('in-json').value = await f.text();
    document.getElementById('btn-revisar').click();
  };
  document.getElementById('btn-revisar').onclick = () => {
    const res = document.getElementById('import-res'); res.innerHTML = '';
    let datos;
    try { datos = JSON.parse(document.getElementById('in-json').value); } catch (e) { res.innerHTML = '<div class="error-text">El contenido no es un archivo válido.</div>'; return; }
    const lista = Array.isArray(datos.sucursales) ? datos.sucursales : [];
    if (!lista.length) { res.innerHTML = '<div class="error-text">No hay sucursales en el archivo.</div>'; return; }
    const porNombre = new Map(existentes.map(s => [norm(s.nombre), s]));
    const pinsUsados = new Set();
    existentes.forEach(s => Object.values(s.compartimentos || {}).forEach(c => { if (c && c.pin) pinsUsados.add(String(c.pin)); }));
    const ok = [], actualizar = [], errores = [];
    lista.forEach(x => {
      const n = (x.nombre || '').trim();
      if (!n) { errores.push('Hay una sucursal sin nombre.'); return; }
      const exAnt = porNombre.get(norm(n)) || (x.antes ? porNombre.get(norm(x.antes)) : null);   // "antes": nombre anterior (si cambió de nombre)
      if (exAnt) {
        const ex = exAnt;
        if (x.tieneSalteneria && !(ex.compartimentos && ex.compartimentos.salteneria)) {   // la sucursal aún no tenía salteñería: hace falta su PIN
          const p = String(x.salteneria && x.salteneria.pin);
          if (!/^\d{4}$/.test(p)) { errores.push(n + ': falta un PIN de 4 dígitos para la salteñería.'); return; }
          if (pinsUsados.has(p)) { errores.push(n + ': el PIN ' + p + ' ya lo usa otro empleado.'); return; }
          pinsUsados.add(p);
        }
        actualizar.push({ x, ex }); return;
      }
      const pins = [x.pizzeria && x.pizzeria.pin].concat(x.tieneSalteneria ? [x.salteneria && x.salteneria.pin] : []).map(String);
      const mal = pins.find(p => !/^\d{4}$/.test(p));
      if (mal !== undefined) { errores.push(n + ': todos los PIN deben tener 4 dígitos.'); return; }
      const repetido = pins.find(p => pinsUsados.has(p));
      if (repetido) { errores.push(n + ': el PIN ' + repetido + ' ya lo usa otro empleado.'); return; }
      pins.forEach(p => pinsUsados.add(p));
      ok.push(x);
    });
    res.innerHTML = `
      <div class="card"><b>${ok.length}</b> sucursal(es) nuevas${actualizar.length ? `<div class="t-secondary">Ya existen y se actualizan (${actualizar.length}): ${actualizar.map(u => esc(u.x.nombre)).join(', ')}.</div>` : ''}${(datos.catalogo || []).length ? `<div class="t-secondary">Productos extra: ${datos.catalogo.length}.</div>` : ''}
        ${ok.length ? `<div class="t-secondary" style="margin-top:6px;">${ok.map(x => esc(x.nombre)).join(' · ')}</div>` : ''}</div>
      ${errores.length ? `<div class="error-text">${errores.map(esc).join('<br>')}</div>` : ''}
      ${(ok.length || actualizar.length) && !errores.length ? '<button class="btn btn-primary" id="btn-importar">Importar ahora</button><div class="t-secondary" id="import-msg"></div>' : ''}`;
    const bi = document.getElementById('btn-importar');
    if (!bi) return;
    bi.onclick = async () => {
      if (!navigator.onLine) { alert('Conéctate a internet para importar.'); return; }
      bi.disabled = true; document.getElementById('import-msg').textContent = 'Importando…';
      try {
        const batch = db.batch();
        const idPorNombre = new Map(existentes.map(s => [norm(s.nombre), s.id]));
        actualizar.forEach(({ x, ex }) => {
          const upd = { tieneCajasPizza: !!x.tieneCajasPizza, nombre: x.nombre.trim() };
          if ((x.pizzeria.empleado || '').trim()) upd['compartimentos.pizzeria.empleadoNombre'] = x.pizzeria.empleado.trim();
          if (x.tieneSalteneria && x.salteneria) {
            if (ex.compartimentos && ex.compartimentos.salteneria) { if ((x.salteneria.empleado || '').trim()) upd['compartimentos.salteneria.empleadoNombre'] = x.salteneria.empleado.trim(); }
            else { upd['compartimentos.salteneria'] = { empleadoNombre: (x.salteneria.empleado || '').trim() || 'Empleado Salteñería', pin: String(x.salteneria.pin) }; upd.tieneSalteneria = true; }
          }
          batch.update(db.collection('sucursales').doc(ex.id), upd);
          batch.set(db.collection('sucursales').doc(ex.id).collection('compartimentos').doc('pizzeria'), { precios: x.pizzeria.precios || {}, ocultos: x.pizzeria.ocultos || [] }, { merge: true });
          if (x.tieneSalteneria && x.salteneria) batch.set(db.collection('sucursales').doc(ex.id).collection('compartimentos').doc('salteneria'), { precios: x.salteneria.precios || {}, ocultos: x.salteneria.ocultos || [] }, { merge: true });
        });
        ok.forEach(x => {
          const ref = db.collection('sucursales').doc();
          idPorNombre.set(norm(x.nombre), ref.id);
          const compartimentos = { pizzeria: { empleadoNombre: (x.pizzeria.empleado || '').trim() || 'Empleado Pizzería', pin: String(x.pizzeria.pin) } };
          if (x.tieneSalteneria) compartimentos.salteneria = { empleadoNombre: (x.salteneria.empleado || '').trim() || 'Empleado Salteñería', pin: String(x.salteneria.pin) };
          batch.set(ref, { nombre: x.nombre.trim(), zona: x.zona || '', orden: x.orden || 99, activo: true, tieneSalteneria: !!x.tieneSalteneria, tieneCajasPizza: !!x.tieneCajasPizza, compartimentos, schemaVersion: 1 });
          batch.set(ref.collection('compartimentos').doc('pizzeria'), { precios: x.pizzeria.precios || {}, ocultos: x.pizzeria.ocultos || [] }, { merge: true });
          if (x.tieneSalteneria) batch.set(ref.collection('compartimentos').doc('salteneria'), { precios: x.salteneria.precios || {}, ocultos: x.salteneria.ocultos || [] }, { merge: true });
        });
        (datos.catalogo || []).forEach(c => {
          const ids = (c.soloEn || []).map(n => idPorNombre.get(norm(n))).filter(Boolean);
          batch.set(db.collection('productos').doc('p-' + idSeguro(c.nombre) + '-' + c.area), { nombre: c.nombre, categoria: c.categoria || 'otro', area: c.area, precio: c.precio > 0 ? c.precio : null, controlaStock: !!c.controlaStock, activo: true, base: false, soloSucursales: ids, schemaVersion: 1 }, { merge: true });
        });
        await conTiempoLimite(batch.commit(), 30000, 'importar sucursales');
        document.getElementById('import-msg').textContent = 'Listo: ' + ok.length + ' nuevas y ' + actualizar.length + ' actualizadas.';
        setTimeout(() => pantallaPanel(), 1200);
      } catch (e) {
        bi.disabled = false;
        document.getElementById('import-msg').textContent = 'No se pudo importar. Revisa tu conexión e intenta de nuevo.';
      }
    };
  };
}

async function pantallaDatos() {
  app.innerHTML = `<div class="empty-state">Cargando…</div>`;
  let sucursales;
  try { sucursales = await cargarSucursalesConCaja(); } catch (e) { return mostrarError('cargar datos', e); }
  function render() {
    app.innerHTML = `
      <div class="header"><div><div class="t-title" style="font-size:1.3rem;">Datos</div><div class="t-secondary">Historial completo y exportación</div></div><button class="header-btn" id="btn-tema">${ic('palette')}</button></div>
      <div class="content">
        <div class="card stack">
          <div class="t-body">Los empleados ven solo los últimos 3 meses. Aquí tienes todo el historial guardado.</div>
          <div class="field"><label>Período</label><div class="seg" id="seg-r">${[['mes', 'Este mes'], ['90', '3 meses'], ['todo', 'Todo']].map(p => `<button data-r="${p[0]}" class="${rangoDatos === p[0] ? 'on' : ''}">${p[1]}</button>`).join('')}</div></div>
          <div class="field"><label>Sucursal</label><select id="sel-suc"><option value="todas">Todas</option>${sucursales.map(s => `<option value="${s.id}" ${sucDatos === s.id ? 'selected' : ''}>${esc(s.nombre)}</option>`).join('')}</select></div>
          <button class="btn btn-primary" id="btn-excel">${ic('down', 18)} Descargar Excel</button>
          <div class="error-text" id="datos-msg"></div>
        </div>
        <div class="t-secondary" style="text-align:center;">Excel con hoja Resumen (por área y total), Ventas, Gastos, Bajas, Retiros, Cierres de caja y Anuladas, cada una con el nombre del empleado.</div>
        <div class="card stack"><div class="t-body"><b>Archivar meses antiguos</b></div><div class="t-secondary">Descarga en Excel todo lo anterior a los últimos 3 meses y, si lo confirmas, lo borra de la app para que siga rápida. Los saldos de caja y el stock no cambian.</div><button class="btn btn-secondary" id="btn-archivar">Archivar y liberar espacio</button></div>
        <div class="card stack"><div class="t-body"><b>Reiniciar a cero</b></div><div class="t-secondary">Borra ventas, gastos, bajas, retiros y cierres, deja la caja y el stock en 0, y conserva empleados, PIN, precios y catálogo. Antes descarga un Excel de respaldo. No se puede deshacer.</div><div class="field"><label>Sucursal</label><select id="sel-reset"><option value="todas">Todas las sucursales</option>${sucursales.map(s => `<option value="${s.id}">${esc(s.nombre)}</option>`).join('')}</select></div><button class="btn btn-danger" id="btn-reset">Reiniciar a cero</button><div class="error-text" id="reset-msg"></div></div>
        <button class="btn btn-secondary" id="btn-importar-suc">Importar sucursales desde archivo</button>
        <button class="btn btn-secondary" id="btn-cerrar-sesion">Cerrar sesión del panel</button>
      </div>
      ${navInferiorAdmin('datos')}`;
    document.getElementById('btn-tema').onclick = () => abrirSelectorTema(render);
    document.querySelectorAll('#seg-r button').forEach(b => { b.onclick = () => { rangoDatos = b.dataset.r; render(); }; });
    document.getElementById('sel-suc').onchange = e => { sucDatos = e.target.value; };
    document.getElementById('btn-excel').onclick = () => exportar(false);
    document.getElementById('btn-archivar').onclick = () => exportar(true);
    document.getElementById('btn-reset').onclick = () => reiniciarACero();
    document.getElementById('btn-importar-suc').onclick = () => pantallaImportar(sucursales);
    document.getElementById('btn-cerrar-sesion').onclick = async () => {
      if (!navigator.onLine) { alert('Conéctate a internet para cerrar sesión (así no se pierde ningún cambio pendiente).'); return; }
      if (!confirm('¿Cerrar sesión? Para volver a entrar necesitarás tu correo y tu contraseña.')) return;
      try { await auth.signOut(); } catch (e) {}
      iniciar();
    };
    wireNavInferiorAdmin();
  }
  async function exportar(archivar) {
    if (archivar && !navigator.onLine) { alert('Conéctate a internet para archivar.'); return; }
    window.scrollTo(0, 0);
    const msg = document.getElementById('datos-msg'); msg.style.color = 'var(--text-secondary)'; msg.textContent = 'Preparando archivo…';
    const hoy = hoyISO();
    const desde = archivar ? '0000-00-00' : rangoDatos === 'mes' ? hoy.slice(0, 8) + '01' : rangoDatos === '90' ? sumarDias(hoy, -90) : '0000-00-00';
    const hasta = archivar ? sumarDias(hoy, -90) : null;
    const filas = [], refs = [], T = [];
    const lista = archivar ? sucursales : sucursales.filter(s => sucDatos === 'todas' || s.id === sucDatos);
    const q = (ref, tipo, s, area, fn) => { let qq = ref.where('fecha', '>=', desde); if (hasta) qq = qq.where('fecha', '<', hasta); T.push(qq.get().then(r => r.docs.forEach(d => { filas.push(fn(d.data(), tipo, s, area)); refs.push(d.ref); }))); };
    const emp = x => x.anulado && x.anuladoPor ? (x.empleado || '') + ' (anuló: ' + x.anuladoPor + ')' : (x.empleado || '');
    const hora = x => (x.creadoEn && x.creadoEn.toDate) ? x.creadoEn.toDate().toLocaleTimeString('es-BO', { hour: '2-digit', minute: '2-digit' }) : '';
    lista.forEach(s => {
      compsDe(s).forEach(c => {
        const base = db.collection('sucursales').doc(s.id).collection('compartimentos').doc(c), area = c === 'pizzeria' ? 'Pizzería' : 'Salteñería';
        q(base.collection('ventas'), 'Venta', s, area, (x, t) => [x.fecha, hora(x), s.nombre, area, x.anulado ? t + ' anulada' : t, x.producto + (x.anulado ? ' (motivo: ' + (x.anuladoMotivo || '') + ')' : ''), x.cantidad || 1, x.precioUnitario || '', x.anulado ? '' : x.monto, x.formaPago === 'qr' ? 'QR' : 'Efectivo', emp(x)]);
        q(base.collection('gastos'), 'Gasto', s, area, (x, t) => [x.fecha, hora(x), s.nombre, area, x.anulado ? t + ' anulado' : t, x.motivo + (x.anulado ? ' (motivo: ' + (x.anuladoMotivo || '') + ')' : ''), '', '', x.anulado ? '' : x.monto, '', emp(x)]);
        q(base.collection('mermas'), 'Baja', s, area, (x, t) => [x.fecha, hora(x), s.nombre, area, t, x.producto + (x.motivo ? ' (' + x.motivo + ')' : ''), x.cantidad, '', '', '', emp(x)]);
        q(base.collection('cierres'), 'Cierre', s, area, (x, t) => [x.fecha, hora(x), s.nombre, area, 'Cierre de caja', x.nota || '', x.esperado, x.contado, x.diferencia, '', emp(x)]);
        q(base.collection('retiros'), 'Retiro de caja', s, area, (x, t) => [x.fecha, hora(x), s.nombre, area, t, 'Efectivo ' + (x.efectivo || 0) + ' · QR ' + (x.qr || 0), '', '', x.total, '', emp(x)]);
      });
      q(db.collection('sucursales').doc(s.id).collection('mermasCompartidas'), 'Baja', s, 'Compartido', (x, t) => [x.fecha, hora(x), s.nombre, 'Compartido', t, x.producto + (x.motivo ? ' (' + x.motivo + ')' : ''), x.cantidad, '', '', '', emp(x)]);
    });
    try { await conTiempoLimite(Promise.all(T), 40000, 'leer el historial'); } catch (e) { msg.style.color = 'var(--danger)'; msg.textContent = 'No se pudo leer el historial. Revisa tu conexión.'; return false; }
    if (!filas.length) { msg.textContent = archivar ? 'No hay nada para archivar: todo es de los últimos 3 meses.' : 'No hay movimientos en ese período.'; return true; }
    filas.sort((a, b) => (b[0] + b[1]).localeCompare(a[0] + a[1]));
    const rango = archivar ? 'archivo anterior al ' + hasta + ' · todas las sucursales' : { mes: 'este mes', '90': 'últimos 3 meses', todo: 'todo el historial' }[rangoDatos] + (sucDatos === 'todas' ? ' · todas las sucursales' : '');
    const bytes = crearXlsx(armarHojas(filas, lista, rango, hoy));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    a.download = archivar ? 'salas-archivo-antes-de-' + hasta + '.xlsx' : 'salas-historial-' + hoy + '.xlsx';
    document.body.appendChild(a); a.click(); a.remove();
    if (archivar) {
      if (!confirm('Se descargó el archivo con ' + filas.length + ' registros anteriores al ' + hasta + '. Revisa que esté en tus descargas.\n\n¿Borrar esos registros de la app para dejarla liviana? Esto no se puede deshacer. Los saldos de caja y el stock no cambian.')) { msg.textContent = 'Archivo descargado. No se borró nada.'; return; }
      msg.textContent = 'Borrando registros archivados…';
      try {
        for (let i = 0; i < refs.length; i += 400) { const b = db.batch(); refs.slice(i, i + 400).forEach(r => b.delete(r)); await conTiempoLimite(b.commit(), 30000, 'borrar archivados'); }
        msg.textContent = 'Listo: ' + refs.length + ' registros archivados y borrados de la app.';
      } catch (e) { msg.style.color = 'var(--danger)'; msg.textContent = 'No se pudo borrar todo. El archivo ya está descargado; intenta de nuevo.'; }
      return;
    }
    msg.textContent = filas.length + ' movimientos exportados.';
    return true;
  }
  async function reiniciarACero() {
    const msg = document.getElementById('reset-msg');
    const sel = document.getElementById('sel-reset').value;
    const lista = sucursales.filter(s => sel === 'todas' || s.id === sel);
    if (!lista.length) return;
    if (!navigator.onLine) { alert('Conéctate a internet para reiniciar.'); return; }
    msg.style.color = 'var(--danger)'; msg.textContent = '';
    const quien = sel === 'todas' ? 'TODAS las sucursales' : '"' + lista[0].nombre + '"';
    if (!confirm('Vas a dejar en 0 ' + quien + ':\n\n- Se borran ventas, gastos, bajas, retiros y cierres.\n- La caja y el stock quedan en 0.\n- Se conservan empleados, PIN, precios y catálogo.\n\nPrimero se descargará un Excel de respaldo. Esto no se puede deshacer. ¿Continuar?')) return;
    const palabra = prompt('Para confirmar escribe BORRAR (en mayúsculas):');
    if (palabra === null || palabra.trim() !== 'BORRAR') { msg.style.color = 'var(--text-secondary)'; msg.textContent = 'Cancelado. No se borró nada.'; return; }
    msg.style.color = 'var(--text-secondary)'; msg.textContent = 'Descargando respaldo…';
    const rangoAnt = rangoDatos, sucAnt = sucDatos;
    rangoDatos = 'todo'; sucDatos = sel;
    let respaldo;
    try { respaldo = await exportar(false); } finally { rangoDatos = rangoAnt; sucDatos = sucAnt; }
    if (respaldo === false) { msg.style.color = 'var(--danger)'; msg.textContent = 'No se pudo hacer el respaldo. No se borró nada.'; return; }
    msg.style.color = 'var(--text-secondary)'; msg.textContent = 'Reiniciando…';
    const SUBS = ['ventas', 'gastos', 'mermas', 'cierres', 'retiros'], COMPS = ['pizzeria', 'salteneria'];
    try {
      const borrar = [], ceros = [], cajas = [], T = [];
      lista.forEach(s => {
        const sref = db.collection('sucursales').doc(s.id);
        COMPS.forEach(c => {
          const cref = sref.collection('compartimentos').doc(c);
          SUBS.forEach(n => T.push(cref.collection(n).get().then(q => q.docs.forEach(d => borrar.push(d.ref)))));
          T.push(cref.collection('stock').get().then(q => q.docs.forEach(d => ceros.push(d.ref))));
        });
        T.push(sref.collection('mermasCompartidas').get().then(q => q.docs.forEach(d => borrar.push(d.ref))));
        T.push(sref.collection('stockRefrescos').get().then(q => q.docs.forEach(d => ceros.push(d.ref))));
        compsDe(s).forEach(c => cajas.push(sref.collection('compartimentos').doc(c)));
      });
      await conTiempoLimite(Promise.all(T), 60000, 'leer los datos a borrar');
      const ops = [
        ...borrar.map(r => b => b.delete(r)),
        ...ceros.map(r => b => b.set(r, { cantidad: 0 }, { merge: true })),
        ...cajas.map(r => b => b.set(r, { cajaEfectivo: 0, cajaTotal: 0, cajaInicializada: true }, { merge: true }))
      ];
      for (let i = 0; i < ops.length; i += 400) {
        const b = db.batch();
        ops.slice(i, i + 400).forEach(f => f(b));
        await conTiempoLimite(b.commit(), 30000, 'reiniciar');
        msg.textContent = 'Reiniciando… ' + Math.min(i + 400, ops.length) + ' de ' + ops.length;
      }
      msg.style.color = 'var(--success, var(--text-secondary))';
      msg.textContent = 'Listo: ' + quien + ' quedó en 0 (' + borrar.length + ' registros borrados, ' + ceros.length + ' productos de stock en 0, caja en 0).';
    } catch (e) {
      msg.style.color = 'var(--danger)';
      msg.textContent = 'No se pudo terminar el reinicio. El respaldo ya está descargado; vuelve a intentarlo (es seguro repetirlo).';
    }
  }
  render();
}

async function iniciar() {
  try {
    app.innerHTML = `<div class="empty-state">Abriendo…</div>`;
    let usuario = null;
    try { usuario = await conTiempoLimite(usuarioGuardado(), 6000, 'comprobar sesión guardada'); } catch (e) {}
    // Solo entra quien inició sesión con correo y contraseña (la sesión anónima de los empleados no sirve aquí)
    if (!usuario || usuario.isAnonymous) return pantallaLogin();
    await pantallaReportes();
  } catch (e) {
    const paso = (e && e.message && e.message.startsWith('TIMEOUT:'))
      ? 'tardó demasiado en: ' + e.message.replace('TIMEOUT:', '')
      : 'error inesperado';
    mostrarError(paso, e);
  }
}

function pantallaLogin(aviso) {
  app.innerHTML = `
    <div class="px stack" style="padding-top:56px;max-width:420px;margin:0 auto;">
      <div class="t-title">Panel de la dueña</div>
      <div class="t-secondary">Entra con tu correo y tu contraseña.</div>
      <div class="field"><label>Correo</label><input type="email" id="lg-correo" autocomplete="username" inputmode="email" autocapitalize="off" placeholder="tucorreo@gmail.com"></div>
      <div class="field"><label>Contraseña</label><input type="password" id="lg-clave" autocomplete="current-password"></div>
      <div class="error-text" id="lg-msg">${aviso || ''}</div>
      <button class="btn btn-primary" id="lg-entrar">Entrar</button>
      <button class="link" id="lg-olvide" style="align-self:center;">¿Olvidaste tu contraseña?</button>
    </div>`;
  const msg = document.getElementById('lg-msg'), btn = document.getElementById('lg-entrar');
  const dar = (txt, ok) => { msg.style.color = ok ? 'var(--text-secondary)' : ''; msg.textContent = txt; };
  const correo = () => document.getElementById('lg-correo').value.trim().toLowerCase();
  async function entrar() {
    const c = correo(), k = document.getElementById('lg-clave').value;
    if (!c || !k) return dar('Escribe tu correo y tu contraseña.');
    if (!navigator.onLine) return dar('Necesitas internet para entrar. Después podrás abrir el panel sin internet.');
    btn.disabled = true; dar('Entrando…', true);
    try {
      await conTiempoLimite(auth.signInWithEmailAndPassword(c, k), 15000, 'iniciar sesión');
      return iniciar();
    } catch (e) {
      const m = {
        'auth/invalid-credential': 'Correo o contraseña incorrectos.', 'auth/wrong-password': 'Correo o contraseña incorrectos.',
        'auth/user-not-found': 'Correo o contraseña incorrectos.', 'auth/invalid-email': 'Ese correo no es válido.',
        'auth/too-many-requests': 'Demasiados intentos. Espera unos minutos e intenta de nuevo.',
        'auth/network-request-failed': 'No hay internet. Revisa tu conexión.',
        'auth/operation-not-allowed': 'Falta activar "Correo y contraseña" en Firebase (Authentication → Método de acceso).'
      }[e && e.code] || (e && e.message && e.message.startsWith('TIMEOUT:') ? 'Tardó demasiado. Revisa tu conexión.' : 'No se pudo entrar. ' + ((e && e.code) || ''));
      dar(m); btn.disabled = false;
    }
  }
  btn.onclick = entrar;
  document.getElementById('lg-clave').onkeydown = ev => { if (ev.key === 'Enter') entrar(); };
  document.getElementById('lg-olvide').onclick = async () => {
    const c = correo();
    if (!c) return dar('Escribe tu correo arriba y vuelve a tocar "¿Olvidaste tu contraseña?".');
    if (!navigator.onLine) return dar('Necesitas internet para recuperar la contraseña.');
    try { await auth.sendPasswordResetEmail(c); dar('Listo. Te enviamos un correo para crear una contraseña nueva (revisa también Spam).', true); }
    catch (e) { dar(e && e.code === 'auth/invalid-email' ? 'Ese correo no es válido.' : 'No se pudo enviar el correo. Intenta de nuevo.'); }
  };
}

function usuarioGuardado() {
  return new Promise((resolve) => {
    const cancelar = auth.onAuthStateChanged(user => { cancelar(); resolve(user); });
  });
}

iniciar();
