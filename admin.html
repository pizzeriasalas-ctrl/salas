<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
/* ============================================================
   DESIGN SYSTEM — Pizzería Salas / Salteñería Salas
   El color de acento es un solo "hue" (0-360, el círculo cromático
   completo) y el modo claro/oscuro es independiente. Cambiar --hue
   o [data-theme] cambia TODA la app sin tocar nada más.
   ============================================================ */
:root{
  --hue: 328; /* rosa por defecto */
  --accent: hsl(var(--hue) 68% 42%);
  --accent-hover: hsl(var(--hue) 68% 35%);
  --accent-light: hsl(var(--hue) 60% 93%);
  --bg: #faf8f8;
  --surface: #ffffff;
  --surface-2: hsl(var(--hue) 20% 96%);
  --text-primary: #211d20;
  --text-secondary: #7c7579;
  --border: hsl(var(--hue) 16% 89%);
  --success: #1f7a4d;
  --warning: #a16a12;
  --danger: #b23a2e;
  --info: #336a9e;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --shadow-sm: 0 1px 3px rgba(20,10,15,0.06);
  --shadow-md: 0 4px 16px rgba(20,10,15,0.08);
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px;
}
[data-theme="dark"]{
  --bg: hsl(var(--hue) 14% 9%);
  --surface: hsl(var(--hue) 13% 13%);
  --surface-2: hsl(var(--hue) 11% 17%);
  --text-primary: #f1edef;
  --text-secondary: #a79fa5;
  --border: hsl(var(--hue) 10% 23%);
  --accent: hsl(var(--hue) 48% 54%);
  --accent-hover: hsl(var(--hue) 48% 60%);
  --accent-light: hsl(var(--hue) 35% 22%);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.35);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text-primary);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.screen{max-width:480px;margin:0 auto;min-height:100vh;padding:0 0 32px;display:flex;flex-direction:column;}

.t-title{font-size:1.5rem;font-weight:700;margin:0 0 2px;letter-spacing:-0.01em;}
.t-subtitle{font-size:1.05rem;font-weight:600;margin:0 0 2px;}
.t-body{font-size:0.95rem;line-height:1.4;}
.t-secondary{font-size:0.85rem;color:var(--text-secondary);}
.t-price{font-size:1.6rem;font-weight:800;color:var(--accent);}
.t-eyebrow{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-secondary);font-weight:700;}

.px{padding-left:var(--space-4);padding-right:var(--space-4);}
.stack > * + *{margin-top:var(--space-3);}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;}
.grow{flex:1;}

.header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-4);}
.header-btn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;color:var(--text-primary);cursor:pointer;
}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:15px;border:none;border-radius:var(--radius-md);
  font-size:1rem;font-weight:700;cursor:pointer;transition:transform .08s ease;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:disabled{opacity:0.45;}
.btn-secondary{background:var(--accent-light);color:var(--accent);}
.btn-tertiary{background:transparent;color:var(--text-secondary);}
.btn-danger{background:#fde8e5;color:var(--danger);}

.field{width:100%;}
.field label{display:block;font-size:0.82rem;color:var(--text-secondary);margin-bottom:6px;font-weight:600;}
.field input, .field select{
  width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-size:0.98rem;background:var(--surface);color:var(--text-primary);
}
.field input:focus, .field select:focus{outline:none;border-color:var(--accent);}
.search{position:relative;}
.search input{padding-left:38px;}
.search .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-secondary);}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:var(--space-4);box-shadow:var(--shadow-sm);
}
.card-flat{background:var(--surface-2);border-radius:var(--radius-md);padding:var(--space-4);}

.sucursal-item{
  display:flex;align-items:center;gap:var(--space-3);
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-md);
  padding:14px;margin-bottom:10px;cursor:pointer;
}
.sucursal-item .avatar{
  width:42px;height:42px;border-radius:12px;background:var(--accent-light);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;
}
.sucursal-item .info{flex:1;min-width:0;}
.sucursal-item .info .nombre{font-weight:700;font-size:0.98rem;}
.sucursal-item .info .zona{font-size:0.8rem;color:var(--text-secondary);}
.sucursal-item .arrow{color:var(--text-secondary);}

.compartimento-card{
  display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);
  padding:18px;cursor:pointer;
}
.compartimento-card .emoji{font-size:1.8rem;}
.compartimento-card .info .nombre{font-weight:700;font-size:1.05rem;}
.compartimento-card .info .turno{font-size:0.82rem;color:var(--text-secondary);}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:0.72rem;font-weight:700;}
.badge-neutral{background:var(--surface-2);color:var(--text-secondary);}
.badge-success{background:#e2f6ec;color:var(--success);}
.badge-warning{background:#fdf1de;color:var(--warning);}
.badge-danger{background:#fde8e5;color:var(--danger);}
.badge-accent{background:var(--accent-light);color:var(--accent);}

.alert{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;border-radius:var(--radius-md);font-size:0.88rem;}
.alert-info{background:var(--accent-light);color:var(--accent);}
.alert-warning{background:#fdf1de;color:var(--warning);}
.alert-danger{background:#fde8e5;color:var(--danger);}

.pin-dots{display:flex;gap:14px;justify-content:center;margin:var(--space-6) 0;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);}
.pin-dot.filled{background:var(--accent);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 var(--space-4);}
.keypad button{
  aspect-ratio:1;border-radius:var(--radius-lg);border:1px solid var(--border);
  background:var(--surface);font-size:1.4rem;font-weight:600;color:var(--text-primary);
}
.keypad button:active{background:var(--surface-2);}
.keypad button.ok{background:var(--accent);color:#fff;border-color:var(--accent);}

.stat-row{display:flex;gap:10px;}
.stat-box{flex:1;background:var(--surface-2);border-radius:var(--radius-md);padding:14px;text-align:center;}
.stat-box .valor{font-size:1.3rem;font-weight:800;}
.stat-box .lbl{font-size:0.75rem;color:var(--text-secondary);margin-top:2px;}

.toggle{display:flex;gap:8px;}
.toggle button{
  flex:1;padding:11px;border-radius:var(--radius-sm);border:1.5px solid var(--border);
  background:var(--surface);color:var(--text-primary);font-weight:700;font-size:0.9rem;
}
.toggle button.active{background:var(--accent);color:#fff;border-color:var(--accent);}

.hue-strip{
  height:44px;border-radius:22px;margin:var(--space-3) 0;position:relative;
  background:linear-gradient(to right,
    hsl(0 50% 45%), hsl(30 50% 45%), hsl(60 50% 42%), hsl(90 50% 40%),
    hsl(120 45% 38%), hsl(150 45% 38%), hsl(180 42% 40%), hsl(210 48% 45%),
    hsl(240 45% 48%), hsl(270 45% 45%), hsl(300 45% 42%), hsl(330 50% 42%), hsl(360 50% 45%));
}
.hue-strip input[type=range]{-webkit-appearance:none;width:100%;height:44px;background:transparent;margin:0;}
.hue-strip input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;
  border:3px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,0.3);
}
.swatch-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:var(--space-3);}
.swatch{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;}
.swatch.selected{border-color:var(--text-primary);}

.empty-state{text-align:center;padding:var(--space-8) var(--space-4);color:var(--text-secondary);}
.empty-state .icon{font-size:2.2rem;margin-bottom:8px;}
.error-text{color:var(--danger);font-size:0.85rem;text-align:center;min-height:1.2em;}

.logo-mark{
  width:84px;height:84px;border-radius:24px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:2.2rem;
  box-shadow:var(--shadow-md);margin-bottom:var(--space-4);
}

/* --- Header enriquecido --- */
.avatar-circle{
  width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;flex-shrink:0;
}
.header-rich{display:flex;align-items:center;gap:12px;padding:var(--space-4);}
.bell-btn{position:relative;}
.bell-dot{
  position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;
  background:var(--danger);border:2px solid var(--surface);
}

/* --- Botón de acceso rápido con icono --- */
.quick-btn{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:var(--surface-2);border:none;border-radius:var(--radius-md);
  padding:14px 6px;font-size:0.78rem;font-weight:700;color:var(--text-primary);flex:1;
}
.quick-btn .ic{font-size:1.35rem;}

/* --- Gráfico de ventas por hora --- */
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:var(--space-3);}
.chart-bars .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.chart-bars .bar{width:100%;max-width:22px;border-radius:6px 6px 2px 2px;background:var(--accent-light);transition:height .3s ease;}
.chart-bars .bar.filled{background:var(--accent);}
.chart-bars .bar-lbl{font-size:0.62rem;color:var(--text-secondary);margin-top:4px;}

/* --- Navegación inferior fija (reutilizable) --- */
.bottom-nav{
  position:sticky;bottom:0;display:flex;background:var(--surface);
  border-top:1px solid var(--border);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));
  margin-top:auto;
}
.bottom-nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:none;border:none;color:var(--text-secondary);font-size:0.66rem;font-weight:700;padding:4px;
}
.bottom-nav button .ic{font-size:1.3rem;}
.bottom-nav button.active{color:var(--accent);}

.screen{padding-bottom:0;animation:ent .25s ease}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sync-pill{position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top,0px));z-index:50;padding:6px 14px;border-radius:20px;font-size:.74rem;font-weight:700;box-shadow:var(--shadow-md);max-width:92%;text-align:center}
.sync-pill.off{background:#fdf1de;color:#7a4e0a;border:1px solid #e8c88a}
.sync-pill.sync{background:var(--accent-light);color:var(--accent);border:1px solid var(--accent)}
.sync-pill.ok{background:#e2f6ec;color:#1f7a4d;border:1px solid #9fd8b9}
.sync-pill[hidden]{display:none}
.content{padding:0 var(--space-4) var(--space-6);flex:1}
.content > * + *{margin-top:var(--space-3)}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:transparent;padding:9px 6px;border-radius:11px;font-weight:700;font-size:.85rem;color:var(--text-secondary)}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-sm)}
.hero{border-radius:24px;padding:22px 20px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,hsl(var(--hue) 62% 34%),hsl(calc(var(--hue) + 28) 60% 46%));box-shadow:var(--shadow-md)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .big{font-size:2.3rem;font-weight:800;letter-spacing:-.02em;margin:4px 0 8px}
.hero .lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;opacity:.85;font-weight:700}
.hero .chip{display:inline-flex;gap:6px;background:rgba(255,255,255,.2);padding:4px 11px;border-radius:20px;font-size:.78rem;font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px;box-shadow:var(--shadow-sm)}
.kpi .v{font-size:1.25rem;font-weight:800;margin-top:4px}
.kpi .l{font-size:.74rem;color:var(--text-secondary);display:flex;align-items:center;gap:5px;font-weight:600}
.sec{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-secondary);font-weight:800;margin-top:var(--space-5)!important}
.prog{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:7px}
.prog > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),hsl(calc(var(--hue) + 28) 60% 52%))}
.rank{display:flex;gap:11px;align-items:center}
.rank .n{width:26px;height:26px;border-radius:8px;background:var(--accent-light);color:var(--accent);font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chart-bars.gr{height:110px;gap:3px}
.chart-bars.gr .bar{max-width:none}
.bottom-nav{position:sticky;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px)}
.bottom-nav button.active .ic{background:var(--accent-light);border-radius:14px;padding:3px 16px}
.bottom-nav button .ic{display:flex;transition:all .15s;padding:3px 16px}
.pin-v{font-family:ui-monospace,monospace;letter-spacing:.2em;font-weight:700}
.link{background:none;border:none;color:var(--accent);font-weight:700;font-size:.82rem;padding:6px}
</style>
</head>

// ============================================================
// 1) TEMA — hue (0-360) + modo claro/oscuro, guardado por dispositivo

function cargarTema() {
  const hue = localStorage.getItem('salas_admin_hue');
  const modo = localStorage.getItem('salas_admin_modo');
  if (hue) document.documentElement.style.setProperty('--hue', hue);
  if (modo === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
}
function aplicarHue(hue) {
  document.documentElement.style.setProperty('--hue', hue);
  localStorage.setItem('salas_admin_hue', hue);
}
function aplicarModo(modo) {
  if (modo === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  localStorage.setItem('salas_admin_modo', modo);
}
cargarTema();

function slug(s) {
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-');
}
function itemsStockPizza() {

function isoLocal(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function hoyISO() { return isoLocal(new Date()); }
function sumarDias(iso, n) { const [a, m, d] = iso.split('-').map(Number); return isoLocal(new Date(a, m - 1, d + n)); }
function compsDe(s) { return ['pizzeria', 'salteneria'].filter(c => c === 'pizzeria' || s.tieneSalteneria); }
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function conTiempoLimite(promesa, ms, etiqueta) {
  return Promise.race([
    promesa,
    new Promise((_, reject) => setTimeout(() => reject(new Error('TIMEOUT:' + etiqueta)), ms))
  ]);
}

async function cargarSucursalesConCaja() {
  const snap = await conTiempoLimite(db.collection('sucursales').where('activo', '==', true).get(), 15000, 'cargar sucursales');
  const sucursales = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  sucursales.sort((a, b) => (a.orden || 99) - (b.orden || 99));
  // Para cada sucursal, traemos la caja acumulada de sus compartimentos
  await Promise.all(sucursales.map(async (s) => {
    const comps = ['pizzeria', 'salteneria'].filter(c => c === 'pizzeria' || s.tieneSalteneria);
    const [docs, stockSnaps, refrescosSnap] = await Promise.all([
      Promise.all(comps.map(c => db.collection('sucursales').doc(s.id).collection('compartimentos').doc(c).get())),
      Promise.all(comps.map(c => db.collection('sucursales').doc(s.id).collection('compartimentos').doc(c).collection('stock').get())),
      db.collection('sucursales').doc(s.id).collection('stockRefrescos').get()
    ]);
    s._cajaTotal = docs.reduce((a, d) => a + (d.exists ? (d.data().cajaTotal || 0) : 0), 0);
    let agotados = 0;
    stockSnaps.forEach(snapStock => snapStock.forEach(doc => { if ((doc.data().cantidad || 0) <= 0) agotados++; }));
    refrescosSnap.forEach(doc => { if ((doc.data().cantidad || 0) <= 0) agotados++; });
    s._stockBajo = agotados;
  }));
  return sucursales;
}

            <button data-v="no">No</button>
          </div>
        </div>

      <div class="error-text" id="sucursal-error"></div>

      document.querySelectorAll('#toggle-saltena button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      document.getElementById('campo-pin-saltena').style.display = tieneSaltena ? 'block' : 'none';

async function pantallaDetalleSucursal(s) {

function pantallaEditarEmpleado(s, compartimento, volver) {
  const comp = (s.compartimentos && s.compartimentos[compartimento]) || {};
  const nombreComp = compartimento === 'pizzeria' ? 'Pizzería' : 'Salteñería';
  app.innerHTML = `
    <div class="header">
      <button class="header-btn" id="btn-atras">${ic('back')}</button>
      <div class="t-subtitle">Empleado · ${nombreComp}</div>
      <div style="width:38px;"></div>
    </div>
    <div class="px stack">
      <div class="t-secondary">${s.nombre}</div>
      <div class="field"><label>Nombre del empleado</label><input type="text" id="in-nombre-emp" value="${comp.empleadoNombre || ''}"></div>
      <div class="field"><label>PIN (4 dígitos)</label><input type="text" id="in-pin-emp" inputmode="numeric" maxlength="4" value="${comp.pin || ''}"></div>
      <button class="btn btn-primary" id="btn-guardar-empleado">Guardar</button>
      <div class="error-text" id="empleado-error"></div>
    </div>
  `;
  document.getElementById('btn-atras').onclick = volver;
  document.getElementById('btn-guardar-empleado').onclick = async () => {
    const nombre = document.getElementById('in-nombre-emp').value.trim();
    const pin = document.getElementById('in-pin-emp').value.trim();
    const errorEl = document.getElementById('empleado-error');
    if (!nombre) { errorEl.textContent = 'Ponle un nombre al empleado.'; return; }
    if (!/^\d{4}$/.test(pin)) { errorEl.textContent = 'El PIN debe tener 4 dígitos.'; return; }
    errorEl.textContent = '';
    try {
      await noEsperar(db.collection('sucursales').doc(s.id).update({
        [`compartimentos.${compartimento}.empleadoNombre`]: nombre,
        [`compartimentos.${compartimento}.pin`]: pin
      }));
      s.compartimentos[compartimento] = { ...comp, empleadoNombre: nombre, pin };
      volver();
    } catch (e) {
      errorEl.textContent = 'No se pudo guardar.';
    }
  };
}

let periodoRep = 'hoy';
async function pantallaReportes() {
  app.innerHTML = `<div class="empty-state">Calculando reportes…</div>`;
  let sucursales;
  try { sucursales = await cargarSucursalesConCaja(); } catch (e) { return mostrarError('cargar reportes', e); }
  const n = { hoy: 1, '7': 7, '30': 30 }[periodoRep];
  const hoy = hoyISO(), ini = sumarDias(hoy, -(n - 1)), iniPrev = sumarDias(hoy, -(2 * n - 1)), finPrev = sumarDias(hoy, -n);
  const V = [], G = [], T = [];
  sucursales.forEach(s => compsDe(s).forEach(c => {
    const base = db.collection('sucursales').doc(s.id).collection('compartimentos').doc(c);
    T.push(base.collection('ventas').where('fecha', '>=', iniPrev).get().then(q => q.docs.forEach(d => V.push({ ...d.data(), sid: s.id }))));
    T.push(base.collection('gastos').where('fecha', '>=', iniPrev).get().then(q => q.docs.forEach(d => G.push({ ...d.data(), sid: s.id }))));
  }));
  try { await conTiempoLimite(Promise.all(T), 25000, 'calcular reportes'); } catch (e) { return mostrarError('calcular reportes', e); }

  const act = V.filter(v => v.fecha >= ini), prev = V.filter(v => v.fecha >= iniPrev && v.fecha <= finPrev);
  const suma = (l, k) => l.reduce((a, x) => a + (x[k] || 0), 0);
  const total = suma(act, 'monto'), totalPrev = suma(prev, 'monto');
  const efectivo = suma(act.filter(v => v.formaPago === 'efectivo'), 'monto'), qr = total - efectivo;
  const gastos = suma(G.filter(g => g.fecha >= ini), 'monto');
  const delta = totalPrev > 0 ? (total - totalPrev) / totalPrev * 100 : (total > 0 ? 100 : 0);
  const cajaGeneral = sucursales.reduce((a, s) => a + s._cajaTotal, 0);
  const agotados = sucursales.reduce((a, s) => a + s._stockBajo, 0);
  const unidades = suma(act, 'cantidad');

  // gráfico
  let barras = [];
  if (n === 1) {
    for (let h = 8; h <= 21; h++) barras.push({ l: h % 2 === 0 ? h : '', v: 0, t: h + ':00' });
    act.forEach(v => { if (v.creadoEn && v.creadoEn.toDate) { const h = v.creadoEn.toDate().getHours(); if (h >= 8 && h <= 21) barras[h - 8].v += v.monto; } });
  } else {
    for (let i = 0; i < n; i++) { const f = sumarDias(ini, i); barras.push({ l: (n === 7 || i % 5 === 0) ? f.slice(8) : '', v: 0, f, t: f.slice(8) + '/' + f.slice(5, 7) }); }
    act.forEach(v => { const b = barras.find(x => x.f === v.fecha); if (b) b.v += v.monto; });
  }
  const maxB = Math.max(1, ...barras.map(b => b.v));

  // por sucursal y productos
  const porSuc = sucursales.map(s => ({ s, v: suma(act.filter(x => x.sid === s.id), 'monto'), p: suma(prev.filter(x => x.sid === s.id), 'monto') })).sort((a, b) => b.v - a.v);
  const maxS = Math.max(1, ...porSuc.map(x => x.v));
  const prod = {};
  act.forEach(v => { const p = prod[v.producto] = prod[v.producto] || { q: 0, m: 0 }; p.q += v.cantidad || 1; p.m += v.monto; });
  const top = Object.entries(prod).sort((a, b) => b[1].m - a[1].m).slice(0, 6);
  const maxP = Math.max(1, ...top.map(x => x[1].m));
  const etiqueta = { hoy: 'hoy', '7': 'últimos 7 días', '30': 'últimos 30 días' }[periodoRep];
  const vs = { hoy: 'ayer', '7': '7 días previos', '30': '30 días previos' }[periodoRep];
  const bs = x => x.toLocaleString('es-BO', { minimumFractionDigits: 0, maximumFractionDigits: 0 }) + ' Bs';

  function render() {
    app.innerHTML = `
      <div class="header">
        <div>
          <div class="t-title" style="font-size:1.3rem;">Reportes</div>
          <div class="t-secondary" style="text-transform:capitalize;">${new Date().toLocaleDateString('es-BO', { weekday: 'long', day: 'numeric', month: 'long' })}</div>
        </div>
        <button class="header-btn" id="btn-tema">${ic('palette')}</button>
      </div>
      <div class="content">
        <div class="seg" id="seg">${[['hoy', 'Hoy'], ['7', '7 días'], ['30', '30 días']].map(p => `<button data-p="${p[0]}" class="${periodoRep === p[0] ? 'on' : ''}">${p[1]}</button>`).join('')}</div>
        <div class="hero">
          <div class="lbl">Ventas · ${etiqueta}</div>
          <div class="big">${total.toLocaleString('es-BO', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} Bs</div>
          <span class="chip">${delta >= 0 ? '▲' : '▼'} ${Math.abs(delta).toFixed(0)}% vs ${vs} (${bs(totalPrev)})</span>
        </div>
        <div class="kpis">
          <div class="kpi"><div class="l">${ic('cash', 14)} Efectivo</div><div class="v">${bs(efectivo)}</div></div>
          <div class="kpi"><div class="l">${ic('phone', 14)} QR</div><div class="v">${bs(qr)}</div></div>
          <div class="kpi"><div class="l">Gastos</div><div class="v">${bs(gastos)}</div></div>
          <div class="kpi"><div class="l">Ganancia</div><div class="v" style="color:${total - gastos >= 0 ? 'var(--success)' : 'var(--danger)'}">${bs(total - gastos)}</div></div>
          <div class="kpi"><div class="l">${ic('wallet', 14)} Caja general</div><div class="v">${bs(cajaGeneral)}</div></div>
          <div class="kpi" style="${agotados ? 'border-color:var(--danger)' : ''}"><div class="l">${ic('box', 14)} Agotados</div><div class="v">${agotados}</div></div>
        </div>
        <div class="sec">${n === 1 ? 'Ventas por hora' : 'Ventas por día'}</div>
        <div class="card">
          <div class="chart-bars gr">${barras.map(b => `<div class="bar-col" title="${b.t}: ${b.v.toFixed(0)} Bs"><div class="bar ${b.v > 0 ? 'filled' : ''}" style="height:${Math.max(3, b.v / maxB * 100)}%"></div><div class="bar-lbl">${b.l}</div></div>`).join('')}</div>
          <div class="t-secondary" style="margin-top:8px;">${unidades} producto(s) vendidos · ${act.length} venta(s)</div>
        </div>
        <div class="sec">Ranking de sucursales</div>
        ${porSuc.length === 0 ? `<div class="empty-state">Todavía no hay sucursales.</div>` : porSuc.map((x, i) => {
          const d = x.p > 0 ? (x.v - x.p) / x.p * 100 : (x.v > 0 ? 100 : 0);
          return `<div class="card" data-suc="${x.s.id}" style="cursor:pointer;"><div class="rank"><div class="n">${i + 1}</div><div class="grow"><div class="row"><b>${esc(x.s.nombre)}</b><b>${bs(x.v)}</b></div>
            <div class="prog"><i style="width:${x.v / maxS * 100}%"></i></div>
            <div class="row t-secondary" style="margin-top:6px;"><span>Caja ${bs(x.s._cajaTotal)}${x.s._stockBajo ? ' · ' + x.s._stockBajo + ' agotado(s)' : ''}</span><span class="badge ${d >= 0 ? 'badge-success' : 'badge-danger'}">${d >= 0 ? '+' : ''}${d.toFixed(0)}%</span></div></div></div></div>`;
        }).join('')}
        ${top.length ? `<div class="sec">Lo más vendido</div><div class="card">${top.map((p, i) => `<div style="${i ? 'margin-top:12px;' : ''}"><div class="row"><span class="t-body">${esc(p[0])} <span class="t-secondary">· ${p[1].q} und.</span></span><b>${bs(p[1].m)}</b></div><div class="prog"><i style="width:${p[1].m / maxP * 100}%"></i></div></div>`).join('')}</div>` : ''}
      </div>
      ${navInferiorAdmin('reportes')}`;
    document.getElementById('btn-tema').onclick = () => abrirSelectorTema(render);
    document.querySelectorAll('#seg button').forEach(b => { b.onclick = () => { periodoRep = b.dataset.p; pantallaReportes(); }; });
    document.querySelectorAll('[data-suc]').forEach(el => { el.onclick = () => pantallaDetalleSucursal(sucursales.find(x => x.id === el.dataset.suc)); });
    wireNavInferiorAdmin();
  }
  render();
}

// Genera un .xlsx real (zip sin compresión), sin librerías externas
function crearXlsx(filas) {
  const enc = new TextEncoder();
  const col = i => String.fromCharCode(65 + i);
  const x = t => String(t == null ? '' : t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const rows = filas.map((f, r) => '<row r="' + (r + 1) + '">' + f.map((v, i) => {
    const ref = col(i) + (r + 1);
    if (typeof v === 'number' && isFinite(v)) return '<c r="' + ref + '"><v>' + v + '</v></c>';
    return '<c r="' + ref + '" t="inlineStr"' + (r === 0 ? ' s="1"' : '') + '><is><t>' + x(v) + '</t></is></c>';
  }).join('') + '</row>').join('');
  const H = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const arch = [
    ['[Content_Types].xml', H + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],
    ['_rels/.rels', H + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml', H + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Historial" sheetId="1" r:id="rId1"/></sheets></workbook>'],
    ['xl/_rels/workbook.xml.rels', H + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
    ['xl/styles.xml', H + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs></styleSheet>'],
    ['xl/worksheets/sheet1.xml', H + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols><col min="1" max="2" width="12" customWidth="1"/><col min="3" max="5" width="18" customWidth="1"/><col min="6" max="6" width="38" customWidth="1"/><col min="7" max="10" width="13" customWidth="1"/></cols><sheetData>' + rows + '</sheetData></worksheet>']
  ];
  const T = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; T[n] = c >>> 0; }
  const crc = d => { let c = 0xFFFFFFFF; for (let i = 0; i < d.length; i++) c = T[(c ^ d[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const partes = [], central = []; let pos = 0;
  arch.forEach(([nom, txt]) => {
    const n = enc.encode(nom), d = enc.encode(txt), cr = crc(d);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint32(14, cr, true); lh.setUint32(18, d.length, true); lh.setUint32(22, d.length, true); lh.setUint16(26, n.length, true);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint32(16, cr, true); ch.setUint32(20, d.length, true); ch.setUint32(24, d.length, true); ch.setUint16(28, n.length, true); ch.setUint32(42, pos, true);
    partes.push(new Uint8Array(lh.buffer), n, d); central.push(new Uint8Array(ch.buffer), n);
    pos += 30 + n.length + d.length;
  });
  const tamC = central.reduce((a, p) => a + p.length, 0);
  const fin = new DataView(new ArrayBuffer(22));
  fin.setUint32(0, 0x06054b50, true); fin.setUint16(8, arch.length, true); fin.setUint16(10, arch.length, true); fin.setUint32(12, tamC, true); fin.setUint32(16, pos, true);
  const todo = partes.concat(central, [new Uint8Array(fin.buffer)]);
  const out = new Uint8Array(pos + tamC + 22); let o = 0; todo.forEach(p => { out.set(p, o); o += p.length; });
  return out;
}

let rangoDatos = 'mes', sucDatos = 'todas';
async function pantallaDatos() {
  app.innerHTML = `<div class="empty-state">Cargando…</div>`;
  let sucursales;
  try { sucursales = await cargarSucursalesConCaja(); } catch (e) { return mostrarError('cargar datos', e); }
  function render() {
    app.innerHTML = `
      <div class="header"><div><div class="t-title" style="font-size:1.3rem;">Datos</div><div class="t-secondary">Historial completo y exportación</div></div><button class="header-btn" id="btn-tema">${ic('palette')}</button></div>
      <div class="content">
        <div class="card stack">
          <div class="t-body">Los empleados ven solo los últimos 3 meses. Aquí tienes todo el historial guardado.</div>
          <div class="field"><label>Período</label><div class="seg" id="seg-r">${[['mes', 'Este mes'], ['90', '3 meses'], ['todo', 'Todo']].map(p => `<button data-r="${p[0]}" class="${rangoDatos === p[0] ? 'on' : ''}">${p[1]}</button>`).join('')}</div></div>
          <div class="field"><label>Sucursal</label><select id="sel-suc"><option value="todas">Todas</option>${sucursales.map(s => `<option value="${s.id}" ${sucDatos === s.id ? 'selected' : ''}>${esc(s.nombre)}</option>`).join('')}</select></div>
          <button class="btn btn-primary" id="btn-excel">${ic('down', 18)} Descargar Excel</button>
          <div class="error-text" id="datos-msg"></div>
        </div>
        <div class="t-secondary" style="text-align:center;">Archivo Excel (.xlsx) con ventas, gastos, bajas y retiros de caja.</div>
      </div>
      ${navInferiorAdmin('datos')}`;
    document.getElementById('btn-tema').onclick = () => abrirSelectorTema(render);
    document.querySelectorAll('#seg-r button').forEach(b => { b.onclick = () => { rangoDatos = b.dataset.r; render(); }; });
    document.getElementById('sel-suc').onchange = e => { sucDatos = e.target.value; };
    document.getElementById('btn-excel').onclick = exportar;
    wireNavInferiorAdmin();
  }
  async function exportar() {
    const msg = document.getElementById('datos-msg'); msg.style.color = 'var(--text-secondary)'; msg.textContent = 'Preparando archivo…';
    const hoy = hoyISO();
    const desde = rangoDatos === 'mes' ? hoy.slice(0, 8) + '01' : rangoDatos === '90' ? sumarDias(hoy, -90) : '0000-00-00';
    const filas = [], T = [];
    const lista = sucursales.filter(s => sucDatos === 'todas' || s.id === sucDatos);
    const q = (ref, tipo, s, area, fn) => T.push(ref.where('fecha', '>=', desde).get().then(r => r.docs.forEach(d => filas.push(fn(d.data(), tipo, s, area)))));
    const hora = x => (x.creadoEn && x.creadoEn.toDate) ? x.creadoEn.toDate().toLocaleTimeString('es-BO', { hour: '2-digit', minute: '2-digit' }) : '';
    lista.forEach(s => {
      compsDe(s).forEach(c => {
        const base = db.collection('sucursales').doc(s.id).collection('compartimentos').doc(c), area = c === 'pizzeria' ? 'Pizzería' : 'Salteñería';
        q(base.collection('ventas'), 'Venta', s, area, (x, t) => [x.fecha, hora(x), s.nombre, area, t, x.producto, x.cantidad || 1, x.precioUnitario || '', x.monto, x.formaPago === 'qr' ? 'QR' : 'Efectivo']);
        q(base.collection('gastos'), 'Gasto', s, area, (x, t) => [x.fecha, hora(x), s.nombre, area, t, x.motivo, '', '', x.monto, '']);
        q(base.collection('mermas'), 'Baja', s, area, (x, t) => [x.fecha, hora(x), s.nombre, area, t, x.producto + (x.motivo ? ' (' + x.motivo + ')' : ''), x.cantidad, '', '', '']);
        q(base.collection('retiros'), 'Retiro de caja', s, area, (x, t) => [x.fecha, hora(x), s.nombre, area, t, 'Efectivo ' + (x.efectivo || 0) + ' · QR ' + (x.qr || 0), '', '', x.total, '']);
      });
      q(db.collection('sucursales').doc(s.id).collection('mermasCompartidas'), 'Baja', s, 'Compartido', (x, t) => [x.fecha, hora(x), s.nombre, 'Compartido', t, x.producto + (x.motivo ? ' (' + x.motivo + ')' : ''), x.cantidad, '', '', '']);
    });
    try { await conTiempoLimite(Promise.all(T), 40000, 'leer el historial'); } catch (e) { msg.style.color = 'var(--danger)'; msg.textContent = 'No se pudo leer el historial. Revisa tu conexión.'; return; }
    if (!filas.length) { msg.textContent = 'No hay movimientos en ese período.'; return; }
    filas.sort((a, b) => (b[0] + b[1]).localeCompare(a[0] + a[1]));
    const cab = ['Fecha', 'Hora', 'Sucursal', 'Área', 'Tipo', 'Detalle', 'Cantidad', 'Precio unit.', 'Monto Bs', 'Pago'];
    const bytes = crearXlsx([cab].concat(filas));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    a.download = 'salas-historial-' + hoy + '.xlsx';
    document.body.appendChild(a); a.click(); a.remove();
    msg.textContent = filas.length + ' movimientos exportados.';
  }
  render();
}

// ============================================================
// 9) Arranque
// ============================================================
async function iniciar() {
  try {
    app.innerHTML = `<div class="empty-state">Abriendo…</div>`;
    let usuario = null;
    try { usuario = await conTiempoLimite(usuarioGuardado(), 6000, 'comprobar sesión guardada'); } catch (e) {}
    if (!usuario && navigator.onLine) {
      try { await conTiempoLimite(auth.signInAnonymously(), 15000, 'iniciar sesión'); }
      catch (e) { if (navigator.onLine) throw e; }
    }
    await pantallaReportes();
  } catch (e) {
    const paso = (e && e.message && e.message.startsWith('TIMEOUT:'))
      ? 'tardó demasiado en: ' + e.message.replace('TIMEOUT:', '')
      : 'error inesperado';
    mostrarError(paso, e);
  }
}

function usuarioGuardado() {
  return new Promise((resolve) => {
    const cancelar = auth.onAuthStateChanged(user => { cancelar(); resolve(user); });
  });
}

iniciar();
</script>
