<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pizzería Salas · Salteñería Salas</title>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<style>
/* ============================================================
   DESIGN SYSTEM — Pizzería Salas / Salteñería Salas
   El color de acento es un solo "hue" (0-360, el círculo cromático
   completo) y el modo claro/oscuro es independiente. Cambiar --hue
   o [data-theme] cambia TODA la app sin tocar nada más.
   ============================================================ */
:root{
  --hue: 328; /* rosa por defecto */
  --accent: hsl(var(--hue) 72% 48%);
  --accent-hover: hsl(var(--hue) 72% 42%);
  --accent-light: hsl(var(--hue) 85% 95%);
  --bg: #fbf9fa;
  --surface: #ffffff;
  --surface-2: hsl(var(--hue) 30% 97%);
  --text-primary: #201c1f;
  --text-secondary: #7a7379;
  --border: hsl(var(--hue) 25% 90%);
  --success: #1a9e5c;
  --warning: #b4790f;
  --danger: #c0392b;
  --info: #2f7fd1;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --shadow-sm: 0 1px 3px rgba(20,10,15,0.06);
  --shadow-md: 0 4px 16px rgba(20,10,15,0.08);
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px;
}
[data-theme="dark"]{
  --bg: hsl(var(--hue) 18% 9%);
  --surface: hsl(var(--hue) 16% 13%);
  --surface-2: hsl(var(--hue) 14% 17%);
  --text-primary: #f3eef1;
  --text-secondary: #a79fa5;
  --border: hsl(var(--hue) 12% 22%);
  --accent-light: hsl(var(--hue) 45% 20%);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.35);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text-primary);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.screen{max-width:480px;margin:0 auto;min-height:100vh;padding:0 0 32px;display:flex;flex-direction:column;}

.t-title{font-size:1.5rem;font-weight:700;margin:0 0 2px;letter-spacing:-0.01em;}
.t-subtitle{font-size:1.05rem;font-weight:600;margin:0 0 2px;}
.t-body{font-size:0.95rem;line-height:1.4;}
.t-secondary{font-size:0.85rem;color:var(--text-secondary);}
.t-price{font-size:1.6rem;font-weight:800;color:var(--accent);}
.t-eyebrow{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-secondary);font-weight:700;}

.px{padding-left:var(--space-4);padding-right:var(--space-4);}
.stack > * + *{margin-top:var(--space-3);}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;}
.grow{flex:1;}

.header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-4);}
.header-btn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;color:var(--text-primary);cursor:pointer;
}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:15px;border:none;border-radius:var(--radius-md);
  font-size:1rem;font-weight:700;cursor:pointer;transition:transform .08s ease;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:disabled{opacity:0.45;}
.btn-secondary{background:var(--accent-light);color:var(--accent);}
.btn-tertiary{background:transparent;color:var(--text-secondary);}
.btn-danger{background:#fde8e5;color:var(--danger);}

.field{width:100%;}
.field label{display:block;font-size:0.82rem;color:var(--text-secondary);margin-bottom:6px;font-weight:600;}
.field input, .field select{
  width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-size:0.98rem;background:var(--surface);color:var(--text-primary);
}
.field input:focus, .field select:focus{outline:none;border-color:var(--accent);}
.search{position:relative;}
.search input{padding-left:38px;}
.search .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-secondary);}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:var(--space-4);box-shadow:var(--shadow-sm);
}
.card-flat{background:var(--surface-2);border-radius:var(--radius-md);padding:var(--space-4);}

.sucursal-item{
  display:flex;align-items:center;gap:var(--space-3);
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-md);
  padding:14px;margin-bottom:10px;cursor:pointer;
}
.sucursal-item .avatar{
  width:42px;height:42px;border-radius:12px;background:var(--accent-light);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;
}
.sucursal-item .info{flex:1;min-width:0;}
.sucursal-item .info .nombre{font-weight:700;font-size:0.98rem;}
.sucursal-item .info .zona{font-size:0.8rem;color:var(--text-secondary);}
.sucursal-item .arrow{color:var(--text-secondary);}

.compartimento-card{
  display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);
  padding:18px;cursor:pointer;
}
.compartimento-card .emoji{font-size:1.8rem;}
.compartimento-card .info .nombre{font-weight:700;font-size:1.05rem;}
.compartimento-card .info .turno{font-size:0.82rem;color:var(--text-secondary);}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:0.72rem;font-weight:700;}
.badge-neutral{background:var(--surface-2);color:var(--text-secondary);}
.badge-success{background:#e2f6ec;color:var(--success);}
.badge-warning{background:#fdf1de;color:var(--warning);}
.badge-danger{background:#fde8e5;color:var(--danger);}
.badge-accent{background:var(--accent-light);color:var(--accent);}

.alert{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;border-radius:var(--radius-md);font-size:0.88rem;}
.alert-info{background:var(--accent-light);color:var(--accent);}
.alert-warning{background:#fdf1de;color:var(--warning);}
.alert-danger{background:#fde8e5;color:var(--danger);}

.pin-dots{display:flex;gap:14px;justify-content:center;margin:var(--space-6) 0;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);}
.pin-dot.filled{background:var(--accent);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 var(--space-4);}
.keypad button{
  aspect-ratio:1;border-radius:var(--radius-lg);border:1px solid var(--border);
  background:var(--surface);font-size:1.4rem;font-weight:600;color:var(--text-primary);
}
.keypad button:active{background:var(--surface-2);}
.keypad button.ok{background:var(--accent);color:#fff;border-color:var(--accent);}

.stat-row{display:flex;gap:10px;}
.stat-box{flex:1;background:var(--surface-2);border-radius:var(--radius-md);padding:14px;text-align:center;}
.stat-box .valor{font-size:1.3rem;font-weight:800;}
.stat-box .lbl{font-size:0.75rem;color:var(--text-secondary);margin-top:2px;}

.toggle{display:flex;gap:8px;}
.toggle button{
  flex:1;padding:11px;border-radius:var(--radius-sm);border:1.5px solid var(--border);
  background:var(--surface);color:var(--text-primary);font-weight:700;font-size:0.9rem;
}
.toggle button.active{background:var(--accent);color:#fff;border-color:var(--accent);}

.hue-strip{
  height:44px;border-radius:22px;margin:var(--space-3) 0;position:relative;
  background:linear-gradient(to right,
    hsl(0 72% 55%), hsl(30 72% 55%), hsl(60 72% 55%), hsl(90 72% 55%),
    hsl(120 72% 55%), hsl(150 72% 55%), hsl(180 72% 55%), hsl(210 72% 55%),
    hsl(240 72% 55%), hsl(270 72% 55%), hsl(300 72% 55%), hsl(330 72% 55%), hsl(360 72% 55%));
}
.hue-strip input[type=range]{-webkit-appearance:none;width:100%;height:44px;background:transparent;margin:0;}
.hue-strip input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;
  border:3px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,0.3);
}
.swatch-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:var(--space-3);}
.swatch{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;}
.swatch.selected{border-color:var(--text-primary);}

.empty-state{text-align:center;padding:var(--space-8) var(--space-4);color:var(--text-secondary);}
.empty-state .icon{font-size:2.2rem;margin-bottom:8px;}
.error-text{color:var(--danger);font-size:0.85rem;text-align:center;min-height:1.2em;}

.logo-mark{
  width:84px;height:84px;border-radius:24px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:2.2rem;
  box-shadow:var(--shadow-md);margin-bottom:var(--space-4);
}

/* --- Header enriquecido --- */
.avatar-circle{
  width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;flex-shrink:0;
}
.header-rich{display:flex;align-items:center;gap:12px;padding:var(--space-4);}
.bell-btn{position:relative;}
.bell-dot{
  position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;
  background:var(--danger);border:2px solid var(--surface);
}

/* --- Botón de acceso rápido con icono --- */
.quick-btn{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:var(--surface-2);border:none;border-radius:var(--radius-md);
  padding:14px 6px;font-size:0.78rem;font-weight:700;color:var(--text-primary);flex:1;
}
.quick-btn .ic{font-size:1.35rem;}

/* --- Gráfico de ventas por hora --- */
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:var(--space-3);}
.chart-bars .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.chart-bars .bar{width:100%;max-width:22px;border-radius:6px 6px 2px 2px;background:var(--accent-light);transition:height .3s ease;}
.chart-bars .bar.filled{background:var(--accent);}
.chart-bars .bar-lbl{font-size:0.62rem;color:var(--text-secondary);margin-top:4px;}

/* --- Navegación inferior fija (reutilizable) --- */
.bottom-nav{
  position:sticky;bottom:0;display:flex;background:var(--surface);
  border-top:1px solid var(--border);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));
  margin-top:auto;
}
.bottom-nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:none;border:none;color:var(--text-secondary);font-size:0.66rem;font-weight:700;padding:4px;
}
.bottom-nav button .ic{font-size:1.3rem;}
.bottom-nav button.active{color:var(--accent);}
</style>
</head>
<body>

<div id="app" class="screen">Cargando…</div>

<script>
// ============================================================
// 1) TEMA — hue (0-360) + modo claro/oscuro, guardado por dispositivo
// ============================================================
function cargarTema() {
  const hue = localStorage.getItem('salas_hue');
  const modo = localStorage.getItem('salas_modo');
  if (hue) document.documentElement.style.setProperty('--hue', hue);
  if (modo === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
}
function aplicarHue(hue) {
  document.documentElement.style.setProperty('--hue', hue);
  localStorage.setItem('salas_hue', hue);
}
function aplicarModo(modo) {
  if (modo === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  localStorage.setItem('salas_modo', modo);
}
cargarTema();

// ============================================================
// 2) Conexión a Firebase (proyecto real: salas-94cef) — SIN CAMBIOS
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyDBH5au_DZDSUItcZtMuFXHIW_2mEJEG3o",
  authDomain: "salas-94cef.firebaseapp.com",
  projectId: "salas-94cef",
  storageBucket: "salas-94cef.firebasestorage.app",
  messagingSenderId: "537826891275",
  appId: "1:537826891275:web:f8ad974c16f973fbf3d90e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
db.enablePersistence({ synchronizeTabs: true }).catch(err => {
  console.warn('No se pudo activar persistencia offline:', err.code);
});

const SUCURSAL_PRUEBA_ID = 'periferica_prueba';
const SUCURSAL_PRUEBA_NOMBRE = 'Periférica (PRUEBA)';
const PIN_PIZZERIA_PRUEBA = '1111';
const PIN_SALTENERIA_PRUEBA = '2222';

async function asegurarSucursalPrueba() {
  const ref = db.collection('sucursales').doc(SUCURSAL_PRUEBA_ID);
  const snap = await ref.get();
  if (!snap.exists) {
    await ref.set({
      nombre: SUCURSAL_PRUEBA_NOMBRE,
      zona: 'Sucursal de prueba',
      orden: 1,
      activo: true,
      tieneSalteneria: true,
      tieneCajasPizza: true,
      compartimentos: {
        pizzeria: { empleadoNombre: 'Empleado Pizzería (prueba)', pin: PIN_PIZZERIA_PRUEBA },
        salteneria: { empleadoNombre: 'Empleado Salteñería (prueba)', pin: PIN_SALTENERIA_PRUEBA }
      },
      schemaVersion: 1
    });
  }
}

async function cargarSucursales() {
  const snap = await conTiempoLimite(
    db.collection('sucursales').where('activo', '==', true).get(),
    15000, 'cargar sucursales'
  );
  const lista = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  lista.sort((a, b) => (a.orden || 99) - (b.orden || 99));
  return lista;
}

// ============================================================
// 3) Estado de la app
// ============================================================
let sucursalActual = null;
let compartimentoActual = null;
const app = document.getElementById('app');

function hoyISO() {
  return new Date().toISOString().slice(0, 10);
}

function conTiempoLimite(promesa, ms, etiqueta) {
  return Promise.race([
    promesa,
    new Promise((_, reject) => setTimeout(() => reject(new Error('TIMEOUT:' + etiqueta)), ms))
  ]);
}

function mostrarError(paso, e) {
  const detalle = (e && (e.code || e.message)) ? (e.code || '') + ' ' + (e.message || e) : String(e);
  app.innerHTML = `
    <div class="px stack" style="padding-top:60px;">
      <div class="t-title">No se pudo conectar</div>
      <div class="t-secondary">Se quedó atascado en: <b>${paso}</b></div>
      <div class="card"><div class="error-text" style="text-align:left;">${detalle}</div></div>
      <button class="btn btn-primary" id="btn-reintentar">Reintentar</button>
    </div>
  `;
  document.getElementById('btn-reintentar').onclick = iniciar;
}

// ============================================================
// 4) PANTALLA: Selector de tema (accesible desde el header)
// ============================================================
function abrirSelectorTema(pantallaAnterior) {
  const hueActual = getComputedStyle(document.documentElement).getPropertyValue('--hue').trim() || 328;
  const modoActual = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const preset = [15, 340, 328, 300, 265, 230, 200, 170, 140, 95, 55, 30];

  app.innerHTML = `
    <div class="header">
      <button class="header-btn" id="btn-cerrar">‹</button>
      <div class="t-subtitle">Elige tu color</div>
      <div style="width:38px;"></div>
    </div>
    <div class="px stack">
      <div class="t-secondary">Desliza para elegir cualquier color del círculo cromático, o toca uno de los sugeridos.</div>
      <div class="hue-strip">
        <input type="range" min="0" max="360" value="${hueActual}" id="hue-slider">
      </div>
      <div class="swatch-grid" id="swatch-grid">
        ${preset.map(h => `<div class="swatch ${String(h)===String(hueActual)?'selected':''}" data-hue="${h}" style="background:hsl(${h} 72% 50%)"></div>`).join('')}
      </div>
      <div class="t-eyebrow" style="margin-top:var(--space-5);">Apariencia</div>
      <div class="toggle">
        <button data-modo="light" class="${modoActual==='light'?'active':''}">☀️ Claro</button>
        <button data-modo="dark" class="${modoActual==='dark'?'active':''}">🌙 Oscuro</button>
      </div>
      <div class="card" style="margin-top:var(--space-5);">
        <div class="t-eyebrow">Vista previa</div>
        <div class="row" style="margin-top:8px;">
          <span class="badge badge-accent">Activo</span>
          <span class="badge badge-success">Normal</span>
          <span class="badge badge-warning">Bajo</span>
        </div>
        <button class="btn btn-primary" style="margin-top:12px;">Botón principal</button>
      </div>
    </div>
  `;
  document.getElementById('btn-cerrar').onclick = pantallaAnterior;
  document.getElementById('hue-slider').oninput = (e) => aplicarHue(e.target.value);
  document.querySelectorAll('#swatch-grid .swatch').forEach(s => {
    s.onclick = () => { aplicarHue(s.dataset.hue); abrirSelectorTema(pantallaAnterior); };
  });
  document.querySelectorAll('.toggle button').forEach(b => {
    b.onclick = () => { aplicarModo(b.dataset.modo); abrirSelectorTema(pantallaAnterior); };
  });
}

// ============================================================
// 5) PANTALLA: Bienvenida
// ============================================================
function pantallaBienvenida() {
  app.innerHTML = `
    <div class="header" style="justify-content:flex-end;">
      <button class="header-btn" id="btn-tema">🎨</button>
    </div>
    <div class="grow center px" style="justify-content:center;">
      <div class="logo-mark">🍕</div>
      <div class="t-title">PIZZERÍA SALAS</div>
      <div class="t-title" style="color:var(--accent);">SALTEÑERÍA SALAS</div>
      <div class="t-secondary" style="margin-top:8px;">Dos sabores, una sola app.</div>
    </div>
    <div class="px" style="padding-bottom:20px;">
      <button class="btn btn-primary" id="btn-comenzar">Comenzar</button>
    </div>
  `;
  document.getElementById('btn-tema').onclick = () => abrirSelectorTema(pantallaBienvenida);
  document.getElementById('btn-comenzar').onclick = pantallaSeleccionSucursal;
}

// ============================================================
// 6) PANTALLA: Selección de sucursal
// ============================================================
async function pantallaSeleccionSucursal() {
  app.innerHTML = `<div class="empty-state">Cargando sucursales…</div>`;
  let sucursales = [];
  try {
    sucursales = await cargarSucursales();
  } catch (e) {
    return mostrarError('cargar sucursales', e);
  }

  function render(filtro) {
    filtro = filtro || '';
    const filtradas = sucursales.filter(s => s.nombre.toLowerCase().includes(filtro.toLowerCase()));
    app.innerHTML = `
      <div class="header">
        <button class="header-btn" id="btn-atras">‹</button>
        <div class="t-subtitle">Selecciona tu sucursal</div>
        <button class="header-btn" id="btn-tema">🎨</button>
      </div>
      <div class="px stack">
        <div class="search">
          <span class="icon">🔍</span>
          <input type="text" id="in-buscar" placeholder="Buscar sucursal..." value="${filtro}">
        </div>
        <div id="lista-sucursales">
          ${filtradas.length === 0 ? `
            <div class="empty-state"><div class="icon">🏬</div>No se encontró esa sucursal.</div>
          ` : filtradas.map((s, i) => `
            <div class="sucursal-item" data-id="${s.id}">
              <div class="avatar">🏬</div>
              <div class="info">
                <div class="nombre">Sucursal ${s.orden || i + 1} · ${s.nombre.replace(' (PRUEBA)','')}</div>
                <div class="zona">${s.zona || 'Sucursal'}</div>
              </div>
              <div class="arrow">›</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    document.getElementById('btn-atras').onclick = pantallaBienvenida;
    document.getElementById('btn-tema').onclick = () => abrirSelectorTema(() => render(filtro));
    document.getElementById('in-buscar').oninput = (e) => render(e.target.value);
    document.querySelectorAll('.sucursal-item').forEach(el => {
      el.onclick = () => {
        sucursalActual = sucursales.find(s => s.id === el.dataset.id);
        pantallaElegirCompartimento();
      };
    });
  }
  render('');
}

// ============================================================
// 7) PANTALLA: Selección de compartimento
// ============================================================
function pantallaElegirCompartimento() {
  const tiene = sucursalActual.tieneSalteneria;
  app.innerHTML = `
    <div class="header">
      <button class="header-btn" id="btn-atras">‹</button>
      <div class="t-subtitle">¿Qué área vas a usar?</div>
      <button class="header-btn" id="btn-tema">🎨</button>
    </div>
    <div class="px stack">
      <div class="t-secondary">${sucursalActual.nombre}</div>
      <button class="compartimento-card" id="btn-pizzeria">
        <span class="emoji">🍕</span>
        <div class="info">
          <div class="nombre">Pizzería</div>
          <div class="turno">Turno tarde</div>
        </div>
      </button>
      ${tiene ? `
      <button class="compartimento-card" id="btn-salteneria">
        <span class="emoji">🥟</span>
        <div class="info">
          <div class="nombre">Salteñería</div>
          <div class="turno">Turno mañana</div>
        </div>
      </button>` : ''}
      <div class="alert alert-info">💡 Los refrescos usan stock compartido dentro de la sucursal.</div>
    </div>
  `;
  document.getElementById('btn-atras').onclick = pantallaSeleccionSucursal;
  document.getElementById('btn-tema').onclick = () => abrirSelectorTema(pantallaElegirCompartimento);
  document.getElementById('btn-pizzeria').onclick = () => pantallaPin('pizzeria');
  if (tiene) document.getElementById('btn-salteneria').onclick = () => pantallaPin('salteneria');
}

// ============================================================
// 8) PANTALLA: Ingreso por PIN
// ============================================================
function pantallaPin(compartimento) {
  let pin = '';
  const nombreComp = compartimento === 'pizzeria' ? '🍕 Pizzería' : '🥟 Salteñería';

  function render() {
    app.innerHTML = `
      <div class="header">
        <button class="header-btn" id="btn-atras">‹</button>
        <div class="t-subtitle">Ingresa tu PIN</div>
        <div style="width:38px;"></div>
      </div>
      <div class="px center">
        <div class="badge badge-accent">${nombreComp}</div>
        <div class="t-secondary" style="margin-top:6px;">${sucursalActual.nombre}</div>
      </div>
      <div class="pin-dots">
        ${[0,1,2,3].map(i => `<div class="pin-dot ${i < pin.length ? 'filled' : ''}"></div>`).join('')}
      </div>
      <div class="keypad">
        ${[1,2,3,4,5,6,7,8,9].map(n => `<button data-n="${n}">${n}</button>`).join('')}
        <button data-n="borrar">⌫</button>
        <button data-n="0">0</button>
        <button data-n="ok" class="ok">✓</button>
      </div>
      <div class="error-text" id="pin-error" style="margin-top:var(--space-4);"></div>
      <div class="t-secondary" style="text-align:center;margin-top:8px;">PIN de prueba: ${compartimento === 'pizzeria' ? PIN_PIZZERIA_PRUEBA : PIN_SALTENERIA_PRUEBA}</div>
    `;
    document.getElementById('btn-atras').onclick = pantallaElegirCompartimento;
    document.querySelectorAll('.keypad button').forEach(b => {
      b.onclick = () => {
        const n = b.dataset.n;
        if (n === 'borrar') pin = pin.slice(0, -1);
        else if (n === 'ok') validar();
        else if (pin.length < 4) pin += n;
        render();
      };
    });
  }

  async function validar() {
    const comp = sucursalActual.compartimentos[compartimento];
    if (pin === comp.pin) {
      compartimentoActual = compartimento;
      app.innerHTML = `<div class="empty-state">Entrando…</div>`;
      try {
        await pantallaPrincipal();
      } catch (e) {
        mostrarError('cargar la pantalla principal', e);
      }
    } else {
      document.getElementById('pin-error').textContent = 'PIN incorrecto, intenta de nuevo';
      pin = '';
      render();
    }
  }

  render();
}

// ============================================================
// 9) PANTALLA: Inicio del empleado (lógica de ventas sin cambios)
// ============================================================
async function pantallaPrincipal() {
  const comp = sucursalActual.compartimentos[compartimentoActual];
  const nombreComp = compartimentoActual === 'pizzeria' ? 'Pizzería' : 'Salteñería';
  const ventasRef = db.collection('sucursales').doc(sucursalActual.id)
    .collection('compartimentos').doc(compartimentoActual)
    .collection('ventas');

  // --- Catálogo (solo lo que corresponde a cada compartimento) ---
  const TAMANOS_PIZZA = ['Grande', 'Mediana', 'Pequeña', 'Escolar', 'Cono Pizza'];
  const SABORES_PIZZA = {
    'Grande': ['Carnívora', 'Tradicional', 'Mixta', 'Hawaiana'],
    'Mediana': ['Carnívora', 'Tradicional', 'Mixta', 'Hawaiana'],
    'Pequeña': ['Carnívora', 'Tradicional', 'Mixta', 'Hawaiana'],
    'Escolar': ['Tradicional', 'Mixta', 'Hawaiana'],
    'Cono Pizza': []
  };
  const TAMANOS_REFRESCO = ['Personal', 'Cascada', 'Popular'];

  const tabsDisponibles = compartimentoActual === 'pizzeria'
    ? [{ id: 'pizza', lbl: '🍕 Pizza' }, { id: 'refresco', lbl: '🥤 Refresco' }, { id: 'cafe', lbl: '☕ Café/Té' }]
    : [{ id: 'saltena', lbl: '🥟 Salteña' }, { id: 'refresco', lbl: '🥤 Refresco' }, { id: 'cafe', lbl: '☕ Café/Té' }];

  let tabActiva = tabsDisponibles[0].id;
  let pizzaTamano = null;
  let productoElegido = null; // texto final que se guarda como venta

  function armarSelectorProducto() {
    return `
      <div class="toggle" id="tabs-producto">
        ${tabsDisponibles.map(t => `<button class="${t.id===tabActiva?'active':''}" data-tab="${t.id}">${t.lbl}</button>`).join('')}
      </div>
      <div id="opciones-producto" style="margin-top:10px;"></div>
      <div class="t-secondary" id="producto-elegido-lbl" style="margin-top:8px;"></div>
    `;
  }

  function renderOpciones() {
    const cont = document.getElementById('opciones-producto');
    if (!cont) return;
    if (tabActiva === 'pizza') {
      if (!pizzaTamano) {
        cont.innerHTML = `
          <div class="t-eyebrow" style="margin-bottom:6px;">Tamaño</div>
          <div class="stat-row" style="flex-wrap:wrap;">
            ${TAMANOS_PIZZA.map(t => `<button class="btn btn-secondary" data-tamano="${t}" style="flex:1 1 45%;">${t}</button>`).join('')}
          </div>
        `;
        cont.querySelectorAll('[data-tamano]').forEach(b => {
          b.onclick = () => { pizzaTamano = b.dataset.tamano; renderOpciones(); };
        });
      } else if (SABORES_PIZZA[pizzaTamano].length === 0) {
        seleccionarProducto(`Pizza ${pizzaTamano}`);
        pizzaTamano = null;
      } else {
        cont.innerHTML = `
          <div class="row"><div class="t-eyebrow">Sabor — ${pizzaTamano}</div><button class="t-secondary" id="btn-cambiar-tamano" style="background:none;border:none;">‹ cambiar tamaño</button></div>
          <div class="stat-row" style="flex-wrap:wrap;margin-top:6px;">
            ${SABORES_PIZZA[pizzaTamano].map(s => `<button class="btn btn-secondary" data-sabor="${s}" style="flex:1 1 45%;">${s}</button>`).join('')}
          </div>
        `;
        document.getElementById('btn-cambiar-tamano').onclick = () => { pizzaTamano = null; renderOpciones(); };
        cont.querySelectorAll('[data-sabor]').forEach(b => {
          b.onclick = () => { seleccionarProducto(`Pizza ${pizzaTamano} ${b.dataset.sabor}`); pizzaTamano = null; };
        });
      }
    } else if (tabActiva === 'saltena') {
      cont.innerHTML = `<button class="btn btn-secondary" id="btn-saltena">🥟 Salteña mixta</button>`;
      document.getElementById('btn-saltena').onclick = () => seleccionarProducto('Salteña mixta');
    } else if (tabActiva === 'refresco') {
      cont.innerHTML = `
        <div class="stat-row" style="flex-wrap:wrap;">
          ${TAMANOS_REFRESCO.map(t => `<button class="btn btn-secondary" data-refresco="${t}" style="flex:1 1 30%;">${t}</button>`).join('')}
        </div>
      `;
      cont.querySelectorAll('[data-refresco]').forEach(b => {
        b.onclick = () => seleccionarProducto(`Refresco ${b.dataset.refresco}`);
      });
    } else if (tabActiva === 'cafe') {
      cont.innerHTML = `
        <div class="stat-row">
          <button class="btn btn-secondary" data-cafe="Café">☕ Café</button>
          <button class="btn btn-secondary" data-cafe="Té">🍵 Té</button>
        </div>
      `;
      cont.querySelectorAll('[data-cafe]').forEach(b => {
        b.onclick = () => seleccionarProducto(b.dataset.cafe);
      });
    }
  }

  function seleccionarProducto(nombre) {
    productoElegido = nombre;
    const lbl = document.getElementById('producto-elegido-lbl');
    const btnAgregar = document.getElementById('btn-agregar');
    if (lbl) lbl.innerHTML = `<span class="badge badge-accent">Elegido: ${nombre}</span>`;
    if (btnAgregar) btnAgregar.disabled = false;
  }

  function wireSelectorProducto() {
    document.querySelectorAll('#tabs-producto button').forEach(b => {
      b.onclick = () => {
        tabActiva = b.dataset.tab; pizzaTamano = null; productoElegido = null;
        document.querySelectorAll('#tabs-producto button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        const lbl = document.getElementById('producto-elegido-lbl'); if (lbl) lbl.innerHTML = '';
        const btnAgregar = document.getElementById('btn-agregar'); if (btnAgregar) btnAgregar.disabled = true;
        renderOpciones();
      };
    });
    renderOpciones();
  }

  async function cargarVentasHoy() {
    const hoy = hoyISO();
    const snap = await conTiempoLimite(ventasRef.where('fecha', '==', hoy).get(), 15000, 'cargar ventas de hoy');
    const lista = snap.docs.map(d => d.data());
    lista.sort((a, b) => {
      const ta = a.creadoEn && a.creadoEn.toMillis ? a.creadoEn.toMillis() : 0;
      const tb = b.creadoEn && b.creadoEn.toMillis ? b.creadoEn.toMillis() : 0;
      return tb - ta;
    });
    return lista;
  }

  async function render() {
    const ventas = await cargarVentasHoy();
    const totalEfectivo = ventas.filter(v => v.formaPago === 'efectivo').reduce((a, v) => a + v.monto, 0);
    const totalQr = ventas.filter(v => v.formaPago === 'qr').reduce((a, v) => a + v.monto, 0);
    const totalHoy = totalEfectivo + totalQr;

    // Ventas por hora (real, a partir de los timestamps de hoy)
    const horaInicio = 8, horaFin = 21; // franja horaria típica de atención
    const porHora = {};
    for (let h = horaInicio; h <= horaFin; h++) porHora[h] = 0;
    ventas.forEach(v => {
      if (v.creadoEn && v.creadoEn.toDate) {
        const h = v.creadoEn.toDate().getHours();
        if (porHora[h] !== undefined) porHora[h] += v.monto;
      }
    });
    const maxHora = Math.max(1, ...Object.values(porHora));
    const horasAMostrar = [8,10,12,14,16,18,20];
    const iniciales = (comp.empleadoNombre.replace(' (prueba)','').match(/\b\w/g) || ['E']).slice(0,2).join('').toUpperCase();

    app.innerHTML = `
      <div class="header-rich">
        <div class="avatar-circle">${iniciales}</div>
        <div class="grow">
          <div class="t-subtitle">Hola, ${comp.empleadoNombre.replace(' (prueba)','')}</div>
          <div class="t-secondary">${sucursalActual.nombre.replace(' (PRUEBA)','')} · ${nombreComp}</div>
        </div>
        <button class="header-btn bell-btn" id="btn-tema">🎨</button>
        <button class="header-btn" id="btn-salir">⎋</button>
      </div>
      <div class="px stack">
        <div class="stat-row">
          <div class="stat-box">
            <div class="valor">${totalHoy.toFixed(0)} Bs</div>
            <div class="lbl">💰 Ventas hoy</div>
          </div>
          <div class="stat-box">
            <div class="valor">${totalEfectivo.toFixed(0)} Bs</div>
            <div class="lbl">💵 Caja efectivo</div>
          </div>
        </div>

        <button class="btn btn-primary" id="btn-mostrar-form">➕ Registrar venta</button>

        <div class="card" id="form-venta" style="display:none;">
          ${armarSelectorProducto()}
          <div class="field" style="margin-top:12px;"><label>Precio en Bs</label><input type="number" id="in-monto" inputmode="decimal" placeholder="0.00"></div>
          <div class="toggle" id="toggle-pago" style="margin-top:10px;">
            <button class="active" data-pago="efectivo">💵 Efectivo</button>
            <button data-pago="qr">📱 QR</button>
          </div>
          <button class="btn btn-primary" id="btn-agregar" style="margin-top:12px;" disabled>Agregar venta</button>
          <div class="error-text" id="venta-error"></div>
        </div>

        <div class="t-eyebrow" style="margin-top:var(--space-2);">Accesos rápidos</div>
        <div class="stat-row">
          <button class="quick-btn" data-proximamente="Stock"><span class="ic">📦</span>Stock</button>
          <button class="quick-btn" data-proximamente="Historial"><span class="ic">🕘</span>Historial</button>
          <button class="quick-btn" data-proximamente="Caja"><span class="ic">💰</span>Caja</button>
          <button class="quick-btn" data-proximamente="Reportes"><span class="ic">📊</span>Reportes</button>
        </div>

        <div class="t-eyebrow" style="margin-top:var(--space-2);">Ventas de hoy (${ventas.length})</div>
        <div class="card-flat">
          ${ventas.length === 0 ? `<div class="t-secondary">Aún no hay ventas registradas hoy.</div>` : ventas.map(v => `
            <div class="row" style="padding:6px 0;border-bottom:1px solid var(--border);">
              <span class="t-body">${v.producto}</span>
              <strong>${v.monto.toFixed(2)} Bs</strong>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="bottom-nav">
        <button class="active"><span class="ic">🏠</span>Inicio</button>
        <button data-proximamente="Ventas"><span class="ic">🛒</span>Ventas</button>
        <button data-proximamente="Stock"><span class="ic">📦</span>Stock</button>
        <button data-proximamente="Historial"><span class="ic">🕘</span>Historial</button>
        <button data-proximamente="Caja"><span class="ic">💰</span>Caja</button>
      </div>
    `;

    document.getElementById('btn-tema').onclick = () => abrirSelectorTema(render);
    document.getElementById('btn-salir').onclick = () => { compartimentoActual = null; pantallaElegirCompartimento(); };
    document.getElementById('btn-mostrar-form').onclick = () => {
      document.getElementById('form-venta').style.display = 'block';
      document.getElementById('btn-mostrar-form').style.display = 'none';
      wireSelectorProducto();
    };
    document.querySelectorAll('[data-proximamente]').forEach(b => {
      b.onclick = () => alert(b.dataset.proximamente + ': próximamente en esta base visual.');
    });

    let formaPago = 'efectivo';
    document.querySelectorAll('#toggle-pago button').forEach(b => {
      b.onclick = () => {
        formaPago = b.dataset.pago;
        document.querySelectorAll('#toggle-pago button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
      };
    });

    document.getElementById('btn-agregar').onclick = async () => {
      const producto = productoElegido;
      const monto = parseFloat(document.getElementById('in-monto').value);
      const errorEl = document.getElementById('venta-error');
      if (!producto || isNaN(monto) || monto <= 0) {
        errorEl.textContent = 'Elige un producto y un precio válido';
        return;
      }
      errorEl.textContent = 'Guardando…';
      try {
        await ventasRef.add({
          producto, monto, formaPago,
          fecha: hoyISO(),
          creadoEn: firebase.firestore.FieldValue.serverTimestamp(),
          schemaVersion: 1
        });
        await render();
      } catch (e) {
        errorEl.textContent = 'No se pudo guardar (sin internet: se guardará solo cuando vuelva la conexión)';
      }
    };
  }

  await render();
}

// ============================================================
// 10) Arranque
// ============================================================
async function iniciar() {
  try {
    app.innerHTML = `<div class="empty-state">Conectando…</div>`;
    try {
      await conTiempoLimite(auth.setPersistence(firebase.auth.Auth.Persistence.NONE), 5000, 'preparar sesión');
    } catch (e) { /* si esto se cuelga o falla, seguimos igual sin bloquear */ }
    await conTiempoLimite(auth.signInAnonymously(), 15000, 'iniciar sesión');
    await conTiempoLimite(asegurarSucursalPrueba(), 15000, 'crear sucursal de prueba');
    pantallaBienvenida();
  } catch (e) {
    const paso = (e && e.message && e.message.startsWith('TIMEOUT:'))
      ? 'tardó demasiado en: ' + e.message.replace('TIMEOUT:', '')
      : 'error inesperado';
    mostrarError(paso, e);
  }
}

iniciar();
</script>
